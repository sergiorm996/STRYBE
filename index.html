<style>
  :root {
    --bg: #0D0F12;
    --card-1: rgba(26, 29, 34, 0.55);
    --card-2: rgba(26, 29, 34, 0.82);
    --stroke: rgba(255, 255, 255, 0.08);
    --stroke-strong: rgba(255, 255, 255, 0.14);
    --text: #F4F7F5;
    --text-dim: rgba(244, 247, 245, 0.62);
    --text-faint: rgba(244, 247, 245, 0.42);
    --radius: 28px;
    --radius-sm: 20px;
    --shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    --lime: #C6FF00;
    --lime-deep: #7CFF00;
    --lime-ink: #06210a;
    --lime-glow: rgba(198, 255, 0, 0.42);
    --lime-soft: rgba(198, 255, 0, 0.1);
    --blue-a: #3B82F6; --blue-b: #60A5FA;
    --violet-a: #8B5CF6; --violet-b: #D946EF;
    --coral-a: #F43F5E; --coral-b: #FB923C;
    --amber-a: #F59E0B; --amber-b: #FACC15;
    --cyan-a: #06B6D4; --cyan-b: #22D3EE;
    --danger: #FB7185;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    --vh: 100vh;
  }
  @supports (height: 100dvh) { :root { --vh: 100dvh; } }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
    overscroll-behavior: none;
  }
  #root { height: var(--vh); }
  button { font-family: inherit; color: inherit; border: none; background: none; cursor: pointer; }
  button:disabled { cursor: default; }
  input { font-family: inherit; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .cond { font-family: 'Montserrat', sans-serif; }

  /* ---------- App shell / phone frame ---------- */
  .app-shell {
    position: relative; width: 100%; max-width: 440px; height: var(--vh);
    margin: 0 auto; overflow: hidden; background: var(--bg); isolation: isolate;
  }
  @media (min-width: 480px) {
    body { display: flex; align-items: center; justify-content: center; background: #000; }
    .app-shell {
      width: 440px; flex: 0 0 440px;
      height: 900px; max-height: 96vh; border-radius: 46px;
      border: 1px solid rgba(255,255,255,0.07);
      box-shadow: 0 40px 120px rgba(0,0,0,0.7), inset 0 0 0 8px #060809;
    }
  }

  /* ---------- Auroras (estáticas en el entreno para ahorrar batería) ---------- */
  .aurora-field { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .aurora { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.38; }
  .aurora.a1 { width: 360px; height: 360px; top: -120px; left: -90px;
    background: radial-gradient(circle, rgba(198,255,0,0.5), transparent 70%); animation: drift1 18s ease-in-out infinite; }
  .aurora.a2 { width: 320px; height: 320px; top: 35%; right: -120px;
    background: radial-gradient(circle, rgba(139,92,246,0.45), transparent 70%); animation: drift2 22s ease-in-out infinite; }
  .aurora.a3 { width: 300px; height: 300px; bottom: -100px; left: 10%;
    background: radial-gradient(circle, rgba(59,130,246,0.38), transparent 70%); animation: drift3 26s ease-in-out infinite; }
  .aurora-field.still .aurora { animation: none; opacity: 0.25; }
  @keyframes drift1 { 0%,100%{transform:translate3d(0,0,0)} 50%{transform:translate3d(60px,40px,0)} }
  @keyframes drift2 { 0%,100%{transform:translate3d(0,0,0)} 50%{transform:translate3d(-50px,60px,0)} }
  @keyframes drift3 { 0%,100%{transform:translate3d(0,0,0)} 50%{transform:translate3d(40px,-50px,0)} }

  /* ---------- Scroll area ---------- */
  .screen-scroll {
    position: absolute; inset: 0; z-index: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
    padding: calc(var(--safe-t) + 18px) 18px calc(130px + var(--safe-b)); -webkit-overflow-scrolling: touch;
  }
  .screen-scroll.no-nav { padding-bottom: calc(40px + var(--safe-b)); }
  .screen-scroll.with-rest { padding-bottom: calc(130px + var(--safe-b)); }
  .screen-anim { animation: screenIn 0.42s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes screenIn { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: translateX(0); } }
  .pop-anim { animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes popIn { from { opacity: 0; transform: translateY(30px) scale(0.97); } to { opacity: 1; transform: none; } }

  /* ---------- Glass ---------- */
  .glass { background: var(--card-1); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border-radius: var(--radius); border: 1px solid var(--stroke); box-shadow: var(--shadow); }
  .glass-2 { background: var(--card-2); }
  .bento { padding: 18px; }
  .press { transition: transform 0.12s ease; }
  .press:active { transform: scale(0.96); }

  /* ---------- Typography ---------- */
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-dim); }
  .h-title { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
  .num-xl { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
  .dim { color: var(--text-dim); }
  .faint { color: var(--text-faint); }

  /* ---------- Brand bar ---------- */
  .brand-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .brand-word { font-family: 'Montserrat', sans-serif; font-weight: 800; font-style: italic;
    font-size: 23px; letter-spacing: 0.06em; color: var(--lime); text-shadow: 0 0 18px var(--lime-glow); }

  /* ---------- Header ---------- */
  .home-head { display: flex; align-items: center; gap: 13px; margin-bottom: 20px; }
  .avatar-ring { width: 54px; height: 54px; border-radius: 17px; flex-shrink: 0; display: grid; place-items: center; font-size: 26px;
    background: #090c0f; border: 2px solid var(--lime); box-shadow: 0 0 18px var(--lime-glow); overflow: hidden; }
  .avatar-ring img { width: 100%; height: 100%; object-fit: cover; border-radius: 15px; }
  .streak-chip { margin-left: auto; display: flex; align-items: center; gap: 5px;
    background: linear-gradient(135deg, rgba(251,146,60,0.18), rgba(244,63,94,0.16));
    border: 1px solid rgba(251,146,60,0.35); color: #FFB27A; font-weight: 600; font-size: 13px; padding: 7px 12px; border-radius: 14px; }

  /* ---------- Section ---------- */
  .section-head { display: flex; align-items: center; justify-content: space-between; margin: 26px 4px 13px; }
  .section-head h2 { font-size: 19px; font-weight: 600; letter-spacing: -0.02em; }
  .section-link { font-size: 13px; color: var(--lime); font-weight: 600; padding: 6px 2px; }

  /* ---------- Stat grid ---------- */
  .bento-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 11px; }
  .stat-card { padding: 16px 10px; text-align: center; }
  .stat-val { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-family: 'Montserrat', sans-serif; white-space: nowrap; }
  .stat-val small { font-size: 13px; font-weight: 600; color: var(--text-dim); margin-left: 2px; }
  .stat-label { font-size: 11px; color: var(--text-dim); font-weight: 500; margin-top: 6px; }

  /* ---------- Week strip ---------- */
  .week-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 11px; padding: 12px 10px; }
  .wd { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .wd-l { font-size: 10.5px; font-weight: 600; color: var(--text-faint); text-transform: uppercase; }
  .wd-c { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; font-size: 16px;
    background: rgba(255,255,255,0.04); border: 1px solid var(--stroke); }
  .wd.today .wd-l { color: var(--lime); }
  .wd.today .wd-c { border-color: rgba(198,255,0,0.55); }
  .wd-c.train { background: var(--lime-soft); border-color: rgba(198,255,0,0.3); }

  /* ---------- Banner ---------- */
  .banner { display: flex; align-items: center; gap: 13px; padding: 15px 16px; margin-bottom: 14px; border-radius: 22px;
    background: linear-gradient(135deg, rgba(198,255,0,0.14), rgba(124,255,0,0.05)); border: 1px solid rgba(198,255,0,0.35); }
  .banner .b-ico { font-size: 26px; }
  .banner .b-t { font-weight: 700; font-size: 15px; }
  .banner .b-s { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; }
  .banner-actions { display: flex; gap: 8px; margin-left: auto; flex-shrink: 0; }
  .chip-btn { padding: 9px 13px; border-radius: 12px; font-weight: 700; font-size: 13px; background: var(--card-2); border: 1px solid var(--stroke); }
  .chip-btn.lime { background: var(--lime); color: var(--lime-ink); border-color: transparent; }

  /* ---------- Action buttons ---------- */
  .action-grid { display: flex; flex-direction: column; gap: 12px; }
  .action-btn { display: flex; align-items: center; gap: 15px; padding: 18px; border-radius: 22px; text-align: left; width: 100%; }
  .action-ico { width: 50px; height: 50px; border-radius: 16px; display: grid; place-items: center; font-size: 25px; flex-shrink: 0; }
  .action-btn .t { font-size: 17px; font-weight: 600; }
  .action-btn .s { font-size: 12.5px; color: var(--text-dim); margin-top: 1px; }
  .action-arrow { margin-left: auto; color: var(--text-faint); font-size: 24px; }
  .action-btn.primary { background: linear-gradient(135deg, var(--lime), var(--lime-deep)); border: none; box-shadow: 0 12px 34px var(--lime-glow); }
  .action-btn.primary .t, .action-btn.primary .s, .action-btn.primary .action-arrow { color: var(--lime-ink); }
  .action-btn.primary .s { opacity: 0.75; }
  .action-btn.primary .action-ico { background: rgba(6,33,10,0.18); }

  /* ---------- Week control ---------- */
  .week-ctrl { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .week-btn { width: 46px; height: 46px; border-radius: 15px; background: var(--card-2); border: 1px solid var(--stroke);
    display: grid; place-items: center; font-size: 24px; font-weight: 600; color: var(--lime); flex-shrink: 0; }
  .week-btn:disabled { opacity: 0.3; color: var(--text-dim); }
  .week-num { font-size: 38px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-family: 'Montserrat', sans-serif; }

  /* ---------- Routine cards ---------- */
  .routine-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
  .routine-card { padding: 18px; position: relative; overflow: hidden; min-height: 132px; display: flex; flex-direction: column; }
  .routine-ico { width: 48px; height: 48px; border-radius: 15px; display: grid; place-items: center; font-size: 25px; margin-bottom: 12px; }
  .routine-name { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
  .routine-sub { font-size: 12px; color: var(--text-dim); margin-top: 3px; }
  .routine-day { position: absolute; top: 14px; right: 16px; font-size: 11px; font-weight: 600; color: var(--text-faint); letter-spacing: 0.08em; }
  .routine-done { position: absolute; top: 12px; right: 12px; font-size: 11px; font-weight: 700; color: var(--lime-ink); background: var(--lime);
    padding: 4px 8px; border-radius: 9px; letter-spacing: 0.04em; }
  .routine-card.done { opacity: 0.72; }

  /* ---------- Options ---------- */
  .opt-row { display: flex; gap: 11px; }
  .opt { flex: 1; padding: 18px 12px; border-radius: 18px; text-align: center; background: var(--card-1); border: 1px solid var(--stroke);
    font-weight: 600; font-size: 14px; transition: background 0.2s, color 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .opt .oico { font-size: 24px; }
  .opt.on { background: var(--lime); color: var(--lime-ink); border-color: transparent; box-shadow: 0 8px 22px var(--lime-glow); }
  .opt.sm { padding: 12px 8px; font-size: 13px; gap: 4px; border-radius: 15px; }
  .opt.sm .oico { font-size: 20px; }

  /* ---------- Flow header ---------- */
  .flow-head { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .flow-back { width: 42px; height: 42px; border-radius: 13px; background: var(--card-1); border: 1px solid var(--stroke); display: grid; place-items: center; font-size: 18px; flex-shrink: 0; }

  /* ---------- Workout ---------- */
  .wk-progress-track { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: rgba(255,255,255,0.06); z-index: 6; }
  .wk-progress-fill { height: 100%; background: linear-gradient(90deg, var(--lime-deep), var(--lime)); box-shadow: 0 0 10px var(--lime-glow); transition: width 0.5s cubic-bezier(0.22,1,0.36,1); }
  .ex-counter { font-size: 12px; font-weight: 600; color: var(--lime); letter-spacing: 0.06em; }
  .ex-dots { display: flex; gap: 7px; overflow-x: auto; margin: 0 -18px 16px; padding: 2px 18px; }
  .ex-dot { min-width: 32px; height: 32px; border-radius: 10px; font-size: 13px; font-weight: 700; background: var(--card-2); border: 1px solid var(--stroke);
    color: var(--text-dim); font-family: 'Montserrat', sans-serif; flex-shrink: 0; }
  .ex-dot.part { border-color: rgba(198,255,0,0.45); color: var(--lime); }
  .ex-dot.full { background: var(--lime-soft); border-color: rgba(198,255,0,0.45); color: var(--lime); }
  .ex-dot.cur { background: var(--lime); color: var(--lime-ink); border-color: transparent; }
  .note-chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 12px;
    background: var(--lime-soft); color: var(--lime); font-size: 12.5px; font-weight: 600; }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 11px; background: var(--card-2); border: 1px solid var(--stroke); font-size: 12.5px; font-weight: 600; }
  .ref-box { padding: 13px 16px; border-radius: 16px; background: rgba(59,130,246,0.08); border: 1px solid rgba(59,130,246,0.2); display: flex; flex-direction: column; gap: 10px; }
  .ref-box .eyebrow { color: var(--blue-b); margin-bottom: 4px; }
  .ref-val { font-size: 14px; font-weight: 600; line-height: 1.4; }
  .set-row { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
  .set-idx { width: 32px; height: 46px; border-radius: 11px; background: var(--card-2); display: grid; place-items: center;
    font-size: 14px; font-weight: 700; color: var(--text-dim); flex-shrink: 0; font-family: 'Montserrat', sans-serif; }
  .set-inp { width: 100%; background: var(--card-2); border: 1px solid var(--stroke); border-radius: 12px; padding: 13px 8px;
    color: var(--text); font-size: 17px; font-weight: 700; text-align: center; min-width: 0; }
  .set-inp::placeholder { color: var(--text-faint); font-weight: 500; }
  .set-inp:focus { outline: none; border-color: var(--lime); background: rgba(198,255,0,0.06); }
  .set-field { flex: 1; min-width: 0; position: relative; }
  .set-x { color: var(--text-faint); font-weight: 700; flex-shrink: 0; }
  .set-check { width: 46px; height: 46px; border-radius: 13px; border: 1.5px solid var(--stroke-strong); display: grid; place-items: center;
    font-size: 17px; flex-shrink: 0; color: var(--text-dim); transition: background 0.2s, box-shadow 0.2s; }
  .set-check.on { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); box-shadow: 0 0 16px var(--lime-glow); }
  .set-row.done .set-inp { border-color: rgba(198,255,0,0.28); }
  .set-tools { display: flex; gap: 10px; margin-top: 4px; }
  .set-tool { flex: 1; padding: 11px; border-radius: 12px; font-size: 13px; font-weight: 600; color: var(--text-dim); border: 1px dashed var(--stroke-strong); }
  .set-tool:disabled { opacity: 0.35; }
  .nav-arrows { display: flex; gap: 12px; margin-top: 18px; }
  .nav-arrow { flex: 1; padding: 16px; border-radius: 16px; background: var(--card-1); border: 1px solid var(--stroke);
    font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .nav-arrow:disabled { opacity: 0.3; }
  .nav-arrow.finish { background: linear-gradient(135deg, var(--lime), var(--lime-deep)); color: var(--lime-ink); border: none; box-shadow: 0 8px 24px var(--lime-glow); }
  .timer-btn { padding: 9px 12px; border-radius: 12px; background: var(--card-2); border: 1px solid var(--stroke); font-size: 13px; font-weight: 700; flex-shrink: 0; }

  /* ---------- Rest timer ---------- */
  .rest-bar { position: absolute; left: 14px; right: 14px; bottom: calc(14px + var(--safe-b)); z-index: 25; padding: 12px 12px 12px 16px;
    border-radius: 22px; background: rgba(14,18,24,0.94); border: 1px solid rgba(198,255,0,0.35); box-shadow: 0 16px 44px rgba(0,0,0,0.6);
    display: flex; align-items: center; gap: 10px; overflow: hidden; animation: toastIn2 0.35s cubic-bezier(0.34,1.56,0.64,1); }
  .rest-bar.fired { background: var(--lime); color: var(--lime-ink); }

const CARDIO_TYPES = [
  { name: 'Cinta', icon: '🏃' }, { name: 'Bici', icon: '🚴' }, { name: 'Elíptica', icon: '🌀' },
  { name: 'Remo', icon: '🚣' }, { name: 'Escaleras', icon: '🪜' }, { name: 'Caminar', icon: '🚶' },
];

const MAX_WEEK = 8;          // bloque de acumulación de 8 semanas
const POST_CARDIO_MIN = 40;  // cardio post-entreno por defecto
const ROUTINE_BY_KEY = Object.fromEntries(ROUTINES.map(r => [r.key, r]));
const APP_VERSION = '2.0';

/* ============================================================
   PERSISTENCIA
   - store: datos principales (se guarda al cambiar)
   - draft: entreno en curso (clave aparte → guardar cada tecla es barato)
   ============================================================ */
const STORE_KEY = 'strybe_v2';
const LEGACY_KEYS = ['ironlog40_v1'];
const DRAFT_KEY = 'strybe_draft_v1';
const DEFAULT_SETTINGS = { restAuto: true, restSound: true };
const DEFAULT_NAME = 'Sergio';

function uid() {
  try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}
function readJSON(key) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
const clampWeek = (w) => Math.max(1, Math.min(MAX_WEEK, parseInt(w, 10) || 1));

/* Normaliza cualquier versión de datos (v1 de ironlog, backups importados…) al formato actual. */
function migrate(raw) {
  const s = { v: 2, week: 1, name: DEFAULT_NAME, settings: { ...DEFAULT_SETTINGS }, log: [] };
  if (!raw || typeof raw !== 'object') return s;
  s.week = clampWeek(raw.week);
  if (typeof raw.name === 'string' && raw.name.trim()) s.name = raw.name.trim().slice(0, 24);
  if (raw.settings && typeof raw.settings === 'object') s.settings = { ...s.settings, ...raw.settings };

  const seen = new Set();
  const out = [];
  const entries = (Array.isArray(raw.log) ? raw.log : [])
    .filter(e => e && typeof e === 'object' && ['fuerza', 'cardio', 'descanso'].includes(e.type))
    .map(e => ({ ...e, date: Number(e.date) || Date.now() }))
    .sort((a, b) => a.date - b.date);

  entries.forEach(entry => {
    // v1 guardaba el cardio post-entreno como sesión aparte → se fusiona con su entreno
    if (entry.type === 'cardio' && entry.cardioType === 'Post-entreno') {
      const prev = out[out.length - 1];
      if (prev && prev.type === 'fuerza' && dayKey(prev.date) === dayKey(entry.date)) {
        prev.cardio = { type: 'Post-entreno', duration: Number(entry.duration) || POST_CARDIO_MIN, distance: Number.isFinite(entry.distance) ? entry.distance : null };
        return;
      }
    }
    if (entry.type === 'fuerza') {
      if (entry.cardio === true) entry.cardio = { type: 'Post-entreno', duration: POST_CARDIO_MIN, distance: null };
      else if (!entry.cardio || typeof entry.cardio !== 'object') entry.cardio = null;
      entry.exercises = Array.isArray(entry.exercises) ? entry.exercises.map(x => ({ ...x, sets: Array.isArray(x.sets) ? x.sets : [] })) : [];
      entry.volume = Number(entry.volume) || 0;
      entry.totalSets = Number(entry.totalSets) || 0;
      entry.week = clampWeek(entry.week);
      if (!entry.routineKey) { const r = ROUTINES.find(x => x.name === entry.routine); if (r) entry.routineKey = r.key; }
    }
    if (entry.type === 'cardio') {
      entry.duration = Number(entry.duration) || 0;
      entry.distance = Number.isFinite(entry.distance) ? entry.distance : null;
      entry.cardioType = entry.cardioType || 'Cardio';
    }
    let id = entry.id != null ? String(entry.id) : '';
    if (!id || seen.has(id)) id = uid();
    seen.add(id);
    entry.id = id;
    out.push(entry);
  });
  s.log = out;
  return s;
}

function loadStore() {
  let raw = readJSON(STORE_KEY);
  if (!raw) for (const k of LEGACY_KEYS) { raw = readJSON(k); if (raw) break; }
  return migrate(raw);
}
function saveStore(s) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); return true; } catch (e) { return false; }
}
function loadDraft() {
  const d = readJSON(DRAFT_KEY);
  if (!d || !ROUTINE_BY_KEY[d.routineKey] || !Array.isArray(d.exList) || !d.exList.length) return null;
  d.idx = Math.max(0, Math.min(d.exList.length - 1, d.idx | 0));
  d.stage = d.stage === 'finish' ? 'finish' : 'workout';
  return d;
}
function saveDraft(d) {
  try { if (d) localStorage.setItem(DRAFT_KEY, JSON.stringify(d)); else localStorage.removeItem(DRAFT_KEY); return true; } catch (e) { return false; }
}

/* ============================================================
   HELPERS
   ============================================================ */
const MONTHS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MONTHS_LONG = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DAYS = ['dom','lun','mar','mié','jue','vie','sáb'];
const WEEK_LETTERS = ['L','M','X','J','V','S','D'];

function fmtDate(ts) { const d = new Date(ts); return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; }
function fmtTime(ts) { const d = new Date(ts); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; }
function fmtClock(sec) { const m = Math.floor(sec / 60), s = sec % 60; return `${m}:${String(s).padStart(2, '0')}`; }
function fmtMin(min) { if (!min) return '0 min'; const h = Math.floor(min / 60), m = min % 60; return h ? `${h} h ${m ? m + ' min' : ''}`.trim() : `${m} min`; }
function fmtKg(n) { return (Math.round(n * 10) / 10).toLocaleString('es', { maximumFractionDigits: 1 }); }
function dayKey(ts) { const d = new Date(ts); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }
function startOfWeek(ts = Date.now()) { const d = new Date(ts); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d; }
const num = (v) => { const n = parseFloat(String(v ?? '').replace(',', '.')); return Number.isFinite(n) ? n : 0; };
const int = (v) => parseInt(v, 10) || 0;
const isTraining = (e) => e.type === 'fuerza' || e.type === 'cardio';

/* Inputs: sólo dígitos y un separador decimal (kg) / sólo dígitos (reps, minutos). */
function sanitizeDecimal(v, maxLen = 6) {
  let s = String(v).replace(/[^\d.,]/g, '');
  const i = s.search(/[.,]/);
  if (i >= 0) s = s.slice(0, i + 1) + s.slice(i + 1).replace(/[.,]/g, '');
  return s.slice(0, maxLen);
}
const sanitizeInt = (v, maxLen = 3) => String(v).replace(/\D/g, '').slice(0, maxLen);

function buzz(p = 8) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

/* Sonido del temporizador (WebAudio; se "desbloquea" con un toque del usuario). */
let __audio = null;
function unlockAudio() {
  try {
    if (!__audio) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) __audio = new AC(); }
    if (__audio && __audio.state === 'suspended') __audio.resume();
  } catch (e) {}
}
function beep() {
  try {
    if (!__audio) return;
    const t = __audio.currentTime;
    [0, 0.22, 0.44].forEach(off => {
      const o = __audio.createOscillator(), g = __audio.createGain();
      o.frequency.value = off === 0.44 ? 1175 : 880;
      g.gain.setValueAtTime(0.0001, t + off);
      g.gain.exponentialRampToValueAtTime(0.3, t + off + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + off + 0.18);
      o.connect(g); g.connect(__audio.destination);
      o.start(t + off); o.stop(t + off + 0.2);
    });
  } catch (e) {}
}

/* ---------- Estadísticas ---------- */
function computeStats(log) {
  const training = log.filter(isTraining);
  const weekStart = startOfWeek().getTime();
  const weekCount = new Set(training.filter(s => s.date >= weekStart).map(s => dayKey(s.date))).size;
  // Racha: días con entreno seguidos. Un descanso marcado no rompe la racha (pero no suma).
  const active = new Set(training.map(s => dayKey(s.date)));
  const rest = new Set(log.filter(s => s.type === 'descanso').map(s => dayKey(s.date)));
  let streak = 0;
  const d = new Date();
  const k0 = dayKey(d.getTime());
  if (!active.has(k0) && !rest.has(k0)) d.setDate(d.getDate() - 1);
  for (let guard = 0; guard < 3650; guard++) {
    const k = dayKey(d.getTime());
    if (active.has(k)) streak++;
    else if (!rest.has(k)) break;
    d.setDate(d.getDate() - 1);
  }
  return { total: training.length, week: weekCount, streak };
}

function routineKeyOf(e) {
  if (e.routineKey) return e.routineKey;
  const r = ROUTINES.find(x => x.name === e.routine);
  return r ? r.key : null;
}
function doneRoutinesForWeek(log, week) {
  return new Set(log.filter(e => e.type === 'fuerza' && e.week === week).map(routineKeyOf).filter(Boolean));
}

/* ---------- Plan del entrenador ---------- */
function parsePlan(str) {
  return String(str).split('·').map(p => {
    const [kg, reps] = p.split('×');
    return { kg: (kg || '').trim(), reps: (reps || '').trim() };
  });
}
function planForWeek(ex, week) {
  if (!ex.plan || !ex.plan.length) return null;
  const i = Math.min(week - 1, ex.plan.length - 1);
  return { str: ex.plan[i].replace(/·/g, ' · '), week: i + 1, exact: i === week - 1, sets: parsePlan(ex.plan[i]) };
}
function restSecondsFor(reps) {
  const m = String(reps).match(/\d+/);
  const n = m ? +m[0] : 12;
  return n <= 8 ? 150 : n <= 12 ? 120 : 90;
}

/* Última sesión con series reales de ese ejercicio (busca hacia atrás, conserva el índice de cada serie). */
function lastForExercise(log, exName) {
  for (let i = log.length - 1; i >= 0; i--) {
    const e = log[i];
    if (e.type !== 'fuerza') continue;
    const ex = (e.exercises || []).find(x => x.name === exName);
    if (!ex || !Array.isArray(ex.sets)) continue;
    const sets = ex.sets.map(s => (s && s.done && (String(s.kg || '') + String(s.reps || '')).length) ? { kg: String(s.kg || ''), reps: String(s.reps || '') } : null);
    if (sets.some(Boolean)) return { date: e.date, sets };
  }
  return null;
}
const fmtSets = (sets) => sets.filter(Boolean).map(s => `${s.kg || '–'}×${s.reps || '–'}`).join('  ·  ');

/* ---------- Récords (1RM estimado, fórmula de Epley) ---------- */
function bestOfSets(sets) {
  let best = null;
  (sets || []).forEach(s => {
    if (!s || !s.done) return;
    const kg = num(s.kg), r = int(s.reps);
    if (kg <= 0 || r <= 0) return;
    const e1rm = kg * (1 + r / 30);
    if (!best || e1rm > best.e1rm) best = { kg, reps: r, e1rm };
  });
  return best;
}
function exerciseHistory(log, name) {
  const out = [];
  log.forEach(e => {
    if (e.type !== 'fuerza') return;
    const ex = (e.exercises || []).find(x => x.name === name);
    if (!ex) return;
    const b = bestOfSets(ex.sets);
    if (b) out.push({ date: e.date, week: e.week, ...b });
  });
  return out;
}
function findPRs(log, exList) {
  return exList.map(e => {
    const cur = bestOfSets(e.sets);
    if (!cur) return null;
    const hist = exerciseHistory(log, e.name);
    if (!hist.length) return null;
    const prev = Math.max(...hist.map(h => h.e1rm));
    return cur.e1rm > prev + 0.05 ? { name: e.name, ...cur, prev } : null;
  }).filter(Boolean);
}

/* ---------- Entreno: crear borrador y sesión ---------- */
function buildDraft(routine, complement, cardio, week, log) {
  const defs = routine.exercises.map(e => ({ ...e, group: routine.name }))
    .concat(complement ? COMPLEMENTS[complement].exercises.map(e => ({ ...e, group: COMPLEMENTS[complement].name })) : []);
  const exList = defs.map(e => {
    const plan = planForWeek(e, week);
    const last = lastForExercise(log, e.name);
    const count = plan && plan.exact ? plan.sets.length : e.series;
    const sets = Array.from({ length: count }, (_, i) => {
      // Prioridad de relleno: objetivo de esta semana → lo que hiciste la última vez → plan de referencia.
      const pExact = plan && plan.exact ? plan.sets[i] : null;
      const l = last && last.sets[i];
      const pRef = plan && !plan.exact ? plan.sets[i] : null;
      const src = pExact || l || pRef;
      const repsNum = src && /^\d+$/.test(src.reps) ? src.reps : '';
      return { kg: src ? String(src.kg || '') : '', reps: repsNum, done: false, hint: src && !repsNum && src.reps ? src.reps : '' };
    });
    return { name: e.name, group: e.group, reps: e.reps, series: e.series, rir: e.rir, note: e.note,
      plan: plan ? { str: plan.str, week: plan.week, exact: plan.exact } : null, last, sets };
  });
  return {
    id: uid(), routineKey: routine.key, complement, cardio, week, startedAt: Date.now(), idx: 0, stage: 'workout', exList,
    cardioData: cardio ? { type: 'Cinta', duration: String(POST_CARDIO_MIN), distance: '' } : null,
  };
}

function parseCardio(d) {
  const duration = parseInt(d.duration, 10);
  if (!(duration >= 1 && duration <= 600)) return { error: 'Pon una duración entre 1 y 600 minutos.' };
  let distance = null;
  if (String(d.distance || '').trim() !== '') {
    distance = num(d.distance);
    if (!(distance > 0 && distance <= 200)) return { error: 'La distancia no es válida (0–200 km).' };
    distance = Math.round(distance * 100) / 100;
  }
  return { value: { type: d.type, duration, distance } };
}

function buildSession(draft, cardioValue) {
  const routine = ROUTINE_BY_KEY[draft.routineKey];
  let volume = 0, completed = 0;
  const exercises = draft.exList.map(e => ({
    name: e.name, group: e.group,
    sets: e.sets.map(s => {
      if (s.done) { volume += num(s.kg) * int(s.reps); completed++; }
      return { kg: s.kg, reps: s.reps, done: s.done };
    }),
  }));
  const end = draft.endedAt || Date.now();
  return {
    type: 'fuerza', routine: routine.name, routineKey: routine.key, icon: routine.icon, complement: draft.complement || null,
    week: draft.week, start: draft.startedAt, durationMin: Math.max(1, Math.min(300, Math.round((end - draft.startedAt) / 60000))),
    exercises, volume: Math.round(volume), totalSets: completed, cardio: cardioValue || null,
  };
}

/* ---------- Hooks ---------- */
function useNow(ms, active = true) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => {
    if (!active) return;
    setNow(Date.now());
    const t = setInterval(() => setNow(Date.now()), ms);
    return () => clearInterval(t);
  }, [ms, active]);
  return now;
}
/* Mantiene la pantalla encendida durante el entreno (si el navegador lo soporta). */
function useWakeLock() {
  useEffect(() => {
    let lock = null, alive = true;
    const req = async () => {
      try {
        if ('wakeLock' in navigator && document.visibilityState === 'visible' && alive) lock = await navigator.wakeLock.request('screen');
      } catch (e) {}
    };
    req();
    const onVis = () => { if (document.visibilityState === 'visible') req(); };
    document.addEventListener('visibilitychange', onVis);
    return () => { alive = false; document.removeEventListener('visibilitychange', onVis); if (lock) lock.release().catch(() => {}); };
  }, []);
}

function Sparkline({ values, w = 92, h = 30 }) {
  if (values.length < 2) return null;
  const min = Math.min(...values), max = Math.max(...values), span = max - min || 1;
  const pts = values.map((v, i) => `${(i / (values.length - 1)) * (w - 4) + 2},${h - 3 - ((v - min) / span) * (h - 6)}`).join(' ');
  const lastPt = pts.split(' ').pop().split(',');
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} aria-hidden="true" style={{ flexShrink: 0 }}>
      <polyline points={pts} fill="none" stroke="var(--lime)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />

          <div className="action-ico" aria-hidden="true" style={{ background: 'linear-gradient(135deg, rgba(244,63,94,0.25), rgba(251,146,60,0.15))' }}>🏃</div>
          <div><div className="t">Cardio libre</div><div className="s">Registra tu sesión de cardio</div></div>
          <div className="action-arrow" aria-hidden="true">›</div>
        </button>
        <button className="action-btn glass press" onClick={onDescanso}>
          <div className="action-ico" aria-hidden="true" style={{ background: 'linear-gradient(135deg, rgba(59,130,246,0.22), rgba(139,92,246,0.15))' }}>🌙</div>
          <div><div className="t">Día de descanso</div><div className="s">Marca hoy como recuperación</div></div>
          <div className="action-arrow" aria-hidden="true">›</div>
        </button>
      </div>

      <div className="section-head"><h2>Historial reciente</h2>
        {store.log.length > 0 && <button className="section-link press" onClick={goHistory}>Ver todo</button>}

      {recent.length === 0 && <BentoCard style={{ textAlign: 'center', color: 'var(--text-dim)', fontSize: 14 }}>Aún no hay sesiones. ¡Empieza tu primer entreno! 💪</BentoCard>}
      {recent.map(s => <HistoryItem key={s.id} s={s} onClick={() => onOpen(s)} />)}
    </div>
  );
}

function entryView(s) {
  if (s.type === 'fuerza') {
    const extra = (s.complement ? ` · ${COMPLEMENTS[s.complement] ? COMPLEMENTS[s.complement].name : s.complement}` : '') + (s.cardio ? ' · Cardio' : '');

      ico: s.icon || '🏋️', bg: 'linear-gradient(135deg, rgba(198,255,0,0.22), rgba(124,255,0,0.1))',

/* ============================================================
   WORKOUT ACTIVO (todo vive en el borrador → sobrevive a cierres)
   ============================================================ */
function RestBar({ rest, now, onAdjust, onSkip }) {
  const remaining = Math.max(0, Math.ceil((rest.end - now) / 1000));
  const pct = rest.fired ? 100 : Math.min(100, ((rest.total * 1000 - (rest.end - now)) / (rest.total * 1000)) * 100);
  return (
    <div className={`rest-bar ${rest.fired ? 'fired' : ''}`} role="timer" aria-live={rest.fired ? 'assertive' : 'off'}>
      <div>
        <div className="rest-lbl">{rest.fired ? 'Descanso terminado' : 'Descanso'}</div>
        <div className="rest-time">{rest.fired ? '¡Vamos!' : fmtClock(remaining)}</div>
      </div>
      <div style={{ display: 'flex', gap: 6, marginLeft: 'auto' }}>
        <button className="rest-btn press" onClick={() => onAdjust(-15)} aria-label="Quitar 15 segundos">−15</button>
        <button className="rest-btn press" onClick={() => onAdjust(15)} aria-label="Añadir 15 segundos">+15</button>
        <button className="rest-btn press" onClick={onSkip}>{rest.fired ? 'OK' : 'Saltar'}</button>
      </div>
      {!rest.fired && <div className="rest-fill" style={{ width: pct + '%' }} />}
    </div>
  );
}

function WorkoutScreen({ draft, setDraft, settings, onFinish, onPause }) {
  const routine = ROUTINE_BY_KEY[draft.routineKey];
  const { exList, idx } = draft;
  const ex = exList[idx];
  const total = exList.length;
  const scrollRef = useRef(null);
  const [rest, setRest] = useState(null); // { end, total, fired }
  const now = useNow(rest ? 250 : 30000);
  useWakeLock();

  // Aviso al terminar el descanso
  useEffect(() => {
    if (rest && !rest.fired && now >= rest.end) {
      buzz([200, 100, 200]);
      if (settings.restSound) beep();
      setRest(r => (r ? { ...r, fired: true } : r));
    }
  }, [now, rest, settings.restSound]);
  useEffect(() => {
    if (!rest || !rest.fired) return;
    const t = setTimeout(() => setRest(null), 4000);
    return () => clearTimeout(t);
  }, [rest]);

  const startRest = (sec) => { unlockAudio(); setRest({ end: Date.now() + sec * 1000, total: sec, fired: false }); };
  const adjustRest = (delta) => setRest(r => {
    if (!r) return r;
    const base = r.fired ? Date.now() : r.end;
    const end = Math.max(Date.now() + 1000, base + delta * 1000);
    return { end, total: Math.max(r.total, Math.ceil((end - Date.now()) / 1000)), fired: false };
  });

  const patchEx = (fn) => setDraft(d => ({ ...d, exList: d.exList.map((e, i) => i !== d.idx ? e : fn(e)) }));
  const update = (si, field, val) => patchEx(e => ({ ...e, sets: e.sets.map((s, j) => j !== si ? s : { ...s, [field]: val }) }));
  const toggleDone = (si) => {
    const wasDone = ex.sets[si].done;
    buzz(18);
    unlockAudio();
    patchEx(e => ({ ...e, sets: e.sets.map((s, j) => j !== si ? s : { ...s, done: !s.done }) }));
    if (!wasDone && settings.restAuto) startRest(restSecondsFor(ex.reps));
  };
  const addSet = () => patchEx(e => {
    const last = e.sets[e.sets.length - 1] || { kg: '', reps: '' };
    return { ...e, sets: [...e.sets, { kg: last.kg, reps: last.reps, done: false, hint: '' }] };
  });
  const removeSet = () => patchEx(e => (e.sets.length > 1 ? { ...e, sets: e.sets.slice(0, -1) } : e));

  const go = (n) => {
    if (n < 0 || n >= total || n === idx) return;
    buzz(8);
    setDraft(d => ({ ...d, idx: n }));
    if (scrollRef.current) scrollRef.current.scrollTop = 0;
  };

  const doneSets = exList.reduce((a, e) => a + e.sets.filter(s => s.done).length, 0);
  const totalSets = exList.reduce((a, e) => a + e.sets.length, 0);
  const elapsed = Math.max(0, Math.floor((now - draft.startedAt) / 60000));

  const finish = () => {
    setRest(null);
    setDraft(d => ({ ...d, stage: 'finish', endedAt: Date.now() }));
    onFinish();
  };

  return (
    <div className="pop-anim" style={{ position: 'absolute', inset: 0, zIndex: 30, background: 'var(--bg)' }}>
      <div className="aurora-field still" aria-hidden="true"><div className="aurora a1" /><div className="aurora a2" /></div>
      <div className="wk-progress-track" role="progressbar" aria-valuemin={0} aria-valuemax={totalSets} aria-valuenow={doneSets} aria-label="Series completadas">
        <div className="wk-progress-fill" style={{ width: (totalSets ? doneSets / totalSets * 100 : 0) + '%' }} />
      </div>
      <div className={`screen-scroll no-nav ${rest ? 'with-rest' : ''}`} ref={scrollRef} style={{ paddingTop: 'calc(var(--safe-t) + 20px)' }}>
        <div className="flow-head" style={{ marginBottom: 14 }}>
          <button className="flow-back press" onClick={onPause} aria-label="Pausar y salir del entreno">✕</button>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div className="ex-counter">EJERCICIO {idx + 1} / {total} · {elapsed} MIN</div>
            <div style={{ fontSize: 14, fontWeight: 600, color: 'var(--text-dim)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
              {routine.name}{draft.complement ? ` + ${COMPLEMENTS[draft.complement].name}` : ''} · Sem {draft.week}</div>
          </div>
          {!rest && <button className="timer-btn press" onClick={() => startRest(restSecondsFor(ex.reps))} aria-label="Iniciar descanso">⏱ {fmtClock(restSecondsFor(ex.reps))}</button>}
        </div>

        <div className="ex-dots" role="tablist" aria-label="Ejercicios">
          {exList.map((e, i) => {
            const d = e.sets.filter(s => s.done).length;
            return (
              <button key={i} role="tab" aria-selected={i === idx} aria-label={`${i + 1}. ${e.name}: ${d}/${e.sets.length} series`}
                className={`ex-dot press ${i === idx ? 'cur' : d === e.sets.length ? 'full' : d ? 'part' : ''}`} onClick={() => go(i)}>{i + 1}</button>
            );
          })}
        </div>

        {ex.group !== routine.name && <div className="pill" style={{ marginBottom: 12, color: 'var(--coral-b)', borderColor: 'rgba(251,146,60,0.3)' }}>★ Complemento · {ex.group}</div>}

        <div className="h-title" style={{ marginBottom: 14 }}>{ex.name}</div>

        <div style={{ display: 'flex', gap: 9, flexWrap: 'wrap', marginBottom: 16 }}>
          <span className="pill">🎯 {ex.reps} reps</span>
          <span className="pill">💪 {ex.series} series</span>
          <span className="pill">🔋 RIR {ex.rir}</span>
        </div>

        {ex.note && <div className="note-chip" style={{ marginBottom: 16 }}>⚡ {ex.note}</div>}

        {(ex.plan || ex.last) && (
          <div className="ref-box" style={{ marginBottom: 20 }}>
            {ex.plan && (
              <div>
                <div className="eyebrow">{ex.plan.exact ? `📋 Objetivo semana ${draft.week}` : `📋 Plan · referencia semana ${ex.plan.week}`}</div>
                <div className="ref-val">{ex.plan.str}</div>
              </div>
            )}
            {ex.last && (
              <div>
                <div className="eyebrow">↺ Última vez · {fmtDate(ex.last.date)}</div>
                <div className="ref-val">{fmtSets(ex.last.sets)}</div>
              </div>
            )}
          </div>
        )}

        <BentoCard style={{ marginBottom: 18 }}>
          <div className="eyebrow" style={{ marginBottom: 14 }}>Registra tus series</div>
          {ex.sets.map((s, si) => (
            <div className={`set-row ${s.done ? 'done' : ''}`} key={si}>
              <div className="set-idx" aria-hidden="true">{si + 1}</div>
              <div className="set-field">
                <input className="set-inp" type="text" inputMode="decimal" placeholder="kg" aria-label={`Serie ${si + 1}: kilos`}
                  value={s.kg} onChange={e => update(si, 'kg', sanitizeDecimal(e.target.value))} />
              </div>
              <span className="set-x" aria-hidden="true">×</span>
              <div className="set-field">
                <input className="set-inp" type="text" inputMode="numeric" placeholder={s.hint || 'reps'} aria-label={`Serie ${si + 1}: repeticiones`}
                  value={s.reps} onChange={e => update(si, 'reps', sanitizeInt(e.target.value))} />
              </div>
              <button className={`set-check press ${s.done ? 'on' : ''}`} onClick={() => toggleDone(si)}
                aria-label={`Serie ${si + 1} ${s.done ? 'hecha. Desmarcar' : 'marcar como hecha'}`} aria-pressed={s.done}>✓</button>
            </div>
          ))}
          <div className="set-tools">
            <button className="set-tool press" onClick={removeSet} disabled={ex.sets.length <= 1}>− Quitar serie</button>
            <button className="set-tool press" onClick={addSet}>+ Añadir serie</button>
          </div>
        </BentoCard>

        <div className="nav-arrows">
          <button className="nav-arrow press" disabled={idx === 0} onClick={() => go(idx - 1)}>← Anterior</button>
          {idx < total - 1
            ? <button className="nav-arrow press" onClick={() => go(idx + 1)} style={{ background: 'var(--card-2)' }}>Siguiente →</button>
            : <button className="nav-arrow finish press" onClick={finish}>Finalizar ✓</button>}
        </div>
        {idx < total - 1 && (
          <button className="btn-ghost press" style={{ marginTop: 12 }} onClick={finish}>Terminar entreno ahora</button>
        )}

        {draft.cardio && (
          <BentoCard className="hist-item" style={{ marginTop: 18 }}>
            <div className="hist-ico" aria-hidden="true" style={{ background: 'linear-gradient(135deg, rgba(244,63,94,0.22), rgba(251,146,60,0.12))' }}>🏃</div>
            <div><div style={{ fontSize: 14, fontWeight: 600 }}>Cardio pendiente</div><div className="hist-date">{POST_CARDIO_MIN}' al terminar · lo registras al finalizar</div></div>
          </BentoCard>
        )}
      </div>
      {rest && <RestBar rest={rest} now={now} onAdjust={adjustRest} onSkip={() => setRest(null)} />}
    </div>
  );
}

    <>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 9, marginBottom: 16 }} role="radiogroup" aria-label="Tipo de cardio">
        {CARDIO_TYPES.map(c => (
          <button key={c.name} role="radio" aria-checked={data.type === c.name} className={`opt sm press ${data.type === c.name ? 'on' : ''}`}
            onClick={() => onChange({ ...data, type: c.name })}>
            <span className="oico" aria-hidden="true">{c.icon}</span>{c.name}</button>
        ))}
      </div>
      <BentoCard>
        <div className="field">
          <label htmlFor="cd-dur">Duración (minutos)</label>
          <input id="cd-dur" className={error && /duración/i.test(error) ? 'bad' : ''} type="text" inputMode="numeric" placeholder={String(POST_CARDIO_MIN)}
            value={data.duration} onChange={e => onChange({ ...data, duration: sanitizeInt(e.target.value) })} />
        </div>
        <div className="field" style={{ marginBottom: 0 }}>
          <label htmlFor="cd-dist">Distancia (km) · opcional</label>
          <input id="cd-dist" className={error && /distancia/i.test(error) ? 'bad' : ''} type="text" inputMode="decimal" placeholder="5,0"
            value={data.distance} onChange={e => onChange({ ...data, distance: sanitizeDecimal(e.target.value, 5) })} />
        </div>
        {error && <div className="err" role="alert">{error}</div>}
      </BentoCard>
    </>
  );
}

function FinishScreen({ draft, setDraft, log, onSave, onBack, onDiscard }) {
  const routine = ROUTINE_BY_KEY[draft.routineKey];
  const cardioRes = draft.cardio && draft.cardioData ? parseCardio(draft.cardioData) : null;
  const session = useMemo(() => buildSession(draft, cardioRes && cardioRes.value), [draft]);
  const prs = useMemo(() => findPRs(log, draft.exList), [log, draft.exList]);
  return (
    <div className="screen-scroll no-nav pop-anim">
      <div className="flow-head" style={{ marginBottom: 0 }}>
        <button className="flow-back press" onClick={onBack} aria-label="Volver al entreno">←</button>
        <div className="dim" style={{ fontSize: 13, fontWeight: 600 }}>Seguir editando</div>
      </div>
      <div style={{ textAlign: 'center', margin: '8px 0 24px' }}>
        <div style={{ fontSize: 60, marginBottom: 6 }} aria-hidden="true">{prs.length ? '🏆' : '🎉'}</div>
        <div className="h-title">¡Sesión completada!</div>
        <div className="dim" style={{ fontSize: 15, marginTop: 6 }}>{routine.name}{draft.complement ? ` + ${COMPLEMENTS[draft.complement].name}` : ''} · {fmtMin(session.durationMin)}</div>
      </div>

      <div className="bento-grid" style={{ marginBottom: 8 }}>
        <StatCard value={session.totalSets} unit="" label="Series" color="var(--lime)" />
        <StatCard value={session.volume >= 10000 ? fmtKg(session.volume / 1000) : session.volume.toLocaleString('es')} unit={session.volume >= 10000 ? 't' : 'kg'} label="Volumen" />
        <StatCard value={`S${draft.week}`} unit="" label="Bloque" color="var(--amber-b)" />
      </div>

      {prs.length > 0 && (
        <>
          <div className="section-head"><h2>Nuevos récords</h2></div>
          {prs.map(p => (
            <div className="pr-item" key={p.name}>
              <div style={{ fontSize: 22 }} aria-hidden="true">🏆</div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 14.5, fontWeight: 600 }}>{p.name}</div>
                <div className="dim" style={{ fontSize: 12.5, marginTop: 2 }}>{fmtKg(p.kg)} kg × {p.reps} · 1RM est. {fmtKg(p.e1rm)} kg (antes {fmtKg(p.prev)})</div>
              </div>
            </div>
          ))}
        </>
      )}

      {draft.cardio && (
        <>
          <div className="section-head"><h2>Cardio post-entreno</h2>
            <button className="section-link press" onClick={() => setDraft(d => ({ ...d, cardio: false }))}>No lo hice</button></div>
          <CardioFields data={draft.cardioData} onChange={cd => setDraft(d => ({ ...d, cardioData: cd }))} error={cardioRes && cardioRes.error} />
        </>
      )}
      {!draft.cardio && (
        <button className="btn-ghost press" style={{ marginTop: 18 }}

function ProgressRow({ name, hist }) {
  const [open, setOpen] = useState(false);
  const best = hist.reduce((a, h) => (h.e1rm > a.e1rm ? h : a), hist[0]);
  const last = hist[hist.length - 1];
  const prev = hist[hist.length - 2];
  const diff = prev ? last.e1rm - prev.e1rm : 0;
  const cls = !prev ? '' : diff > 0.05 ? 'up' : diff < -0.05 ? 'down' : 'eq';
  return (
    <BentoCard className="prog-row" onClick={() => setOpen(o => !o)} label={`${name}. ${open ? 'Ocultar' : 'Ver'} historial`}>
      <div className="prog-top">
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 14.5, fontWeight: 600 }}>{name}</div>
          <div className="dim" style={{ fontSize: 12.5, marginTop: 3 }}>
            Récord {fmtKg(best.kg)} kg × {best.reps} · 1RM ≈ {fmtKg(best.e1rm)} kg
          </div>
          {prev && <span className={`delta ${cls}`} style={{ display: 'inline-block', marginTop: 6 }}>
            {cls === 'eq' ? '= igual que la anterior' : `${diff > 0 ? '▲ +' : '▼ '}${fmtKg(diff)} kg vs anterior`}</span>}
        </div>
        <Sparkline values={hist.slice(-10).map(h => h.e1rm)} />
      </div>
      {open && (
        <div className="prog-table">
          {hist.slice(-8).reverse().map((h, i) => (
            <React.Fragment key={i}>
              <div className="dim">{fmtDate(h.date)}</div>
              <div>{fmtKg(h.kg)} kg × {h.reps} <span className="faint">· S{h.week}</span></div>
              <div style={{ fontWeight: 700 }}>{fmtKg(h.e1rm)}</div>
            </React.Fragment>
          ))}
        </div>
      )}
    </BentoCard>
  );
}

function ProgressScreen({ log }) {
  const groups = useMemo(() => {
    const all = [
      ...ROUTINES.map(r => ({ name: r.name, icon: r.icon, exercises: r.exercises })),
      ...Object.values(COMPLEMENTS).map(c => ({ name: c.name, icon: c.icon, exercises: c.exercises })),
    ];
    return all.map(g => ({ ...g, items: g.exercises.map(e => ({ name: e.name, hist: exerciseHistory(log, e.name) })).filter(x => x.hist.length) }))
      .filter(g => g.items.length);
  }, [log]);
  const weekly = useMemo(() => {
    const ws = startOfWeek().getTime(), prevWs = ws - 7 * 86400000;
    const sum = (from, to) => log.filter(e => e.type === 'fuerza' && e.date >= from && e.date < to)
      .reduce((a, e) => ({ vol: a.vol + (e.volume || 0), sets: a.sets + (e.totalSets || 0), n: a.n + 1 }), { vol: 0, sets: 0, n: 0 });
    return { cur: sum(ws, Infinity), prev: sum(prevWs, ws) };
  }, [log]);
  const volDiff = weekly.prev.vol ? Math.round(((weekly.cur.vol - weekly.prev.vol) / weekly.prev.vol) * 100) : null;
  return (
    <div className="screen-scroll screen-anim">
      <div className="eyebrow">Evolución</div>
      <div className="h-title" style={{ margin: '4px 0 20px' }}>Progreso</div>
      <div className="bento-grid">
        <StatCard value={weekly.cur.n} unit="" label="Entrenos semana" color="var(--lime)" />
        <StatCard value={weekly.cur.sets} unit="" label="Series semana" />
        <StatCard value={weekly.cur.vol >= 10000 ? fmtKg(weekly.cur.vol / 1000) : weekly.cur.vol.toLocaleString('es')} unit={weekly.cur.vol >= 10000 ? 't' : 'kg'} label="Volumen semana" />
      </div>
      {volDiff !== null && (
        <div className="dim" style={{ fontSize: 13, margin: '10px 4px 0' }}>
          Volumen vs semana pasada: <b style={{ color: volDiff >= 0 ? 'var(--lime)' : 'var(--danger)' }}>{volDiff >= 0 ? '+' : ''}{volDiff}%</b>
        </div>
      )}
      {groups.length === 0 && <div className="empty">Cuando registres series con kg y repeticiones verás aquí tus récords y su evolución. 📈</div>}
      {groups.map(g => (
        <div key={g.name}>
          <div className="section-head"><h2>{g.icon} {g.name}</h2></div>
          {g.items.map(it => <ProgressRow key={it.name} name={it.name} hist={it.hist} />)}
        </div>
      ))}
      {groups.length > 0 && <div className="faint" style={{ fontSize: 11.5, textAlign: 'center', marginTop: 12 }}>1RM estimado con la fórmula de Epley a partir de tu mejor serie.</div>}
    </div>
  );
}

   ============================================================ */
const BOOT_DRAFT = loadDraft();
const BASE_TABS = ['home', 'history', 'progress', 'settings'];

function App() {
  const [store, setStore] = useState(loadStore);
  const [draft, setDraft] = useState(BOOT_DRAFT);
  const [screen, setScreen] = useState(BOOT_DRAFT ? BOOT_DRAFT.stage : 'home');
  const [pick, setPick] = useState(null);
  const [toast, setToast] = useState(null);   // { msg, action? }
  const [dialog, setDialog] = useState(null); // { title, text, confirm, danger, resolve }
  const [sheet, setSheet] = useState(null);   // entrada del historial abierta
  const toastTimer = useRef(null);
  const saveWarned = useRef(false);

  const showToast = (msg, action) => {
    clearTimeout(toastTimer.current);
    setToast({ msg, action, key: Date.now() });
    toastTimer.current = setTimeout(() => setToast(null), action ? 4500 : 2400);
  };
  const ask = (opts) => new Promise(resolve => setDialog({ ...opts, resolve }));
  const closeDialog = (v) => { if (dialog) dialog.resolve(v); setDialog(null); };

  // Persistencia
  useEffect(() => {
    if (!saveStore(store) && !saveWarned.current) {
      saveWarned.current = true;
      showToast('⚠️ No se pudo guardar. Exporta tus datos');
    }
  }, [store]);
  useEffect(() => { saveDraft(draft); }, [draft]);
  useEffect(() => {
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
    if (BOOT_DRAFT) showToast('💾 Entreno recuperado');
  }, []);

  const stats = useMemo(() => computeStats(store.log), [store.log]);
  const doneSet = useMemo(() => doneRoutinesForWeek(store.log, store.week), [store.log, store.week]);
  const nextRoutine = ROUTINES.find(r => !doneSet.has(r.key)) || null;

  const setWeek = (w) => setStore(s => ({ ...s, week: clampWeek(w) }));
  const addSession = (data) => {
    const entry = { id: uid(), date: Date.now(), ...data };
    setStore(s => ({ ...s, log: [...s.log, entry] }));
    return entry;
  };
  const removeEntry = (id) => setStore(s => ({ ...s, log: s.log.filter(e => e.id !== id) }));

  /* ---- Flujo de fuerza ---- */
  const goFuerza = () => { buzz(); if (draft) setScreen(draft.stage); else setScreen('routine'); };
  const pickRoutine = (r) => { buzz(); setPick(r); setScreen('complement'); };
  const startWorkout = (comp, cardio) => {
    buzz(15);
    setDraft(buildDraft(pick, comp, cardio, store.week, store.log));
    setScreen('workout');
  };
  const pauseWorkout = () => { setScreen('home'); showToast('⏸ Entreno en pausa, se guarda solo'); };
  const finishWorkout = () => { buzz(25); setScreen('finish'); };
  const backToWorkout = () => { setDraft(d => ({ ...d, stage: 'workout' })); setScreen('workout'); };
  const discardDraft = async () => {
    const ok = await ask({ title: '¿Descartar el entreno?', text: 'Se perderán las series registradas en esta sesión.', confirm: 'Descartar', danger: true });
    if (!ok) return;
    setDraft(null); setScreen('home'); showToast('Entreno descartado');
  };
  const saveWorkout = async (session) => {
    if (session.totalSets === 0) {
      const ok = await ask({ title: 'No has marcado ninguna serie', text: 'Marca con ✓ las series hechas para que cuenten. ¿Guardar igualmente?', confirm: 'Guardar' });
      if (!ok) return;
    }
    const prs = findPRs(store.log, draft.exList).length;
    addSession(session);
    setDraft(null);
    setScreen('home');
    showToast(prs ? `🏆 Sesión guardada · ${prs} récord${prs > 1 ? 's' : ''}` : '💪 Sesión guardada');
  };

  /* ---- Otros registros ---- */
  const saveCardio = (data) => { addSession(data); setScreen('home'); showToast('🏃 Cardio registrado'); };
  const registerRest = () => {
    buzz();
    const today = store.log.filter(s => dayKey(s.date) === dayKey(Date.now()));
    if (today.some(s => s.type === 'descanso')) { showToast('🌙 Hoy ya está marcado'); return; }
    if (today.some(isTraining)) { showToast('💪 Hoy ya has entrenado'); return; }
    const entry = addSession({ type: 'descanso' });
    showToast('🌙 Descanso registrado', { label: 'Deshacer', fn: () => removeEntry(entry.id) });
  };
  const deleteEntry = async (entry) => {
    const ok = await ask({ title: '¿Eliminar esta sesión?', text: `${entryView(entry).title} · ${fmtDate(entry.date)}. No se puede deshacer.`, confirm: 'Eliminar', danger: true });
    if (!ok) return;
    removeEntry(entry.id); setSheet(null); showToast('🗑️ Sesión eliminada');
  };

  /* ---- Datos ---- */
  const exportData = async () => {
    const json = JSON.stringify(store, null, 2);
    const name = `strybe-${new Date().toISOString().slice(0, 10)}.json`;
    try {
      const file = new File([json], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Copia de STRYBE' });
        showToast('📤 Copia lista');
        return;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }
    try {
      const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      showToast('📤 Datos exportados');
    } catch (e) { showToast('No se pudo exportar'); }
  };
  const importData = async (file) => {
    let parsed;
    try { parsed = JSON.parse(await file.text()); } catch (e) { showToast('❌ El archivo no es un JSON válido'); return; }
    if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.log)) { showToast('❌ No parece una copia de STRYBE'); return; }
    const next = migrate(parsed);
    const ok = await ask({ title: 'Importar copia', text: `Contiene ${next.log.length} ${next.log.length === 1 ? 'registro' : 'registros'} (semana ${next.week}). Reemplazará ${store.log.length === 1 ? 'el registro actual' : `los ${store.log.length} registros actuales`}.`, confirm: 'Importar', danger: store.log.length > 0 });
    if (!ok) return;
    setStore(next); showToast('📥 Datos importados');
  };
  const clearData = async () => {
    const ok = await ask({ title: '¿Borrar TODOS los datos?', text: 'Se eliminarán todas las sesiones y el entreno en curso. Te recomendamos exportar antes una copia.', confirm: 'Borrar todo', danger: true });
    if (!ok) return;
    setStore(s => ({ ...s, week: 1, log: [] })); setDraft(null); showToast('🗑️ Datos borrados');
  };

  /* ---- Botón/gesto "atrás" del sistema (Android) ---- */
  const backRef = useRef(() => false);
  backRef.current = () => {
    if (dialog) { closeDialog(false); return true; }
    if (sheet) { setSheet(null); return true; }
    switch (screen) {
      case 'routine': setScreen('home'); return true;
      case 'complement': setScreen('routine'); return true;
      case 'workout': pauseWorkout(); return true;
      case 'finish': backToWorkout(); return true;
      case 'cardio': case 'history': case 'progress': case 'settings': setScreen('home'); return true;
      default: return false;
    }
  };
  useEffect(() => {
    try { history.replaceState({ strybe: 'base' }, ''); history.pushState({ strybe: 'app' }, ''); } catch (e) {}
    const onPop = () => {
      if (backRef.current()) { try { history.pushState({ strybe: 'app' }, ''); } catch (e) {} }
      else { try { history.back(); } catch (e) {} }
    };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  const isBaseTab = BASE_TABS.includes(screen);
  const draftRoutineMissing = (screen === 'workout' || screen === 'finish') && !draft;
  useEffect(() => { if (draftRoutineMissing) setScreen('home'); }, [draftRoutineMissing]);

  return (
    <div className="app-shell">
      {screen !== 'workout' && <div className="aurora-field" aria-hidden="true"><div className="aurora a1" /><div className="aurora a2" /><div className="aurora a3" /></div>}

      {screen === 'home' && <HomeScreen store={store} stats={stats} draft={draft} nextRoutine={nextRoutine}
        onFuerza={goFuerza}
        onCardio={() => { buzz(); setScreen('cardio'); }}
        onDescanso={registerRest}
        onResume={goFuerza}
        onDiscard={discardDraft}
        goHistory={() => setScreen('history')}
        onOpen={setSheet} />}

      {screen === 'history' && <HistoryScreen log={store.log} onOpen={setSheet} />}
      {screen === 'progress' && <ProgressScreen log={store.log} />}
      {screen === 'settings' && <SettingsScreen store={store} setWeek={setWeek}
        setName={(n) => setStore(s => ({ ...s, name: n }))}
        setSetting={(k, v) => setStore(s => ({ ...s, settings: { ...s.settings, [k]: v } }))}
        onExport={exportData} onImport={importData} onClear={clearData} />}

      {screen === 'routine' && <RoutineScreen store={store} setWeek={setWeek} onPick={pickRoutine} onBack={() => setScreen('home')} doneSet={doneSet} />}
      {screen === 'complement' && pick && <ComplementScreen routine={pick} onStart={startWorkout} onBack={() => setScreen('routine')} />}
      {screen === 'workout' && draft && <WorkoutScreen draft={draft} setDraft={setDraft} settings={store.settings} onFinish={finishWorkout} onPause={pauseWorkout} />}
      {screen === 'finish' && draft && <FinishScreen draft={draft} setDraft={setDraft} log={store.log} onSave={saveWorkout} onBack={backToWorkout} onDiscard={discardDraft} />}
      {screen === 'cardio' && <CardioScreen onSave={saveCardio} onBack={() => setScreen('home')} />}

      {isBaseTab && <BottomNavigation active={screen} onChange={(k) => { buzz(); setScreen(k); }} />}
      {toast && (
        <div className={`toast ${isBaseTab ? '' : 'low'}`} key={toast.key} role="status">
          <span>{toast.msg}</span>
          {toast.action && <button onClick={() => { toast.action.fn(); setToast(null); }}>{toast.action.label}</button>}
        </div>
      )}
      {sheet && <Sheet onClose={() => setSheet(null)} label="Detalle de la sesión"><EntryDetail entry={sheet} onDelete={deleteEntry} /></Sheet>}
      {dialog && <Dialog d={dialog} onClose={closeDialog} />}
    </div>
  );
}

/* Red de seguridad: si algo falla al pintar, no perder los datos. */
class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  exportRaw() {
    try {
      const raw = localStorage.getItem(STORE_KEY) || LEGACY_KEYS.map(k => localStorage.getItem(k)).find(Boolean) || '{}';
      const url = URL.createObjectURL(new Blob([raw], { type: 'application/json' }));
      const a = document.createElement('a'); a.href = url; a.download = 'strybe-rescate.json'; document.body.appendChild(a); a.click(); a.remove();
    } catch (e) {}
  }
  render() {
    if (!this.state.error) return this.props.children;
    return (
      <div className="app-shell" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 14, padding: 32, textAlign: 'center' }}>
        <div style={{ fontSize: 46 }} aria-hidden="true">🛠️</div>
        <div style={{ fontSize: 18, fontWeight: 700 }}>Algo ha fallado</div>
        <div className="dim" style={{ fontSize: 14, maxWidth: 280, lineHeight: 1.5 }}>Tus datos siguen guardados. Prueba a recargar; si se repite, descarga una copia.</div>
        <button className="btn-primary" style={{ maxWidth: 260 }} onClick={() => location.reload()}>Recargar</button>
        <button className="btn-ghost" style={{ maxWidth: 260 }} onClick={() => this.exportRaw()}>Descargar copia de datos</button>
        <button className="btn-text" style={{ maxWidth: 260 }} onClick={() => { saveDraft(null); location.reload(); }}>Descartar entreno en curso y recargar</button>
      </div>
    );
  }
}

if (!window.__strybeMounted) {
  window.__strybeMounted = true;
  if (window.__bootWatchdog) clearTimeout(window.__bootWatchdog);
  const __rootEl = document.getElementById('root');
  __rootEl.innerHTML = '';
  ReactDOM.createRoot(__rootEl).render(<ErrorBoundary><App /></ErrorBoundary>);
}
</script>
</body>
</html>
