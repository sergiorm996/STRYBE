function ProgressRow({ name, hist }) {
  const [open, setOpen] = useState(false);
  const best = hist.reduce((a, h) => (h.e1rm > a.e1rm ? h : a), hist[0]);
  const last = hist[hist.length - 1];
  const prev = hist[hist.length - 2];
  const diff = prev ? last.e1rm - prev.e1rm : 0;
  const cls = !prev ? '' : diff > 0.05 ? 'up' : diff < -0.05 ? 'down' : 'eq';
  return (
    <BentoCard className="prog-row" onClick={() => setOpen(o => !o)} label={`${name}. ${open ? 'Ocultar' : 'Ver'} historial`}>
      <div className="prog-top">
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 14.5, fontWeight: 600 }}>{name}</div>
          <div className="dim" style={{ fontSize: 12.5, marginTop: 3 }}>
            Récord {fmtKg(best.kg)} kg × {best.reps} · 1RM ≈ {fmtKg(best.e1rm)} kg
          </div>
          {prev && <span className={`delta ${cls}`} style={{ display: 'inline-block', marginTop: 6 }}>
            {cls === 'eq' ? '= igual que la anterior' : `${diff > 0 ? '▲ +' : '▼ '}${fmtKg(diff)} kg vs anterior`}</span>}
        </div>
        <Sparkline values={hist.slice(-10).map(h => h.e1rm)} />
      </div>
      {open && (
        <div className="prog-table">
          {hist.slice(-8).reverse().map((h, i) => (
            <React.Fragment key={i}>
              <div className="dim">{fmtDate(h.date)}</div>
              <div>{fmtKg(h.kg)} kg × {h.reps} <span className="faint">· S{h.week}</span></div>
              <div style={{ fontWeight: 700 }}>{fmtKg(h.e1rm)}</div>
            </React.Fragment>
          ))}
        </div>
      )}
    </BentoCard>
  );
}

function ProgressScreen({ log, onSummary }) {
  const groups = useMemo(() => {
    const all = [
      ...ROUTINES.map(r => ({ name: r.name, icon: r.icon, exercises: r.exercises })),
      ...Object.values(COMPLEMENTS).map(c => ({ name: c.name, icon: c.icon, exercises: c.exercises })),
    ];
    // Ejercicios puntuales o sustitutos que no están en ninguna rutina.
    const known = new Set(all.flatMap(g => g.exercises.map(e => nameKey(e.name))));
    const others = new Map();
    log.forEach(e => {
      if (e.type !== 'fuerza') return;
      (e.exercises || []).forEach(x => { const k = nameKey(x.name); if (x.status !== 'skipped' && !known.has(k) && !others.has(k)) others.set(k, x.name); });
    });
    if (others.size) all.push({ name: 'Otros ejercicios', icon: '➕', exercises: [...others.values()].map(name => ({ name })) });
    return all.map(g => ({ ...g, items: g.exercises.map(e => ({ name: e.name, hist: exerciseHistory(log, e.name) })).filter(x => x.hist.length) }))
      .filter(g => g.items.length);
  }, [log]);
  const weekly = useMemo(() => {
    const ws = startOfWeek().getTime(), prevWs = ws - 7 * 86400000;
    const sum = (from, to) => log.filter(e => e.type === 'fuerza' && e.date >= from && e.date < to)
      .reduce((a, e) => {
        // Igual que en los resúmenes: series hechas, sin calentamiento, de ejercicios no saltados.
        let vol = 0, sets = 0;
        (e.exercises || []).forEach(x => { if (x.status === 'skipped') return; workSets(x).forEach(st => { vol += num(st.kg) * int(st.reps); sets++; }); });
        return { vol: a.vol + vol, sets: a.sets + sets, n: a.n + 1 };
      }, { vol: 0, sets: 0, n: 0 });
    return { cur: sum(ws, Infinity), prev: sum(prevWs, ws) };
  }, [log]);
  const volDiff = weekly.prev.vol ? Math.round(((weekly.cur.vol - weekly.prev.vol) / weekly.prev.vol) * 100) : null;
  return (
    <div className="screen-scroll screen-anim">
      <div className="eyebrow">Evolución</div>
      <div className="h-title" style={{ margin: '4px 0 20px' }}>Progreso</div>
      <BentoCard style={{ marginBottom: 18 }}>
        <div style={{ fontSize: 15, fontWeight: 600 }}>🤖 Resumen para tu entrenador IA</div>
        <div className="hist-date">Adherencia, series, e1RM, músculos, cardio, cuerpo y check-in, listo para pegar.</div>
        <div className="coach-btns">
          <button className="btn-primary press" onClick={() => onSummary('week')}>Semanal</button>
          <button className="btn-ghost press" onClick={() => onSummary('month')}>Mensual</button>
        </div>
      </BentoCard>
      <div className="bento-grid">
        <StatCard value={weekly.cur.n} unit="" label="Entrenos semana" color="var(--lime)" />
        <StatCard value={weekly.cur.sets} unit="" label="Series semana" />
        <StatCard value={weekly.cur.vol >= 10000 ? fmtKg(weekly.cur.vol / 1000) : weekly.cur.vol.toLocaleString('es')} unit={weekly.cur.vol >= 10000 ? 't' : 'kg'} label="Volumen semana" />
      </div>
      {volDiff !== null && (
        <div className="dim" style={{ fontSize: 13, margin: '10px 4px 0' }}>
          Volumen vs semana pasada: <b style={{ color: volDiff >= 0 ? 'var(--lime)' : 'var(--danger)' }}>{volDiff >= 0 ? '+' : ''}{volDiff}%</b>
        </div>
      )}
      {groups.length === 0 && <div className="empty">Cuando registres series con kg y repeticiones verás aquí tus récords y su evolución. 📈</div>}
      {groups.map(g => (
        <div key={g.name}>
          <div className="section-head"><h2>{g.icon} {g.name}</h2></div>
          {g.items.map(it => <ProgressRow key={it.name} name={it.name} hist={it.hist} />)}
        </div>
      ))}
      {groups.length > 0 && <div className="faint" style={{ fontSize: 11.5, textAlign: 'center', marginTop: 12 }}>1RM estimado con la fórmula de Epley a partir de tu mejor serie.</div>}
    </div>
  );
}

/* ============================================================
   RESÚMENES PARA EL ENTRENADOR IA
   La app hace todos los cálculos; el texto solo los presenta.
   - Semanal: lunes a domingo.
   - Mensual: las 4 semanas que acaban en la semana elegida.
   ============================================================ */
const MAIN_MUSCLES = ['pecho', 'espalda', 'hombro', 'bíceps', 'tríceps', 'cuádriceps', 'femoral', 'gemelo', 'abdomen'];
const fmtC = (n, d = 1) => (n == null || !isFinite(n) ? '–' : (Math.round(n * 10 ** d) / 10 ** d).toLocaleString('es', { maximumFractionDigits: d }));
const fmtSigned = (n, d = 1) => (n == null || !isFinite(n) ? '–' : (n > 0.0001 ? '+' : n < -0.0001 ? '' : '±') + fmtC(n, d));
function weekRange(offset) {
  const s = startOfWeek(); s.setDate(s.getDate() - offset * 7);
  const e = new Date(s); e.setDate(e.getDate() + 7);
  return { from: s.getTime(), to: e.getTime() };
}
const shiftWeeks = (r, n) => { const s = new Date(r.from); s.setDate(s.getDate() + 7 * n); const e = new Date(r.to); e.setDate(e.getDate() + 7 * n); return { from: s.getTime(), to: e.getTime() }; };
const inRange = (t, r) => t >= r.from && t < r.to;
const workSets = (x) => (x.sets || []).filter(s => s && s.done && !s.warmup);
function e1rmOfSets(sets) {
  let b = 0;
  sets.forEach(s => { const kg = num(s.kg), r = int(s.reps); if (kg > 0 && r > 0) b = Math.max(b, kg * (1 + r / 30)); });
  return b || null;
}
const setTxt = (s) => `${s.kg ? String(s.kg).replace('.', ',') : '0'}x${s.reps || 0}${s.rir != null && String(s.rir) !== '' ? '@RIR' + String(s.rir).replace('.', ',') : ''}${s.warmup ? ' (calentamiento)' : ''}`;
const reasonTxt = (k) => (SKIP_LABEL[k] || k || 'sin motivo').toLowerCase();
const countList = (arr) => { const m = new Map(); arr.forEach(x => m.set(x, (m.get(x) || 0) + 1)); return [...m].map(([k, n]) => (n > 1 ? `${k} ×${n}` : k)).join(', '); };
const dayLabel = (ts) => fmtDate(ts);
const rangeISO = (r) => `${isoDay(r.from)} a ${isoDay(r.to - 1)}`;

/* Mejor e1RM de un ejercicio en un rango, y la última vez antes de una fecha. */
function bestE1rmIn(log, name, r) {
  let best = null;
  log.forEach(e => { if (e.type !== 'fuerza' || !inRange(e.date, r)) return; (e.exercises || []).forEach(x => { if (x.name === name && x.status !== 'skipped') { const v = e1rmOfSets(workSets(x)); if (v && (!best || v > best)) best = v; } }); });
  return best;
}
function lastE1rmBefore(log, name, ts) {
  for (let i = log.length - 1; i >= 0; i--) {
    const e = log[i];
    if (e.type !== 'fuerza' || e.date >= ts) continue;
    for (const x of e.exercises || []) if (x.name === name && x.status !== 'skipped') { const v = e1rmOfSets(workSets(x)); if (v) return { v, date: e.date }; }
  }
  return null;
}

/* Datos de un periodo (todos los números del resumen salen de aquí). */
function periodData(store, r) {
  const log = store.log;
  const sessions = log.filter(e => e.type === 'fuerza' && inRange(e.date, r)).sort((a, b) => a.date - b.date);
  const cardioFree = log.filter(e => e.type === 'cardio' && inRange(e.date, r));
  const routines = new Set(sessions.map(routineKeyOf).filter(Boolean));
  let done = 0, skipped = 0, extra = 0, subs = 0, volume = 0, effSets = 0;
  const reasons = [];
  const muscles = {};
  sessions.forEach(e => (e.exercises || []).forEach(x => {
    if (x.status === 'skipped') { skipped++; reasons.push(reasonTxt(x.skipReason)); return; }
    if (x.status === 'extra') extra++; else { done++; if (x.status === 'substituted') subs++; }
    const ws = workSets(x);
    effSets += ws.length;
    const m = x.muscle || 'otro';
    muscles[m] = (muscles[m] || 0) + ws.length;
    ws.forEach(s => { volume += num(s.kg) * int(s.reps); });
  }));
  const cardio = [
    ...cardioFree.map(c => ({ min: Number(c.duration) || 0, km: Number(c.distance) || 0, kind: c.cardioType })),
    ...sessions.filter(e => e.cardio).map(e => ({ min: Number(e.cardio.duration) || 0, km: Number(e.cardio.distance) || 0, kind: e.cardio.type })),
  ];
  const blockWeeks = [...new Set(sessions.map(e => e.week).filter(Boolean))].sort((a, b) => a - b);
  // Peso: media de 7 días al final del periodo (o hoy, si el periodo no ha acabado)
  const ws = weightStats(store.body || []);
  const endDn = Math.min(dayNum(isoDay(r.to - 1)), ws.today);
  const avg = ws.avgAt(endDn), avgPrev = ws.avgAt(endDn - 7);
  const weighDays = (store.body || []).filter(b => b.weight > 0 && inRange(new Date(b.date + 'T12:00:00').getTime(), r)).length;
  const measures = (store.body || []).filter(b => inRange(new Date(b.date + 'T12:00:00').getTime(), r) && BODY_FIELDS.slice(1).some(f => b[f.k] != null));
  return { r, sessions, routines, done, skipped, extra, subs, reasons, muscles, volume, effSets, cardio, blockWeeks, avg, avgPrev, weighDays, measures, endDn, ws };
}

const blockLabel = (weeks, fallback) => (weeks.length === 0 ? `Semana ${fallback} del bloque (sin entrenos)` : weeks.length === 1 ? `Semana ${weeks[0]} del bloque` : `Semanas ${weeks[0]}–${weeks[weeks.length - 1]} del bloque`);
function adherenceLine(d, weeksCount) {
  const total = ROUTINES.length * weeksCount;
  const nRout = weeksCount === 1 ? d.routines.size : d.routinesTotal;
  const missing = weeksCount === 1 ? ROUTINES.filter(x => !d.routines.has(x.key)).map(x => x.name) : [];
  const parts = [
    `${nRout}/${total} rutinas${missing.length && missing.length < ROUTINES.length ? ` (falta ${missing.join(', ')})` : ''}`,
    `${d.done} de ${d.done + d.skipped} ejercicios hechos`,
  ];
  if (d.skipped) parts.push(`${d.skipped} ${d.skipped === 1 ? 'saltado' : 'saltados'} (${countList(d.reasons)})`);
  if (d.extra) parts.push(`${d.extra} ${d.extra === 1 ? 'puntual' : 'puntuales'}`);
  if (d.subs) parts.push(`${d.subs} ${d.subs === 1 ? 'sustituido' : 'sustituidos'}`);
  return parts.join(' · ');
}
function musclesLine(muscles, div = 1) {
  const keys = [...MAIN_MUSCLES, ...Object.keys(muscles).filter(m => !MAIN_MUSCLES.includes(m) && muscles[m])];
  return keys.map(m => `${m} ${fmtC((muscles[m] || 0) / div, div === 1 ? 0 : 1)}`).join(' · ');
}
function cardioLine(c) {
  if (!c.length) return 'Sin cardio';
  const min = c.reduce((a, x) => a + x.min, 0), km = c.reduce((a, x) => a + x.km, 0);
  return `${c.length} ${c.length === 1 ? 'sesión' : 'sesiones'} · ${fmtC(min, 0)} min${km ? ` · ${fmtC(km, 1)} km` : ''} (${countList(c.map(x => (x.kind || 'cardio').toLowerCase()))})`;
}
const measureTxt = (b) => BODY_FIELDS.slice(1).filter(f => b[f.k] != null).map(f => `${f.label.toLowerCase()} ${fmtC(b[f.k])}${f.unit === '%' ? ' %' : ' cm'}`).join(' · ');
const checkinTxt = (c) => `sueño ${c.sleep || '–'}/5 · energía ${c.energy || '–'}/5 · estrés ${c.stress || '–'}/5${c.notes ? ` · "${c.notes}"` : ''}`;

/* Línea de un ejercicio dentro de una sesión. */
function exerciseLine(log, e, x, compareRange) {
  if (x.status === 'skipped') return `${x.name} [skipped: ${reasonTxt(x.skipReason)}]`;
  const tag = x.status === 'substituted' ? `substituted: en lugar de ${x.substitutedFor || '?'}` : x.status;
  const sets = (x.sets || []).filter(s => s && s.done);
  let line = `${x.name} [${tag}] ${sets.length ? sets.map(setTxt).join(', ') : 'sin series'}`;
  const v = e1rmOfSets(workSets(x));
  if (v) {
    let cmp = '';
    const prevWeek = compareRange ? bestE1rmIn(log, x.name, compareRange) : null;
    if (prevWeek) cmp = `${fmtSigned(v - prevWeek)} vs semana anterior`;
    else { const last = lastE1rmBefore(log, x.name, e.date); cmp = last ? `${fmtSigned(v - last.v)} vs ${dayLabel(last.date)}` : 'primera vez'; }
    line += ` · e1RM ${fmtC(v)} kg (${cmp})`;
  }
  if (x.notes) line += ` · nota: ${x.notes}`;
  return line;
}

function buildReport(store, kind, offset) {
  const L = [];
  const end = weekRange(offset);
  if (kind === 'week') {
    const d = periodData(store, end);
    L.push(`# RESUMEN SEMANAL · ${rangeISO(end)} · ${blockLabel(d.blockWeeks, store.week)}`);
    L.push(`Adherencia: ${adherenceLine(d, 1)}`);
    L.push('', '## Entrenos');
    if (!d.sessions.length) L.push('Sin entrenos de fuerza esta semana.');
    const prev = shiftWeeks(end, -1);
    d.sessions.forEach(e => {
      const comp = e.complement ? ` + ${COMPLEMENT_BY_KEY[e.complement] ? COMPLEMENT_BY_KEY[e.complement].name : e.complement}` : '';
      L.push('', `### ${e.routine}${comp} · ${dayLabel(e.date)}${e.durationMin ? ` · ${e.durationMin} min` : ''} · semana ${e.week}`);
      if (e.notes) L.push(`Notas: ${e.notes}`);
      (e.exercises || []).forEach(x => L.push(exerciseLine(store.log, e, x, prev)));
    });
    L.push('', '## Series efectivas por músculo', musclesLine(d.muscles), `Total: ${d.effSets} series · volumen ${fmtC(d.volume, 0)} kg`);
    L.push('', '## Cardio', cardioLine(d.cardio));
    L.push('', '## Cuerpo');
    L.push(d.avg != null ? `Peso medio 7 días: ${fmtC(d.avg)} kg${d.avgPrev != null ? ` (${fmtSigned(d.avg - d.avgPrev)} vs semana anterior)` : ''} · días pesado: ${d.weighDays}/7` : 'Sin registros de peso.');
    const m = d.measures[d.measures.length - 1];
    if (m) L.push(`Medidas (${fmtDay(m.date)}): ${measureTxt(m)}`);
    const ck = (store.checkins || []).find(c => c.week === isoDay(end.from));
    L.push(ck ? `Check-in: ${checkinTxt(ck)}` : 'Check-in: sin rellenar');
    return { text: L.join('\n'), title: `Resumen semanal ${isoDay(end.from)}`, filename: `strybe-resumen-semanal-${isoDay(end.from)}.md`, label: `Semana del ${fmtDay(isoDay(end.from))}` };
  }

  // ---- Mensual: 4 semanas ----
  const weeks = [3, 2, 1, 0].map(i => shiftWeeks(end, -i));
  const full = { from: weeks[0].from, to: end.to };
  const d = periodData(store, full);
  const perWeek = weeks.map(w => periodData(store, w));
  d.routinesTotal = perWeek.reduce((a, w) => a + w.routines.size, 0);
  L.push(`# RESUMEN MENSUAL · ${rangeISO(full)} (4 semanas) · ${blockLabel(d.blockWeeks, store.week)}`);
  L.push(`Adherencia: ${adherenceLine(d, 4)}`);

  L.push('', '## Tendencia por semana', '| Semana | Rutinas | Series efectivas | Volumen | Cardio | Peso medio 7 d |', '|---|---|---|---|---|---|');
  perWeek.forEach(w => L.push(`| ${fmtDay(isoDay(w.r.from))} | ${w.routines.size}/${ROUTINES.length} | ${w.effSets} | ${fmtC(w.volume, 0)} kg | ${fmtC(w.cardio.reduce((a, x) => a + x.min, 0), 0)} min | ${w.avg != null ? fmtC(w.avg) + ' kg' : '–'} |`));

  // e1RM: primera vs última semana del periodo en que se hizo cada ejercicio
  L.push('', '## e1RM por ejercicio (primera → última semana del periodo)');
  const names = [...new Set(d.sessions.flatMap(e => (e.exercises || []).filter(x => x.status !== 'skipped' && e1rmOfSets(workSets(x))).map(x => x.name)))];
  const cmpLines = names.map(n => {
    const vals = weeks.map(w => bestE1rmIn(store.log, n, w)).filter(Boolean);
    return vals.length >= 2 ? `${n}: ${fmtC(vals[0])} → ${fmtC(vals[vals.length - 1])} kg (${fmtSigned(vals[vals.length - 1] - vals[0])})` : `${n}: ${fmtC(vals[0])} kg (solo 1 semana)`;
  });
  L.push(...(cmpLines.length ? cmpLines : ['Sin series con kg y repeticiones.']));

  // Estancados: el mejor e1RM de las 3 últimas semanas en que se hizo no supera el máximo anterior
  L.push('', '## Estancados (e1RM sin mejorar 3 semanas seguidas)');
  const stuck = [];
  names.forEach(n => {
    const byWeek = new Map();
    store.log.forEach(e => {
      if (e.type !== 'fuerza' || e.date >= end.to) return;
      (e.exercises || []).forEach(x => {
        if (x.name !== n || x.status === 'skipped') return;
        const v = e1rmOfSets(workSets(x)); if (!v) return;
        const k = startOfWeek(e.date).getTime();
        byWeek.set(k, Math.max(byWeek.get(k) || 0, v));
      });
    });
    const series = [...byWeek].sort((a, b) => a[0] - b[0]).map(([, v]) => v);
    if (series.length < 4) return;
    const last3 = series.slice(-3), before = Math.max(...series.slice(0, -3));
    if (Math.max(...last3) <= before + 0.05) stuck.push(`${n}: mejor anterior ${fmtC(before)} kg · últimas 3 semanas ${last3.map(v => fmtC(v)).join(' · ')}`);
  });
  L.push(...(stuck.length ? stuck : ['Ninguno.']));

  L.push('', '## Series efectivas por músculo (media semanal)', musclesLine(d.muscles, 4), `Total 4 semanas: ${d.effSets} series · volumen ${fmtC(d.volume, 0)} kg`);
  L.push('', '## Cardio', cardioLine(d.cardio));

  L.push('', '## Cuerpo');
  const startAvg = d.ws.avgAt(dayNum(isoDay(full.from)) + 6);
  L.push(d.avg != null ? `Peso medio 7 días: ${fmtC(d.avg)} kg${startAvg != null ? ` · cambio en 4 semanas: ${fmtSigned(d.avg - startAvg)} kg` : ''} · días pesado: ${d.weighDays}/28` : 'Sin registros de peso.');
  if (d.measures.length >= 2) {
    const a = d.measures[0], b = d.measures[d.measures.length - 1];
    const ev = BODY_FIELDS.slice(1).filter(f => a[f.k] != null && b[f.k] != null).map(f => `${f.label.toLowerCase()} ${fmtC(a[f.k])} → ${fmtC(b[f.k])}${f.unit === '%' ? ' %' : ' cm'} (${fmtSigned(b[f.k] - a[f.k])})`);
    L.push(`Medidas (${fmtDay(a.date)} → ${fmtDay(b.date)}): ${ev.length ? ev.join(' · ') : 'sin medidas comparables'}`);
  } else if (d.measures.length === 1) L.push(`Medidas (${fmtDay(d.measures[0].date)}): ${measureTxt(d.measures[0])}`);
  else L.push('Sin medidas en el periodo.');

  L.push('', '## Check-ins');
  weeks.forEach(w => { const ck = (store.checkins || []).find(c => c.week === isoDay(w.from)); L.push(`Semana ${fmtDay(isoDay(w.from))}: ${ck ? checkinTxt(ck) : 'sin rellenar'}`); });
  return { text: L.join('\n'), title: `Resumen mensual ${isoDay(full.from)}`, filename: `strybe-resumen-mensual-${isoDay(full.from)}-a-${isoDay(end.to - 1)}.md`, label: `${fmtDay(isoDay(full.from))} – ${fmtDay(isoDay(end.to - 1))}` };
}

async function copyText(text) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch (e) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}

function SummarySheet({ store, kind, onToast }) {
  const [offset, setOffset] = useState(0);
  const rep = useMemo(() => buildReport(store, kind, offset), [store, kind, offset]);
  const copy = async () => onToast((await copyText(rep.text)) ? '📋 Resumen copiado' : 'No se pudo copiar');
  const share = async () => {
    if (!navigator.share) { onToast('Compartir no está disponible aquí: usa Copiar'); return; }
    try { await navigator.share({ title: rep.title, text: rep.text }); } catch (e) { if (e && e.name !== 'AbortError') onToast('No se pudo compartir'); }
  };
  const download = () => {
    try {
      const url = URL.createObjectURL(new Blob([rep.text], { type: 'text/markdown;charset=utf-8' }));
      const a = document.createElement('a');
      a.href = url; a.download = rep.filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      onToast('⬇️ ' + rep.filename);
    } catch (e) { onToast('No se pudo descargar'); }
  };
  return (
    <>
      <div className="h-title" style={{ fontSize: 22 }}>{kind === 'week' ? 'Resumen semanal' : 'Resumen mensual'}</div>
      <div className="hist-date" style={{ marginBottom: 12 }}>Para pegar en el chat de tu entrenador IA. Todos los cálculos los hace la app.</div>
      <div className="week-ctrl" style={{ marginBottom: 12 }}>
        <button className="week-btn press" aria-label={kind === 'week' ? 'Semana anterior' : 'Periodo anterior'} onClick={() => setOffset(o => o + 1)}>‹</button>
        <div style={{ textAlign: 'center', fontSize: 14.5, fontWeight: 600 }} aria-live="polite">{rep.label}{offset === 0 ? <div className="hist-date" style={{ marginTop: 2 }}>{kind === 'week' ? 'esta semana' : 'hasta esta semana'}</div> : null}</div>
        <button className="week-btn press" aria-label={kind === 'week' ? 'Semana siguiente' : 'Periodo siguiente'} disabled={offset === 0} onClick={() => setOffset(o => Math.max(0, o - 1))}>›</button>
      </div>
      <pre className="report" tabIndex={0} aria-label="Vista previa del resumen">{rep.text}</pre>
      <div className="report-actions">
        <button className="btn-primary press" onClick={copy}>📋 Copiar</button>
        <button className="btn-ghost press" onClick={share}>Compartir</button>
        <button className="btn-ghost press" onClick={download}>⬇️ .md</button>
      </div>
    </>
  );
}

/* ============================================================
   HISTORIAL: calendario de constancia + series semanales por músculo
   ============================================================ */
const CAL_WEEKS = 12;
function ConsistencyCalendar({ log }) {
  const data = useMemo(() => {
    const byDay = new Map();
    log.forEach(e => {
      const k = dayKey(e.date);
      const cur = byDay.get(k) || { f: false, c: false, r: false };
      if (e.type === 'fuerza') { cur.f = true; if (e.cardio) cur.c = true; }
      else if (e.type === 'cardio') cur.c = true;
      else if (e.type === 'descanso') cur.r = true;
      byDay.set(k, cur);
    });
    const start = startOfWeek(); start.setDate(start.getDate() - 7 * (CAL_WEEKS - 1));
    const todayK = dayKey(Date.now());
    const now = Date.now();
    const cols = [];
    let trained = 0, days = 0;
    for (let w = 0; w < CAL_WEEKS; w++) {
      const col = [];
      for (let d = 0; d < 7; d++) {
        const dt = new Date(start); dt.setDate(start.getDate() + w * 7 + d);
        const k = dayKey(dt.getTime());
        const future = dt.getTime() > now;
        const v = byDay.get(k) || {};
        if (!future) { days++; if (v.f || v.c) trained++; }
        col.push({ k, ts: dt.getTime(), future, today: k === todayK, f: !!v.f, c: !!v.c, r: !!v.r });
      }
      cols.push(col);
    }
    return { cols, trained, days, perWeek: trained / (days / 7) };
  }, [log]);
  const cell = (c) => (c.future ? 'cal-c fut' : `cal-c ${c.f ? 'f' : c.c ? 'c' : c.r ? 'r' : ''} ${c.today ? 'today' : ''}`);
  const label = (c) => `${fmtDate(c.ts)}: ${c.f ? 'fuerza' + (c.c ? ' y cardio' : '') : c.c ? 'cardio' : c.r ? 'descanso' : 'sin registro'}`;
  return (
    <BentoCard style={{ marginBottom: 12 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: 8 }}>
        <div style={{ fontSize: 15, fontWeight: 600 }}>Constancia</div>
        <div className="hist-date" style={{ marginTop: 0 }}>{data.trained} días · {fmtC(data.perWeek, 1)} por semana</div>
      </div>
      <div className="cal" role="img" aria-label={`Últimas ${CAL_WEEKS} semanas: ${data.trained} días con entreno`}>
        <div className="cal-days" aria-hidden="true">{WEEK_LETTERS.map((l, i) => <span key={i}>{i % 2 === 0 ? l : ''}</span>)}</div>
        {data.cols.map((col, i) => (
          <div className="cal-col" key={i}>{col.map(c => <span key={c.k} className={cell(c)} title={label(c)} />)}</div>
        ))}
      </div>
      <div className="cal-legend" aria-hidden="true">
        <span><i className="cal-c f" /> fuerza</span><span><i className="cal-c c" /> cardio</span><span><i className="cal-c r" /> descanso</span>
      </div>
    </BentoCard>
  );
}

const VOL_WEEKS = 6;
function MuscleVolume({ log }) {
  const data = useMemo(() => {
    const ranges = Array.from({ length: VOL_WEEKS }, (_, i) => weekRange(VOL_WEEKS - 1 - i));
    const per = {};
    log.forEach(e => {
      if (e.type !== 'fuerza') return;
      const wi = ranges.findIndex(r => inRange(e.date, r));
      if (wi < 0) return;
      (e.exercises || []).forEach(x => {
        if (x.status === 'skipped') return;
        const n = workSets(x).length;
        if (!n) return;
        const m = x.muscle || 'otro';
        (per[m] = per[m] || Array(VOL_WEEKS).fill(0))[wi] += n;
      });
    });
    const rows = Object.entries(per).map(([m, vals]) => ({ m, vals, total: vals.reduce((a, b) => a + b, 0) })).sort((a, b) => b.total - a.total);
    const max = Math.max(1, ...rows.flatMap(r => r.vals));
    return { rows, max, ranges };
  }, [log]);
  if (!data.rows.length) return null;
  return (
    <BentoCard style={{ marginBottom: 16 }}>
      <div style={{ fontSize: 15, fontWeight: 600 }}>Series por músculo</div>
      <div className="hist-date">Series efectivas por semana · últimas {VOL_WEEKS} semanas</div>
      <div className="mv">
        {data.rows.map(r => (
          <div className="mv-row" key={r.m} role="img" aria-label={`${r.m}: ${r.vals.join(', ')} series por semana (la última es esta semana)`}>
            <div className="mv-name">{r.m}</div>
            <div className="mv-bars" aria-hidden="true">
              {r.vals.map((v, i) => <span key={i} className={`mv-bar ${i === VOL_WEEKS - 1 ? 'cur' : ''}`} style={{ height: `${Math.max(v ? 8 : 2, (v / data.max) * 100)}%` }} />)}
            </div>
            <div className="mv-val">{r.vals[VOL_WEEKS - 1]}</div>
          </div>
        ))}
      </div>
      <div className="hist-date" style={{ display: 'flex', justifyContent: 'space-between', marginTop: 6, paddingLeft: 82, paddingRight: 30 }}>
        <span>{fmtDay(isoDay(data.ranges[0].from))}</span><span>esta semana</span>
      </div>
    </BentoCard>
  );
}

/* ============================================================
   CUERPO: peso, medidas y check-in semanal
   ============================================================ */
const todayISO = () => isoDay(Date.now());
const mondayISO = (ts = Date.now()) => isoDay(startOfWeek(ts).getTime());
/* Nº de día a partir de 'YYYY-MM-DD' (sin horas ni cambios de horario). */
const dayNum = (iso) => { const [y, m, d] = iso.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 86400000); };
const isoFromDayNum = (n) => new Date(n * 86400000).toISOString().slice(0, 10);
function fmtDay(iso) { const [y, m, d] = iso.split('-').map(Number); return fmtDate(new Date(y, m - 1, d).getTime()); }
const fmtNum1 = (n) => (n == null ? '–' : (Math.round(n * 10) / 10).toLocaleString('es', { minimumFractionDigits: 1, maximumFractionDigits: 1 }));

/* Media móvil de 7 días (los 7 días que acaban en `dn`, incluido) y cambio semanal. */
function weightStats(body) {
  const pts = body.filter(b => b.weight > 0).map(b => ({ dn: dayNum(b.date), w: b.weight })).sort((a, b) => a.dn - b.dn);
  const avgAt = (dn) => {
    const xs = pts.filter(p => p.dn <= dn && p.dn > dn - 7);
    return xs.length ? xs.reduce((a, p) => a + p.w, 0) / xs.length : null;
  };
  const today = dayNum(todayISO());
  const avg7 = avgAt(today);
  const prev7 = avgAt(today - 7);
  return { pts, avgAt, avg7, change: avg7 != null && prev7 != null ? avg7 - prev7 : null, last: pts[pts.length - 1] || null, today };
}

function WeightChart({ stats }) {
  const { pts, avgAt, today } = stats;
  if (pts.length < 2) return <div className="hist-date" style={{ textAlign: 'center', padding: '18px 0' }}>Registra tu peso unos días para ver la tendencia 📈</div>;
  const from = Math.max(pts[0].dn, today - 55);
  const days = today - from || 1;
  const shown = pts.filter(p => p.dn >= from);
  const ma = [];
  for (let dn = from; dn <= today; dn++) { const a = avgAt(dn); if (a != null && pts.some(p => p.dn <= dn && p.dn > dn - 7)) ma.push({ dn, w: a }); }
  const all = shown.map(p => p.w).concat(ma.map(p => p.w));
  const min = Math.min(...all) - 0.3, max = Math.max(...all) + 0.3;
  const W = 320, H = 130, PL = 34, PR = 6, PT = 8, PB = 18;
  const x = (dn) => PL + ((dn - from) / days) * (W - PL - PR);
  const y = (w) => PT + (1 - (w - min) / (max - min || 1)) * (H - PT - PB);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" role="img" aria-label={`Tendencia del peso: media de 7 días ${fmtNum1(stats.avg7)} kg`}>
      {[max - 0.3, (max + min) / 2, min + 0.3].map((v, i) => (
        <g key={i}>
          <line x1={PL} x2={W - PR} y1={y(v)} y2={y(v)} stroke="rgba(255,255,255,0.07)" />
          <text x={PL - 5} y={y(v) + 3.5} textAnchor="end" fontSize="9.5" fill="var(--text-faint)">{fmtNum1(v)}</text>
        </g>
      ))}
      <text x={PL} y={H - 4} fontSize="9.5" fill="var(--text-faint)">{fmtDay(isoFromDayNum(from))}</text>
      <text x={W - PR} y={H - 4} fontSize="9.5" fill="var(--text-faint)" textAnchor="end">hoy</text>
      {shown.map(p => <circle key={p.dn} cx={x(p.dn)} cy={y(p.w)} r="2.6" fill="rgba(244,247,245,0.35)" />)}
      {ma.length > 1 && <polyline points={ma.map(p => `${x(p.dn)},${y(p.w)}`).join(' ')} fill="none" stroke="var(--lime)" strokeWidth="2.4" strokeLinejoin="round" strokeLinecap="round" />}
    </svg>
  );
}

/* Hoja para añadir/editar un registro (una entrada por fecha: si ya existe, se edita). */
function BodyForm({ body, initialDate, onSave, onDelete }) {
  const load = (date) => {
    const e = body.find(b => b.date === date);
    const f = { date, notes: e ? e.notes : '' };
    BODY_FIELDS.forEach(x => { f[x.k] = e && e[x.k] != null ? String(e[x.k]).replace('.', ',') : ''; });
    return f;
  };
  const [f, setF] = useState(() => load(initialDate || todayISO()));
  const [err, setErr] = useState('');
  const existing = body.find(b => b.date === f.date);
  const changeDate = (d) => { if (ISO_DAY_RE.test(d)) setF(load(d)); };
  const save = () => {
    if (f.date > todayISO()) { setErr('La fecha no puede ser futura.'); return; }
    const rec = { date: f.date, notes: f.notes.trim().slice(0, 500) };
    for (const x of BODY_FIELDS) {
      const raw = String(f[x.k] || '').trim();
      if (!raw) { rec[x.k] = null; continue; }
      const n = num(raw);
      if (!(n >= x.min && n <= x.max)) { setErr(`${x.label}: pon un valor entre ${x.min} y ${x.max} ${x.unit}.`); return; }
      rec[x.k] = Math.round(n * 100) / 100;
    }
    if (BODY_FIELDS.every(x => rec[x.k] == null) && !rec.notes) { setErr('Rellena al menos un dato.'); return; }
    onSave(rec);
  };
  return (
    <>
      <div className="h-title" style={{ fontSize: 22, marginBottom: 4 }}>{existing ? 'Editar registro' : 'Nuevo registro'}</div>
      <div className="hist-date" style={{ marginBottom: 16 }}>{existing ? 'Ya hay datos ese día: los estás editando.' : 'Solo hace falta rellenar lo que hayas medido.'}</div>
      <div className="field">
        <label htmlFor="bf-date">Fecha</label>
        <input id="bf-date" type="date" value={f.date} max={todayISO()} onChange={e => changeDate(e.target.value)} />
      </div>
      <div className="body-grid">
        {BODY_FIELDS.map(x => (
          <div className="field" key={x.k}>
            <label htmlFor={'bf-' + x.k}>{x.label} ({x.unit})</label>
            <input id={'bf-' + x.k} type="text" inputMode="decimal" placeholder="–" value={f[x.k]}
              onChange={e => setF({ ...f, [x.k]: sanitizeDecimal(e.target.value, 6) })} />
          </div>
        ))}
      </div>
      <div className="field">
        <label htmlFor="bf-notes">Notas</label>
        <input id="bf-notes" type="text" maxLength={500} placeholder="Opcional" value={f.notes} onChange={e => setF({ ...f, notes: e.target.value })} />
      </div>
      {err && <div className="err" role="alert" style={{ marginTop: 0, marginBottom: 12 }}>{err}</div>}
      <button className="btn-primary press" onClick={save}>Guardar</button>
      {existing && <button className="btn-text press" style={{ marginTop: 6 }} onClick={() => onDelete(existing)}>🗑️ Borrar el registro del {fmtDay(existing.date)}</button>}
    </>
  );
}

function CheckinCard({ checkins, onSave }) {
  const week = mondayISO();
  const cur = checkins.find(c => c.week === week);
  const prev = checkins.filter(c => c.week < week).pop();
  const [editing, setEditing] = useState(!cur);
  const [f, setF] = useState(() => ({ sleep: cur ? cur.sleep : null, energy: cur ? cur.energy : null, stress: cur ? cur.stress : null, notes: cur ? cur.notes : '' }));
  const [err, setErr] = useState('');
  const save = () => {
    if (CHECKIN_FIELDS.some(x => !f[x.k])) { setErr('Puntúa sueño, energía y estrés.'); return; }
    onSave({ week, sleep: f.sleep, energy: f.energy, stress: f.stress, notes: f.notes.trim().slice(0, 500) });
    setErr(''); setEditing(false);
  };
  const summary = (c) => CHECKIN_FIELDS.map(x => `${x.label.toLowerCase()} ${c[x.k] || '–'}/5`).join(' · ');
  return (
    <BentoCard>
      <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: 10 }}>
        <div style={{ fontSize: 15, fontWeight: 600 }}>Semana del {fmtDay(week)}</div>
        {cur && !editing && <button className="section-link press" onClick={() => setEditing(true)}>Editar</button>}
      </div>
      {!editing && cur && (
        <>
          <div className="checkin-sum">{summary(cur)}</div>
          {cur.notes && <div className="hist-date" style={{ marginTop: 6 }}>{cur.notes}</div>}
        </>
      )}
      {editing && (
        <>
          <div className="hist-date" style={{ marginBottom: 12 }}>¿Cómo ha ido la semana?</div>
          {CHECKIN_FIELDS.map(x => (
            <div key={x.k} style={{ marginBottom: 12 }}>
              <div className="scale-head"><span>{x.label}</span><span className="faint">1 {x.low.toLowerCase()} · 5 {x.high.toLowerCase()}</span></div>
              <div className="scale-row" role="radiogroup" aria-label={x.label}>
                {[1, 2, 3, 4, 5].map(n => (
                  <button key={n} role="radio" aria-checked={f[x.k] === n} aria-label={`${x.label} ${n} de 5`}
                    className={`scale-btn press ${f[x.k] === n ? 'on' : ''}`} onClick={() => setF({ ...f, [x.k]: n })}>{n}</button>
                ))}
              </div>
            </div>
          ))}
          <div className="field" style={{ marginBottom: 12 }}>
            <label htmlFor="ck-notes">Notas</label>
            <input id="ck-notes" type="text" maxLength={500} placeholder="Opcional: lesiones, viajes, dieta…" value={f.notes} onChange={e => setF({ ...f, notes: e.target.value })} />
          </div>
          {err && <div className="err" role="alert" style={{ marginTop: 0, marginBottom: 12 }}>{err}</div>}
          <button className="btn-primary press" onClick={save}>Guardar check-in</button>
        </>
      )}
      {prev && <div className="hist-date" style={{ marginTop: 12 }}>Semana anterior: {summary(prev)}</div>}
    </BentoCard>
  );
}

function BodyScreen({ store, onUpsertBody, onOpenBody, onUpsertCheckin }) {
  const body = store.body || [];
  const stats = useMemo(() => weightStats(body), [body]);
  const today = body.find(b => b.date === todayISO());
  const [w, setW] = useState(today && today.weight ? String(today.weight).replace('.', ',') : '');
  const [err, setErr] = useState('');
  const saveWeight = () => {
    const n = num(w);
    if (!(n >= 20 && n <= 400)) { setErr('Pon un peso entre 20 y 400 kg.'); return; }
    setErr('');
    onUpsertBody({ date: todayISO(), weight: Math.round(n * 100) / 100 }, true);
  };
  const recent = [...body].reverse().slice(0, 30);
  const lastMeasures = [...body].reverse().find(b => BODY_FIELDS.slice(1).some(x => b[x.k] != null));
  const ch = stats.change;
  return (
    <div className="screen-scroll screen-anim">
      <div className="eyebrow">Seguimiento</div>
      <div className="h-title" style={{ margin: '4px 0 20px' }}>Cuerpo</div>

      <BentoCard>
        <div className="eyebrow" style={{ marginBottom: 10 }}>Peso de hoy</div>
        <div style={{ display: 'flex', gap: 10 }}>
          <div className="field" style={{ flex: 1, marginBottom: 0 }}>
            <label htmlFor="w-today" className="sr-only">Peso de hoy en kg</label>
            <input id="w-today" type="text" inputMode="decimal" placeholder="kg" value={w}
              onChange={e => setW(sanitizeDecimal(e.target.value, 6))} onKeyDown={e => { if (e.key === 'Enter') saveWeight(); }} />
          </div>
          <button className="btn-primary press" style={{ width: 'auto', padding: '0 22px' }} onClick={saveWeight}>{today && today.weight ? 'Actualizar' : 'Guardar'}</button>
        </div>
        {err && <div className="err" role="alert">{err}</div>}
      </BentoCard>

      <div className="bento-grid" style={{ marginTop: 11 }}>
        <StatCard value={fmtNum1(stats.avg7)} unit="kg" label="Media 7 días" color="var(--lime)" />
        <StatCard value={ch == null ? '–' : (ch > 0 ? '+' : '') + fmtNum1(ch)} unit={ch == null ? '' : 'kg'} label="Cambio semanal" />
        <StatCard value={stats.last ? fmtNum1(stats.last.w) : '–'} unit={stats.last ? 'kg' : ''} label="Último peso" />
      </div>

      <div className="section-head"><h2>Tendencia</h2><span className="hist-date" style={{ marginTop: 0 }}>● peso · <span style={{ color: 'var(--lime)' }}>━</span> media 7 d</span></div>
      <BentoCard style={{ padding: '14px 12px 8px' }}><WeightChart stats={stats} /></BentoCard>

      <div className="section-head"><h2>Check-in semanal</h2></div>
      <CheckinCard key={mondayISO()} checkins={store.checkins || []} onSave={onUpsertCheckin} />

      <div className="section-head"><h2>Medidas</h2><button className="section-link press" onClick={() => onOpenBody(todayISO())}>+ Añadir</button></div>
      {lastMeasures ? (
        <BentoCard className="hist-item" onClick={() => onOpenBody(lastMeasures.date)} label="Editar últimas medidas">
          <div className="hist-ico" aria-hidden="true" style={{ background: 'linear-gradient(135deg, rgba(6,182,212,0.22), rgba(34,211,238,0.1))' }}>📏</div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 15, fontWeight: 600 }}>Últimas medidas · {fmtDay(lastMeasures.date)}</div>
            <div className="hist-date">{BODY_FIELDS.slice(1).filter(x => lastMeasures[x.k] != null).map(x => `${x.label.toLowerCase()} ${fmtNum1(lastMeasures[x.k])}${x.unit === '%' ? ' %' : ' cm'}`).join(' · ')}</div>
          </div>
        </BentoCard>
      ) : (
        <BentoCard style={{ textAlign: 'center', color: 'var(--text-dim)', fontSize: 14 }}>Añade grasa, músculo y perímetros cuando te midas 📏</BentoCard>
      )}

      <div className="section-head"><h2>Registros</h2></div>

        <BentoCard key={b.uuid} className="hist-item" onClick={() => onOpenBody(b.date)} label={`Registro del ${fmtDay(b.date)}. Editar`}>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 15, fontWeight: 600 }}>{fmtDay(b.date)}{b.weight ? ` · ${fmtNum1(b.weight)} kg` : ''}</div>

              {[...BODY_FIELDS.slice(1).filter(x => b[x.k] != null).map(x => `${x.label.toLowerCase()} ${fmtNum1(b[x.k])}${x.unit === '%' ? ' %' : ''}`), b.notes].filter(Boolean).join(' · ') || 'Solo peso'}
            </div>

  );
}

/* JSON legible: cada semana del plan en una línea. */
function formatProgramJSON(obj) {
  let t = JSON.stringify(obj, null, 2);
  t = t.replace(/\[\s+([^\[\]{}]+?)\s+\]/g, (m, c) => '[' + c.split(/,\s+/).join(', ') + ']');
  t = t.replace(/\[\s+(\[[^\[\]]*\](?:,\s+\[[^\[\]]*\])*)\s+\]/g, (m, c) => '[' + c.split(/\],\s+\[/).join('], [') + ']');
  return t + '\n';
}
async function shareOrDownload(name, text, mime) {
  try {
    const file = new File([text], name, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return 'shared'; }
  } catch (e) { if (e && e.name === 'AbortError') return 'aborted'; }
  const url = URL.createObjectURL(new Blob([text], { type: mime }));
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  return 'downloaded';
}
const weeksLabel = (ws) => {
  if (!ws.length) return 'sin plan (preparada)';
  const parts = []; let a = ws[0], b = ws[0];
  ws.slice(1).concat([null]).forEach(w => { if (w === b + 1) b = w; else { parts.push(a === b ? `${a}` : `${a}–${b}`); a = b = w; } });
  return `plan semanas ${parts.join(', ')}`;
};
const SOURCE_LABEL = { default: 'routines.json (por defecto)', import: 'importadas', cloud: 'desde la nube' };

function ProgramImportSheet({ data, current, onApply }) {
  const [mode, setMode] = useState('replace');
  if (data.parseError || !data.v || !data.v.ok) {
    const errs = data.parseError ? [data.parseError] : data.v.errors;
    return (
      <>
        <div className="h-title" style={{ fontSize: 22 }}>El JSON no es válido</div>
        <div className="hist-date" style={{ marginBottom: 12 }}>{data.fileName} · corrige esto en el archivo y vuelve a importarlo. No se ha cambiado nada.</div>
        <div className="err-list" role="alert">
          {errs.slice(0, 20).map((e, i) => <div key={i}>• {e}</div>)}
          {errs.length > 20 && <div>… y {errs.length - 20} errores más</div>}
        </div>
      </>
    );
  }
  const next = mergeProgram(current, data.raw, mode, 'import');
  const d = diffProgram(current, next);
  const changes = d.items.filter(x => x.status !== 'igual').length + d.archiving.length;
  return (
    <>
      <div className="h-title" style={{ fontSize: 22 }}>Vista previa</div>
      <div className="hist-date" style={{ marginBottom: 14 }}>{data.fileName}</div>
      <div className="opt-row" role="radiogroup" aria-label="Cómo aplicar" style={{ marginBottom: 8 }}>
        <button role="radio" aria-checked={mode === 'replace'} className={`opt sm press ${mode === 'replace' ? 'on' : ''}`} onClick={() => setMode('replace')}>
          <span className="oico" aria-hidden="true">🔁</span>Reemplazar bloque</button>
        <button role="radio" aria-checked={mode === 'add'} className={`opt sm press ${mode === 'add' ? 'on' : ''}`} onClick={() => setMode('add')}>
          <span className="oico" aria-hidden="true">➕</span>Añadir rutinas</button>
      </div>
      <div className="hist-date" style={{ marginBottom: 14 }}>
        {mode === 'replace' ? 'El bloque pasa a ser el del archivo. Lo que ya no esté se archiva (no se borra: el historial no cambia).'
          : 'Se añaden las rutinas nuevas y se actualizan las que tengan el mismo id. No se archiva nada y el bloque sigue igual.'}
      </div>
      <BentoCard style={{ marginBottom: 10 }}>
        <div style={{ fontSize: 15, fontWeight: 600 }}>{d.block.nombre} · {d.block.semanas} semanas</div>
        {d.items.map(x => (
          <div key={x.kind + x.id} className="prev-row">
            <span aria-hidden="true">{x.icon}</span>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontWeight: 600 }}>{x.name}{x.kind === 'complemento' ? <span className="faint"> · complemento</span> : null}</div>
              <div className="hist-date">{x.exercises} {x.exercises === 1 ? 'ejercicio' : 'ejercicios'} · {weeksLabel(x.planWeeks)}</div>
            </div>
            <span className={`tag-st ${x.status}`}>{x.status}</span>
          </div>
        ))}
      </BentoCard>
      {d.archiving.length > 0 && <div className="warn-box">🗄️ Se archivarán: {d.archiving.join(', ')}. No se borran y tu historial no cambia.</div>}
      {data.v.warnings.length > 0 && <div className="warn-box">{data.v.warnings.slice(0, 5).map((w, i) => <div key={i}>⚠️ {w}</div>)}</div>}
      <button className="btn-primary press" style={{ marginTop: 12 }} disabled={!changes} onClick={() => onApply(mode)}>
        {changes ? 'Aplicar' : 'No hay cambios'}
      </button>
    </>
  );
}

/* ============================================================

   ============================================================ */
function useSyncState() {
  const [st, setSt] = useState(Sync.state);
  useEffect(() => Sync.subscribe(setSt), []);
  return st;
}
/* Texto e icono del estado de sincronización (largo para Ajustes, corto para el chip de Inicio). */
function syncView(st) {
  const n = st.pending;
  const pend = `${n} ${n === 1 ? 'cambio pendiente' : 'cambios pendientes'}`;
  if (!st.signedIn) return { cls: 'sync-off', short: 'Sin sesión', long: st.error || 'Sin sesión: tus datos solo están en este dispositivo' };
  if (!st.online || st.errorKind === 'offline') return { cls: 'sync-off', short: 'Sin conexión', long: n ? `Sin conexión · ${pend} (${n === 1 ? 'se subirá solo' : 'se subirán solos'})` : 'Sin conexión' };
  if (st.syncing) return { cls: 'sync-busy', short: 'Sincronizando…', long: 'Sincronizando…' };
  if (st.errorKind) return { cls: 'sync-err', short: st.errorKind === 'paused' ? 'Nube en pausa' : 'Error nube', long: st.error, retry: true };
  if (n) return { cls: 'sync-warn', short: `${n} pendiente${n === 1 ? '' : 's'}`, long: pend };
  return { cls: 'sync-ok', short: st.lastSyncAt ? `Al día · ${fmtTime(st.lastSyncAt)}` : 'Al día', long: st.lastSyncAt ? `Al día · ${fmtTime(st.lastSyncAt)}` : 'Al día' };
}
function SyncChip({ onClick }) {
  const v = syncView(useSyncState());
  return (
    <button className={`sync-chip press ${v.cls}`} onClick={onClick} aria-label={`Nube: ${v.long}. Abrir ajustes de sincronización`}>
      <span className="sync-dot" aria-hidden="true" /><span>{v.short}</span>
    </button>
  );
}
function AccountSection({ onSignIn, onSignOut }) {
  const st = useSyncState();
  const v = syncView(st);
  const [email, setEmail] = useState('');
  const [pw, setPw] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const submit = async (e) => {
    e.preventDefault();
    if (!email.trim() || !pw) { setErr('Escribe tu correo y tu contraseña.'); return; }
    setBusy(true); setErr('');
    try { await onSignIn(email, pw); setPw(''); }
    catch (x) { setErr(x.message || 'No se pudo iniciar sesión'); }
    finally { setBusy(false); }
  };
  if (!st.signedIn) {

function sessionToEntry(sess, ses, sets, cards) {

        ...(st.rir_actual != null ? { rir: numToText(st.rir_actual) || '0' } : {}), ...(st.is_warmup ? { warmup: true } : {}) };
    });

      skipReason: x.skip_reason || null, substitutedFor: x.substituted_for || null, target: x.target || null, sets: xs, ...(x.notes ? { notes: x.notes } : {}) };

      exercises, volume: Math.round(volume), totalSets,

function cardioToEntry(c) {

}
/* Agrupa filas en entradas del historial: { uuid → { entry, upd, deleted } } */
function assembleEntries(rows, sessionIds, cardioIds) {
  const out = new Map();
  const seBySess = new Map(), setsBySe = new Map(), cardBySess = new Map();
  rows.session_exercises.forEach(x => { (seBySess.get(x.session_id) || seBySess.set(x.session_id, []).get(x.session_id)).push(x); });
  rows.sets.forEach(x => { (setsBySe.get(x.session_exercise_id) || setsBySe.set(x.session_exercise_id, []).get(x.session_exercise_id)).push(x); });
  rows.cardio.forEach(x => { if (x.session_id) (cardBySess.get(x.session_id) || cardBySess.set(x.session_id, []).get(x.session_id)).push(x); });
  rows.sessions.forEach(sess => {
    if (sessionIds && !sessionIds.has(sess.id)) return;
    const ses = seBySess.get(sess.id) || [];
    const sets = ses.flatMap(x => setsBySe.get(x.id) || []);
    const r = sessionToEntry(sess, ses, sets, cardBySess.get(sess.id) || []);
    out.set(sess.id, { ...r, deleted: !!sess.deleted_at, upd: Math.max(r.upd, msOf(sess.deleted_at)) });

    const r = cardioToEntry(c);
    out.set(c.id, { ...r, deleted: !!c.deleted_at });
