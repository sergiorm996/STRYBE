  if ('serviceWorker' in navigator) {

    });

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script>
  /* Carga React/Babel con fallback a jsDelivr si unpkg falla, y avisa si no hay red. */
  (function () {
    var SRC = {
      react: ['https://unpkg.com/react@18/umd/react.production.min.js', 'https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js'],
      reactDom: ['https://unpkg.com/react-dom@18/umd/react-dom.production.min.js', 'https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js'],
      babel: ['https://unpkg.com/@babel/standalone/babel.min.js', 'https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js']
    };
    function loadSeq(urls, done) {
      var i = 0;
      (function attempt() {
        if (i >= urls.length) { done(false); return; }
        var s = document.createElement('script');
        s.src = urls[i++];
        s.onload = function () { done(true); };
        s.onerror = function () { attempt(); };
        document.head.appendChild(s);
      })();
    }
    window.__bootError = function (msg) {
      var r = document.getElementById('root');
      if (r) r.innerHTML = '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;font-family:sans-serif;color:#F4F7F5;gap:14px">'
        + '<div style="font-size:46px">📡</div>'
        + '<div style="font-size:18px;font-weight:700">No se pudo cargar la app</div>'
        + '<div style="font-size:14px;color:rgba(244,247,245,.6);max-width:280px;line-height:1.5">' + msg + '</div>'
        + '<button onclick="location.reload()" style="margin-top:8px;padding:13px 22px;border:none;border-radius:14px;background:#C8F542;color:#06210a;font-weight:700;font-size:15px">Reintentar</button></div>';
    };
    loadSeq(SRC.react, function (ok1) {
      loadSeq(SRC.reactDom, function (ok2) {
        loadSeq(SRC.babel, function (ok3) {
          if (!(ok1 && ok2 && ok3)) { window.__bootError('Necesita conexión a internet la primera vez (carga React desde un CDN). Conéctate y pulsa Reintentar.'); return; }
          window.__libsReady = true;
          /* Babel sólo auto-transforma los <script type="text/babel"> en DOMContentLoaded.
             Como lo cargamos async (después de ese evento), hay que transformarlos a mano. */
          try {
            if (window.Babel && Babel.transformScriptTags) Babel.transformScriptTags();
          } catch (e) {
            window.__bootError('Error al compilar la app: ' + (e && e.message ? e.message : e));
          }
        });
      });
    });
  })();
</script>
<style>
  :root {
    --bg: #0D0F12;
    --card-1: rgba(26, 29, 34, 0.5);
    --card-2: rgba(26, 29, 34, 0.78);
    --stroke: rgba(255, 255, 255, 0.08);
    --stroke-strong: rgba(255, 255, 255, 0.14);
    --text: #F4F7F5;
    --text-dim: rgba(244, 247, 245, 0.55);
    --text-faint: rgba(244, 247, 245, 0.32);
    --radius: 28px;
    --radius-sm: 20px;
    --shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    --lime: #C6FF00;
    --lime-deep: #7CFF00;
    --lime-glow: rgba(198, 255, 0, 0.45);
    --blue-a: #3B82F6; --blue-b: #60A5FA;
    --violet-a: #8B5CF6; --violet-b: #D946EF;
    --coral-a: #F43F5E; --coral-b: #FB923C;
    --amber-a: #F59E0B; --amber-b: #FACC15;
    --cyan-a: #06B6D4; --cyan-b: #22D3EE;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
  }
  #root { height: 100vh; }
  button { font-family: inherit; color: inherit; border: none; background: none; cursor: pointer; }
  input { font-family: inherit; }
  ::-webkit-scrollbar { width: 0; height: 0; }

  .cond { font-family: 'Montserrat', sans-serif; }

  /* ---------- App shell / phone frame ---------- */
  .app-shell {
    position: relative; width: 100%; max-width: 440px; height: 100vh;
    margin: 0 auto; overflow: hidden; background: var(--bg); isolation: isolate;
  }
  @media (min-width: 480px) {
    body { display: flex; align-items: center; justify-content: center; background: #000; }
    .app-shell {
      width: 440px; flex: 0 0 440px;
      height: 900px; max-height: 96vh; border-radius: 46px;
      border: 1px solid rgba(255,255,255,0.07);
      box-shadow: 0 40px 120px rgba(0,0,0,0.7), inset 0 0 0 8px #060809;
    }
  }

  /* ---------- Auroras ---------- */
  .aurora-field { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .aurora { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.4; will-change: transform; }
  .aurora.a1 { width: 360px; height: 360px; top: -120px; left: -90px;
    background: radial-gradient(circle, rgba(198,255,0,0.5), transparent 70%); animation: drift1 18s ease-in-out infinite; }
  .aurora.a2 { width: 320px; height: 320px; top: 35%; right: -120px;
    background: radial-gradient(circle, rgba(139,92,246,0.45), transparent 70%); animation: drift2 22s ease-in-out infinite; }
  .aurora.a3 { width: 300px; height: 300px; bottom: -100px; left: 10%;
    background: radial-gradient(circle, rgba(59,130,246,0.38), transparent 70%); animation: drift3 26s ease-in-out infinite; }
  @keyframes drift1 { 0%,100%{transform:translate3d(0,0,0)} 50%{transform:translate3d(60px,40px,0)} }
  @keyframes drift2 { 0%,100%{transform:translate3d(0,0,0)} 50%{transform:translate3d(-50px,60px,0)} }
  @keyframes drift3 { 0%,100%{transform:translate3d(0,0,0)} 50%{transform:translate3d(40px,-50px,0)} }

  /* ---------- Scroll area ---------- */
  .screen-scroll {
    position: absolute; inset: 0; z-index: 1; overflow-y: auto; overflow-x: hidden;
    padding: calc(env(safe-area-inset-top) + 18px) 18px 130px; -webkit-overflow-scrolling: touch;
  }
  .screen-scroll.no-nav { padding-bottom: 40px; }
  .screen-anim { animation: screenIn 0.42s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes screenIn { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: translateX(0); } }
  .pop-anim { animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes popIn { from { opacity: 0; transform: translateY(30px) scale(0.97); } to { opacity: 1; transform: none; } }

  /* ---------- Glass ---------- */
  .glass { background: var(--card-1); backdrop-filter: blur(24px) saturate(200%); -webkit-backdrop-filter: blur(24px) saturate(200%);
    border-radius: var(--radius); border: 1px solid var(--stroke); box-shadow: var(--shadow); }
  .glass-2 { background: var(--card-2); }
  .bento { padding: 18px; }
  .press { transition: transform 0.12s ease; }
  .press:active { transform: scale(0.96); }

  /* ---------- Typography ---------- */
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-dim); }
  .h-title { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
  .num-xl { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
  .dim { color: var(--text-dim); }
  .faint { color: var(--text-faint); }

  /* ---------- Brand bar ---------- */
  .brand-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .brand-word { font-family: 'Montserrat', sans-serif; font-weight: 800; font-style: italic;
    font-size: 23px; letter-spacing: 0.06em; color: var(--lime); text-shadow: 0 0 18px var(--lime-glow); }

  /* ---------- Header ---------- */
  .home-head { display: flex; align-items: center; gap: 13px; margin-bottom: 20px; }
  .avatar-ring { width: 54px; height: 54px; border-radius: 17px; flex-shrink: 0; display: grid; place-items: center; font-size: 26px;
    background: #090c0f; border: 2px solid var(--lime); box-shadow: 0 0 18px var(--lime-glow); overflow: hidden; }
  .avatar-ring img { width: 100%; height: 100%; object-fit: cover; border-radius: 15px; }
  .streak-chip { margin-left: auto; display: flex; align-items: center; gap: 5px;
    background: linear-gradient(135deg, rgba(251,146,60,0.18), rgba(244,63,94,0.16));
    border: 1px solid rgba(251,146,60,0.35); color: #FFB27A; font-weight: 600; font-size: 13px; padding: 7px 12px; border-radius: 14px; }

  /* ---------- Section ---------- */
  .section-head { display: flex; align-items: center; justify-content: space-between; margin: 26px 4px 13px; }
  .section-head h2 { font-size: 19px; font-weight: 600; letter-spacing: -0.02em; }
  .section-link { font-size: 13px; color: var(--lime); font-weight: 600; }

  /* ---------- Stat grid ---------- */
  .bento-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 11px; }
  .stat-card { padding: 16px 12px; text-align: center; }
  .stat-val { font-size: 30px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-family: 'Montserrat', sans-serif; }
  .stat-val small { font-size: 13px; font-weight: 600; color: var(--text-dim); margin-left: 2px; }
  .stat-label { font-size: 11px; color: var(--text-dim); font-weight: 500; margin-top: 6px; }

  /* ---------- Action buttons ---------- */
  .action-grid { display: flex; flex-direction: column; gap: 12px; }
  .action-btn { display: flex; align-items: center; gap: 15px; padding: 18px; border-radius: 22px; text-align: left; width: 100%; }
  .action-ico { width: 50px; height: 50px; border-radius: 16px; display: grid; place-items: center; font-size: 25px; flex-shrink: 0; }
  .action-btn .t { font-size: 17px; font-weight: 600; }
  .action-btn .s { font-size: 12.5px; color: var(--text-dim); margin-top: 1px; }
  .action-arrow { margin-left: auto; color: var(--text-faint); font-size: 24px; }
  .action-btn.primary { background: linear-gradient(135deg, var(--lime), var(--lime-deep)); border: none; box-shadow: 0 12px 34px var(--lime-glow); }
  .action-btn.primary .t, .action-btn.primary .s, .action-btn.primary .action-arrow { color: #06210a; }
  .action-btn.primary .s { opacity: 0.7; }
  .action-btn.primary .action-ico { background: rgba(6,33,10,0.18); }

  /* ---------- Week control ---------- */
  .week-ctrl { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .week-btn { width: 46px; height: 46px; border-radius: 15px; background: var(--card-2); border: 1px solid var(--stroke);
    display: grid; place-items: center; font-size: 24px; font-weight: 600; color: var(--lime); flex-shrink: 0; }
  .week-btn:disabled { opacity: 0.3; color: var(--text-dim); }
  .week-num { font-size: 38px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-family: 'Montserrat', sans-serif; }

  /* ---------- Routine cards ---------- */
  .routine-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
  .routine-card { padding: 18px; position: relative; overflow: hidden; min-height: 132px; display: flex; flex-direction: column; }
  .routine-ico { width: 48px; height: 48px; border-radius: 15px; display: grid; place-items: center; font-size: 25px; margin-bottom: 12px; }
  .routine-name { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
  .routine-sub { font-size: 12px; color: var(--text-dim); margin-top: 3px; }
  .routine-day { position: absolute; top: 14px; right: 16px; font-size: 11px; font-weight: 600; color: var(--text-faint); letter-spacing: 0.08em; }

  /* ---------- Options ---------- */
  .opt-row { display: flex; gap: 11px; }
  .opt { flex: 1; padding: 18px 12px; border-radius: 18px; text-align: center; background: var(--card-1); border: 1px solid var(--stroke);
    font-weight: 600; font-size: 14px; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .opt .oico { font-size: 24px; }
  .opt.on { background: var(--lime); color: #06210a; border-color: transparent; box-shadow: 0 8px 22px var(--lime-glow); }

  /* ---------- Flow header ---------- */
  .flow-head { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .flow-back { width: 42px; height: 42px; border-radius: 13px; background: var(--card-1); border: 1px solid var(--stroke); display: grid; place-items: center; font-size: 18px; flex-shrink: 0; }

  /* ---------- Workout ---------- */
  .wk-progress-track { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: rgba(255,255,255,0.06); z-index: 6; }
  .wk-progress-fill { height: 100%; background: linear-gradient(90deg, var(--lime-deep), var(--lime)); box-shadow: 0 0 10px var(--lime-glow); transition: width 0.5s cubic-bezier(0.22,1,0.36,1); }
  .ex-counter { font-size: 12px; font-weight: 600; color: var(--lime); letter-spacing: 0.06em; }
  .note-chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 12px;
    background: rgba(200,245,66,0.1); color: var(--lime); font-size: 12.5px; font-weight: 600; }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 11px; background: var(--card-2); border: 1px solid var(--stroke); font-size: 12.5px; font-weight: 600; }
  .ref-box { padding: 13px 16px; border-radius: 16px; background: rgba(59,130,246,0.08); border: 1px solid rgba(59,130,246,0.2); }
  .set-row { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
  .set-idx { width: 32px; height: 46px; border-radius: 11px; background: var(--card-2); display: grid; place-items: center;
    font-size: 14px; font-weight: 700; color: var(--text-dim); flex-shrink: 0; font-family: 'Montserrat', sans-serif; }
  .set-inp { width: 100%; background: var(--card-2); border: 1px solid var(--stroke); border-radius: 12px; padding: 13px 8px;
    color: var(--text); font-size: 17px; font-weight: 700; text-align: center; min-width: 0; }
  .set-inp::placeholder { color: var(--text-faint); font-weight: 500; }
  .set-inp:focus { outline: none; border-color: var(--lime); background: rgba(200,245,66,0.06); }
  .set-field { flex: 1; min-width: 0; position: relative; }
  .set-unit { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--text-faint); font-weight: 600; pointer-events: none; }
  .set-x { color: var(--text-faint); font-weight: 700; flex-shrink: 0; }
  .set-check { width: 46px; height: 46px; border-radius: 13px; border: 1.5px solid var(--stroke-strong); display: grid; place-items: center;
    font-size: 17px; flex-shrink: 0; color: var(--text-dim); transition: all 0.2s; }
  .set-check.on { background: var(--lime); border-color: var(--lime); color: #06210a; box-shadow: 0 0 16px var(--lime-glow); }
  .set-row.done .set-inp { border-color: rgba(200,245,66,0.28); }
  .nav-arrows { display: flex; gap: 12px; margin-top: 18px; }
  .nav-arrow { flex: 1; padding: 16px; border-radius: 16px; background: var(--card-1); border: 1px solid var(--stroke);
    font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .nav-arrow:disabled { opacity: 0.3; }

  /* ---------- Buttons ---------- */
  .btn-primary { width: 100%; padding: 17px; border-radius: 18px; background: linear-gradient(135deg, var(--lime), var(--lime-deep));
    color: #06210a; font-weight: 700; font-size: 16px; letter-spacing: -0.01em; box-shadow: 0 10px 30px var(--lime-glow);
    display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-ghost { width: 100%; padding: 16px; border-radius: 18px; background: var(--card-1); border: 1px solid var(--stroke);
    color: var(--text); font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }

  /* ---------- Inputs (cardio/finish) ---------- */
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: var(--text-dim); margin-bottom: 8px; }
  .field input { width: 100%; background: var(--card-2); border: 1px solid var(--stroke); border-radius: 14px; padding: 15px;
    color: var(--text); font-size: 16px; font-weight: 600; }
  .field input:focus { outline: none; border-color: var(--lime); }

  /* ---------- History ---------- */
  .hist-item { display: flex; align-items: center; gap: 14px; padding: 16px; margin-bottom: 11px; }
  .hist-ico { width: 48px; height: 48px; border-radius: 15px; display: grid; place-items: center; font-size: 22px; flex-shrink: 0; }
  .hist-date { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .empty { text-align: center; padding: 40px 20px; color: var(--text-dim); }

  /* ---------- Finish summary ---------- */
  .fin-ex { display: flex; align-items: center; gap: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .fin-ex-n { width: 30px; height: 30px; border-radius: 9px; background: var(--card-2); display: grid; place-items: center; font-size: 13px; font-weight: 700; flex-shrink: 0; color: var(--lime); font-family: 'Montserrat', sans-serif; }

  /* ---------- Toast ---------- */
  .toast { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); z-index: 50;
    background: rgba(20,25,35,0.92); backdrop-filter: blur(20px); border: 1px solid var(--stroke-strong);
    padding: 13px 20px; border-radius: 16px; font-size: 14px; font-weight: 600; box-shadow: 0 16px 40px rgba(0,0,0,0.6);
    animation: toastIn 0.4s cubic-bezier(0.34,1.56,0.64,1); display: flex; align-items: center; gap: 9px; }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }

  /* ---------- Bottom navigation ---------- */
  .bottom-nav { position: absolute; bottom: 16px; left: 16px; right: 16px; z-index: 20; height: 68px;
    display: flex; align-items: center; justify-content: space-around; padding: 0 6px; border-radius: 26px;
    background: rgba(12, 16, 22, 0.6); backdrop-filter: blur(28px) saturate(200%); -webkit-backdrop-filter: blur(28px) saturate(200%);
    border: 1px solid var(--stroke-strong); box-shadow: 0 16px 44px rgba(0,0,0,0.55); }
  .nav-glow { position: absolute; top: 8px; height: 52px; width: 64px; border-radius: 18px; z-index: 0;
    background: linear-gradient(135deg, rgba(200,245,66,0.22), rgba(155,230,0,0.08)); border: 1px solid rgba(200,245,66,0.3);
    box-shadow: 0 0 22px var(--lime-glow); transition: left 0.42s cubic-bezier(0.34, 1.3, 0.5, 1); }
  .nav-item { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; }
  .nav-item svg { width: 23px; height: 23px; transition: all 0.25s; }
  .nav-item span { font-size: 10px; font-weight: 500; transition: color 0.25s; }
  .nav-item.on span { color: var(--lime); font-weight: 600; }
  .nav-item.on svg { stroke: var(--lime); filter: drop-shadow(0 0 6px var(--lime-glow)); }
  .nav-item:not(.on) svg { stroke: var(--text-dim); }
  .nav-item:not(.on) span { color: var(--text-faint); }

  .pbar-track { height: 8px; border-radius: 99px; background: rgba(255,255,255,0.07); overflow: hidden; }
  .pbar-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--lime-deep), var(--lime)); box-shadow: 0 0 12px var(--lime-glow); transition: width 0.8s cubic-bezier(0.22,1,0.36,1); }

  /* ---------- Boot loader ---------- */
  .boot { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: var(--bg); }
  .boot-logo { width: 72px; height: 72px; border-radius: 22px; display: grid; place-items: center; font-size: 34px;
    background: radial-gradient(circle at 30% 25%, #1a2128, #090c0f); border: 2px solid var(--lime); box-shadow: 0 0 28px var(--lime-glow); }
  .boot-text { font-family: 'Montserrat', sans-serif; font-style: italic; font-size: 26px; font-weight: 800; letter-spacing: 0.08em; color: var(--lime); }
  .boot-tag { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-dim); margin-top: -6px; }
  .boot-spin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.12); border-top-color: var(--lime); animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    *, .aurora { animation: none !important; transition: none !important; }
    .boot-spin { animation: spin 0.8s linear infinite !important; }
  }
</style>
</head>
<body>
<div id="root">
  <div class="boot">
    <div class="boot-logo"><img src="./icon.png" alt="STRYBE" style="width:100%;height:100%;object-fit:cover;border-radius:20px;" /></div>
    <div class="boot-text">STRYBE</div>
    <div class="boot-tag">Entrena · Progresa · Supérate</div>
    <div class="boot-spin"></div>
  </div>
</div>
<script>
  /* Si la app no renderiza en 12s (CDN bloqueado/sin red), muestra error en vez de pantalla en blanco. */

/* ============================================================
   HELPERS
   ============================================================ */
const MONTHS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DAYS = ['dom','lun','mar','mié','jue','vie','sáb'];
function fmtDate(ts) {
  const d = new Date(ts);
  return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
}
function dayKey(ts) { const d = new Date(ts); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }

function computeStats(log) {
  const sessions = log.filter(s => s.type === 'fuerza' || s.type === 'cardio');
  const now = Date.now();
  const weekAgo = now - 7 * 86400000;
  const weekCount = sessions.filter(s => s.date >= weekAgo).length;
  // streak: días consecutivos (hacia atrás desde hoy/ayer) con alguna sesión
  const keys = new Set(log.map(s => dayKey(s.date)));
  let streak = 0;
  const d = new Date();
  // permitir que la racha empiece hoy o ayer
  if (!keys.has(dayKey(d.getTime()))) d.setDate(d.getDate() - 1);
  while (keys.has(dayKey(d.getTime()))) { streak++; d.setDate(d.getDate() - 1); }
  return { total: sessions.length, week: weekCount, streak };
}

function lastForExercise(log, exName) {
  for (let i = log.length - 1; i >= 0; i--) {
    const ex = (log[i].exercises || []).find(e => e.name === exName);
    if (ex && ex.sets) return ex.sets.filter(s => s.done && (s.kg || s.reps));
  }
  return null;
}

          <span className="oico">🚫</span>No</button>
      </div>

      <div style={{ marginTop: 30 }}>
        <button className="btn-primary press" onClick={() => onStart(comp, cardio)}>Empezar entreno ▶</button>
      </div>
    </div>
  );
}

/* ============================================================
   WORKOUT ACTIVO
   ============================================================ */
function WorkoutScreen({ routine, complement, cardio, week, log, onFinish, onBack }) {
  // construir lista de ejercicios (rutina + complemento)
  const buildExercises = () => {
    const base = routine.exercises.map(e => ({ ...e, group: routine.name }));
    let list = base;
    if (complement) list = list.concat(COMPLEMENTS[complement].exercises.map(e => ({ ...e, group: COMPLEMENTS[complement].name })));
    return list.map(e => {
      const last = lastForExercise(log, e.name);
      const sets = Array.from({ length: e.series }, (_, i) => ({
        kg: last && last[i] ? last[i].kg : '',
        reps: last && last[i] ? last[i].reps : '',
        done: false,
      }));
      return { ...e, sets, last };
    });
  };
  const [exList, setExList] = useState(buildExercises);
  const [idx, setIdx] = useState(0);
  const scrollRef = useRef(null);
  const ex = exList[idx];
  const total = exList.length;

  const planStr = ex.plan && ex.plan.length ? ex.plan[Math.min(week - 1, ex.plan.length - 1)] : null;

  const update = (si, field, val) => {
    setExList(prev => prev.map((e, i) => i !== idx ? e : {
      ...e, sets: e.sets.map((s, j) => j !== si ? s : { ...s, [field]: val })
    }));
  };
  const toggleDone = (si) => {
    if (navigator.vibrate) navigator.vibrate(18);
    setExList(prev => prev.map((e, i) => i !== idx ? e : {
      ...e, sets: e.sets.map((s, j) => j !== si ? s : { ...s, done: !s.done })
    }));
  };
  const go = (dir) => {
    const n = idx + dir;
    if (n < 0 || n >= total) return;
    if (navigator.vibrate) navigator.vibrate(8);
    setIdx(n);
    if (scrollRef.current) scrollRef.current.scrollTop = 0;
  };

  const doneSets = exList.reduce((a, e) => a + e.sets.filter(s => s.done).length, 0);
  const totalSets = exList.reduce((a, e) => a + e.sets.length, 0);

  const finish = () => {
    let volume = 0, completed = 0;
    const exercises = exList.map(e => {
      const sets = e.sets.map(s => {
        const kg = parseFloat(String(s.kg).replace(',', '.')) || 0;
        const reps = parseInt(s.reps) || 0;
        if (s.done) { volume += kg * reps; completed++; }
        return { kg: s.kg, reps: s.reps, done: s.done };
      });
      return { name: e.name, group: e.group, sets };
    });
    onFinish({
      type: 'fuerza', routine: routine.name, icon: routine.icon, complement, cardio, week,
      exercises, volume: Math.round(volume), totalSets: completed,
    });
  };

  return (
    <div className="active-overlay pop-anim" style={{ position: 'absolute', inset: 0, zIndex: 30, background: 'var(--bg)' }}>
      <div className="aurora-field"><div className="aurora a1" /><div className="aurora a2" /></div>
      <div className="wk-progress-track"><div className="wk-progress-fill" style={{ width: (doneSets / totalSets * 100) + '%' }} /></div>
      <div className="screen-scroll no-nav" ref={scrollRef} style={{ paddingTop: 'calc(env(safe-area-inset-top) + 20px)' }}>
        <div className="flow-head" style={{ marginBottom: 16 }}>
          <button className="flow-back press" onClick={onBack}>✕</button>
          <div style={{ flex: 1 }}>
            <div className="ex-counter">EJERCICIO {idx + 1} / {total}</div>
            <div style={{ fontSize: 14, fontWeight: 600, color: 'var(--text-dim)' }}>{routine.name}{complement ? ` + ${COMPLEMENTS[complement].name}` : ''}</div>
          </div>
        </div>

        {ex.group !== routine.name && <div className="pill" style={{ marginBottom: 12, color: 'var(--coral-b)', borderColor: 'rgba(251,146,60,0.3)' }}>★ Complemento · {ex.group}</div>}

        <div className="h-title" style={{ marginBottom: 14 }}>{ex.name}</div>

        <div style={{ display: 'flex', gap: 9, flexWrap: 'wrap', marginBottom: 16 }}>
          <span className="pill">🎯 {ex.reps} reps</span>
          <span className="pill">💪 {ex.series} series</span>
          <span className="pill">🔋 RIR {ex.rir}</span>
        </div>

        {ex.note && <div className="note-chip" style={{ marginBottom: 16 }}>⚡ {ex.note}</div>}

        {(ex.last || planStr) && (
          <div className="ref-box" style={{ marginBottom: 20 }}>
            <div className="eyebrow" style={{ color: 'var(--blue-b)', marginBottom: 6 }}>
              {ex.last ? '↺ Sesión anterior' : `📋 Plan semana ${week}`}
            </div>
            <div style={{ fontSize: 14, fontWeight: 600 }}>
              {ex.last
                ? ex.last.map(s => `${s.kg || '–'}×${s.reps || '–'}`).join('  ·  ')
                : planStr}
            </div>
          </div>
        )}

        <BentoCard style={{ marginBottom: 18 }}>
          <div className="eyebrow" style={{ marginBottom: 14 }}>Registra tus series</div>
          {ex.sets.map((s, si) => (
            <div className={`set-row ${s.done ? 'done' : ''}`} key={si}>
              <div className="set-idx">{si + 1}</div>
              <div className="set-field">
                <input className="set-inp" type="text" inputMode="decimal" placeholder="kg"
                  value={s.kg} onChange={e => update(si, 'kg', e.target.value)} />
              </div>
              <span className="set-x">×</span>
              <div className="set-field">
                <input className="set-inp" type="text" inputMode="numeric" placeholder="reps"
                  value={s.reps} onChange={e => update(si, 'reps', e.target.value)} />
              </div>
              <button className={`set-check press ${s.done ? 'on' : ''}`} onClick={() => toggleDone(si)}>✓</button>
            </div>
          ))}
        </BentoCard>

        <div className="nav-arrows">
          <button className="nav-arrow press" disabled={idx === 0} onClick={() => go(-1)}>← Anterior</button>
          {idx < total - 1
            ? <button className="nav-arrow press" onClick={() => go(1)} style={{ background: 'var(--card-2)' }}>Siguiente →</button>
            : <button className="nav-arrow press" onClick={finish} style={{ background: 'linear-gradient(135deg, var(--lime), var(--lime-deep))', color: '#06210a', border: 'none', boxShadow: '0 8px 24px var(--lime-glow)' }}>Finalizar ✓</button>}
        </div>

        {cardio && (
          <BentoCard className="hist-item" style={{ marginTop: 18 }}>
            <div className="hist-ico" style={{ background: 'linear-gradient(135deg, rgba(244,63,94,0.22), rgba(251,146,60,0.12))' }}>🏃</div>
            <div><div style={{ fontSize: 14, fontWeight: 600 }}>Cardio pendiente</div><div className="hist-date">40' al terminar el entreno</div></div>
          </BentoCard>
        )}
      </div>
    </div>
  );
}

/* ============================================================
   FINISH
   ============================================================ */
function FinishScreen({ session, onSave }) {
  return (
    <div className="screen-scroll no-nav pop-anim">
      <div style={{ textAlign: 'center', margin: '20px 0 26px' }}>
        <div style={{ fontSize: 64, marginBottom: 8 }}>🎉</div>
        <div className="h-title">¡Sesión completada!</div>
        <div className="dim" style={{ fontSize: 15, marginTop: 6 }}>{session.routine}{session.complement ? ` + ${COMPLEMENTS[session.complement].name}` : ''}</div>
      </div>

      <div className="bento-grid" style={{ marginBottom: 22 }}>
        <StatCard value={session.totalSets} unit="" label="Series" color="var(--lime)" />
        <StatCard value={session.volume.toLocaleString('es')} unit="kg" label="Volumen" />
        <StatCard value={`S${session.week}`} unit="" label="Bloque" color="var(--amber-b)" />
      </div>

      <div className="section-head"><h2>Detalle</h2></div>
      {session.exercises.map((e, i) => {
        const done = e.sets.filter(s => s.done);
        return (
          <BentoCard className="fin-ex" key={i}>
            <div className="fin-ex-n">{i + 1}</div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 14.5, fontWeight: 600 }}>{e.name}</div>
              <div className="dim" style={{ fontSize: 12.5, marginTop: 2 }}>
                {done.length ? done.map(s => `${s.kg || '–'}×${s.reps || '–'}`).join('  ·  ') : 'Sin series completadas'}
              </div>
            </div>
          </BentoCard>
        );
      })}

      <div style={{ marginTop: 24 }}>
        <button className="btn-primary press" onClick={onSave}>Guardar y salir</button>
      </div>
    </div>
  );
}

/* ============================================================
   CARDIO LIBRE
   ============================================================ */
function CardioScreen({ onSave, onBack }) {
  const [type, setType] = useState('Cinta');
  const [duration, setDuration] = useState('');
  const [distance, setDistance] = useState('');
  return (
    <div className="screen-scroll no-nav screen-anim">
      <div className="flow-head">
        <button className="flow-back press" onClick={onBack}>←</button>
        <div><div className="eyebrow">Registro</div><div className="h-title" style={{ marginTop: 2 }}>Cardio libre</div></div>
      </div>

      <div className="section-head" style={{ marginTop: 4 }}><h2>Tipo</h2></div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 11 }}>
        {CARDIO_TYPES.map(c => (
          <button key={c.name} className={`opt press ${type === c.name ? 'on' : ''}`} onClick={() => setType(c.name)}>
            <span className="oico">{c.icon}</span>{c.name}</button>
        ))}
      </div>

      <div className="section-head"><h2>Datos</h2></div>
      <BentoCard>
        <div className="field">
          <label>Duración (minutos)</label>
          <input type="text" inputMode="numeric" placeholder="40" value={duration} onChange={e => setDuration(e.target.value)} />
        </div>
        <div className="field" style={{ marginBottom: 0 }}>
          <label>Distancia (km) · opcional</label>
          <input type="text" inputMode="decimal" placeholder="5.0" value={distance} onChange={e => setDistance(e.target.value)} />
        </div>
      </BentoCard>

      <div style={{ marginTop: 24 }}>
        <button className="btn-primary press" disabled={!duration}
          style={!duration ? { opacity: 0.4 } : {}}
          onClick={() => duration && onSave({ type: 'cardio', cardioType: type, duration: parseInt(duration) || 0, distance: distance ? parseFloat(String(distance).replace(',', '.')) : null })}>
          Guardar cardio
        </button>
      </div>
    </div>
  );
}

/* ============================================================
   HISTORIAL
   ============================================================ */
function HistoryScreen({ store }) {
  const list = [...store.log].reverse();
  return (
    <div className="screen-scroll screen-anim">
      <div className="eyebrow">Registro</div>
      <div className="h-title" style={{ margin: '4px 0 20px' }}>Historial</div>
      {list.length === 0 && <div className="empty">Todavía no has registrado ninguna sesión.</div>}
      {list.map(s => <HistoryItem key={s.id} s={s} />)}
    </div>

}

/* ============================================================
   AJUSTES
   ============================================================ */
function SettingsScreen({ store, setWeek, onExport, onClear }) {
  return (
    <div className="screen-scroll screen-anim">
      <div className="eyebrow">Configuración</div>
      <div className="h-title" style={{ margin: '4px 0 20px' }}>Ajustes</div>

      <div className="section-head" style={{ marginTop: 0 }}><h2>Semana del bloque</h2></div>
      <BentoCard>
        <div className="week-ctrl">
          <button className="week-btn press" disabled={store.week <= 1} onClick={() => setWeek(store.week - 1)}>−</button>
          <div style={{ textAlign: 'center' }}>
            <div className="week-num">{store.week}</div>
            <div className="dim" style={{ fontSize: 11, fontWeight: 600 }}>de {MAX_WEEK}</div>
          </div>
          <button className="week-btn press" disabled={store.week >= MAX_WEEK} onClick={() => setWeek(store.week + 1)}>+</button>
        </div>
      </BentoCard>

      <div className="section-head"><h2>Datos</h2></div>
      <BentoCard className="hist-item press" onClick={onExport}>
        <div className="hist-ico" style={{ background: 'linear-gradient(135deg, rgba(59,130,246,0.22), rgba(96,165,250,0.12))' }}>📤</div>
        <div style={{ flex: 1 }}><div style={{ fontSize: 15, fontWeight: 600 }}>Exportar datos (JSON)</div><div className="hist-date">{store.log.length} sesiones guardadas</div></div>
        <div className="action-arrow">›</div>
      </BentoCard>
      <BentoCard className="hist-item press" onClick={onClear}>
        <div className="hist-ico" style={{ background: 'linear-gradient(135deg, rgba(244,63,94,0.22), rgba(251,113,133,0.12))' }}>🗑️</div>
        <div style={{ flex: 1 }}><div style={{ fontSize: 15, fontWeight: 600, color: '#FB7185' }}>Borrar todos los datos</div><div className="hist-date">Esta acción no se puede deshacer</div></div>
        <div className="action-arrow">›</div>
      </BentoCard>

      <div className="section-head"><h2>Acerca de</h2></div>
      <BentoCard style={{ fontSize: 13.5, color: 'var(--text-dim)', lineHeight: 1.5 }}>
        <b style={{ color: 'var(--text)' }}>STRYBE · Entrenamiento 4.0</b><br />
        Bloque de acumulación · 8 semanas.<br />
        40' de cardio diario · Datos guardados solo en este dispositivo.
      </BentoCard>
    </div>
  );
}

/* ============================================================
   BOTTOM NAV
   ============================================================ */
const NAV = [
  { key: 'home', label: 'Inicio', path: 'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z' },
  { key: 'history', label: 'Historial', path: 'M12 8v4l3 2M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0z' },
  { key: 'settings', label: 'Ajustes', path: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 13a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 0 1-4 0v-.2A1.6 1.6 0 0 0 7 19.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H3a2 2 0 0 1 0-4h.2A1.6 1.6 0 0 0 4.7 7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H10a1.6 1.6 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.2a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V10a1.6 1.6 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.2a1.6 1.6 0 0 0-1.4 1z' },
];
function BottomNavigation({ active, onChange }) {
  const idx = NAV.findIndex(n => n.key === active);
  return (
    <nav className="bottom-nav">
      <div className="nav-glow" style={{ left: `calc(${(idx + 0.5) * (100 / NAV.length)}% - 32px)` }} />
      {NAV.map(n => (
        <button key={n.key} className={`nav-item ${active === n.key ? 'on' : ''}`} onClick={() => onChange(n.key)}>
          <svg viewBox="0 0 24 24" fill="none" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d={n.path} /></svg>
          <span>{n.label}</span>
        </button>
      ))}
    </nav>
  );
}

/* ============================================================
   APP
   ============================================================ */
function App() {
  const [store, setStore] = useState(loadStore);
  const [screen, setScreen] = useState('home'); // home/history/settings + flow: routine/complement/workout/finish/cardio
  const [flow, setFlow] = useState({ routine: null, complement: null, cardio: false, session: null });
  const [toast, setToast] = useState(null);

  useEffect(() => { saveStore(store); }, [store]);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2200); };
  const buzz = (n = 8) => { if (navigator.vibrate) navigator.vibrate(n); };
  const stats = computeStats(store.log);
  const setWeek = (w) => setStore(s => ({ ...s, week: Math.max(1, Math.min(MAX_WEEK, w)) }));

  const addSession = (data) => {
    const entry = { id: Date.now(), date: Date.now(), ...data };
    setStore(s => ({ ...s, log: [...s.log, entry] }));
  };

  // navegación flujo fuerza
  const pickRoutine = (r) => { buzz(); setFlow(f => ({ ...f, routine: r })); setScreen('complement'); };
  const startWorkout = (comp, cardio) => { buzz(15); setFlow(f => ({ ...f, complement: comp, cardio })); setScreen('workout'); };
  const finishWorkout = (session) => { buzz(25); setFlow(f => ({ ...f, session })); setScreen('finish'); };
  const saveWorkout = () => {
    addSession(flow.session);
    if (flow.cardio) addSession({ type: 'cardio', cardioType: 'Post-entreno', duration: 40, distance: null });
    setFlow({ routine: null, complement: null, cardio: false, session: null });
    setScreen('home'); showToast('💪 Sesión guardada');
  };
  const saveCardio = (data) => { addSession(data); setScreen('home'); showToast('🏃 Cardio registrado'); };
  const registerRest = () => {
    buzz();
    const todayHasRest = store.log.some(s => s.type === 'descanso' && dayKey(s.date) === dayKey(Date.now()));
    if (todayHasRest) { showToast('🌙 Hoy ya está marcado'); return; }
    addSession({ type: 'descanso' });
    showToast('🌙 Día de descanso registrado');
  };

  const exportData = () => {
    try {
      const blob = new Blob([JSON.stringify(store, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `ironlog-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast('📤 Datos exportados');
    } catch (e) { showToast('No se pudo exportar'); }
  };
  const clearData = () => {
    if (window.confirm('¿Seguro que quieres borrar TODAS las sesiones? Esta acción no se puede deshacer.')) {
      setStore({ week: 1, log: [] }); showToast('🗑️ Datos borrados');
    }
  };

  const isBaseTab = ['home', 'history', 'settings'].includes(screen);

  return (
    <div className="app-shell">
      <div className="aurora-field"><div className="aurora a1" /><div className="aurora a2" /><div className="aurora a3" /></div>

      {screen === 'home' && <HomeScreen store={store} stats={stats}
        onFuerza={() => { buzz(); setScreen('routine'); }}
        onCardio={() => { buzz(); setScreen('cardio'); }}
        onDescanso={registerRest}
        goHistory={() => setScreen('history')} />}

      {screen === 'history' && <HistoryScreen store={store} />}
      {screen === 'settings' && <SettingsScreen store={store} setWeek={setWeek} onExport={exportData} onClear={clearData} />}

      {screen === 'routine' && <RoutineScreen store={store} setWeek={setWeek} onPick={pickRoutine} onBack={() => setScreen('home')} />}
      {screen === 'complement' && <ComplementScreen routine={flow.routine} onStart={startWorkout} onBack={() => setScreen('routine')} />}
      {screen === 'workout' && <WorkoutScreen routine={flow.routine} complement={flow.complement} cardio={flow.cardio}
        week={store.week} log={store.log} onFinish={finishWorkout} onBack={() => { if (window.confirm('¿Salir del entreno? Se perderá lo registrado.')) setScreen('home'); }} />}
      {screen === 'finish' && <FinishScreen session={flow.session} onSave={saveWorkout} />}
      {screen === 'cardio' && <CardioScreen onSave={saveCardio} onBack={() => setScreen('home')} />}

      {isBaseTab && <BottomNavigation active={screen} onChange={(k) => { buzz(); setScreen(k); }} />}
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

if (window.__bootWatchdog) clearTimeout(window.__bootWatchdog);
const __rootEl = document.getElementById('root');
__rootEl.innerHTML = '';
ReactDOM.createRoot(__rootEl).render(<App />);
</script>
