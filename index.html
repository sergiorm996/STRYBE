}

/* ---------- Backend: Supabase real (o uno simulado en las pruebas) ---------- */
function loadScriptSeq(urls) {
  return new Promise((resolve) => {
    let i = 0;
    (function attempt() {
      if (i >= urls.length) { resolve(false); return; }
      const s = document.createElement('script');
      s.src = urls[i++]; s.crossOrigin = 'anonymous'; s.async = true;
      s.onload = () => resolve(true);
      s.onerror = () => { s.remove(); attempt(); };
      document.head.appendChild(s);
    })();
  });
}
function supabaseBackend(client) {
  const run = async (q) => {
    const { data, error, status } = await q;
    if (error) throw Object.assign(new Error(error.message || 'Error'), { code: error.code, status });
    return data || [];
  };
  return {
    auth: {
      getSession: async () => (await client.auth.getSession()).data.session || null,
      signIn: async (email, password) => {
        const { data, error } = await client.auth.signInWithPassword({ email, password });
        if (error) throw Object.assign(new Error(error.message), { status: error.status, code: error.code || 'auth' });
        return data.session;
      },
      signOut: async () => { try { await client.auth.signOut({ scope: 'local' }); } catch (e) {} },
      onChange: (cb) => client.auth.onAuthStateChange((ev, session) => cb(ev, session)),
    },
    upsert: (t, rows) => run(client.from(t).upsert(rows, { onConflict: 'id' }).select('id,updated_at')),
    softDelete: (t, ids, ts) => run(client.from(t).update({ deleted_at: ts }).in('id', ids).is('deleted_at', null).select('id,updated_at')),
    softDeleteOrphans: (t, col, vals, keepIds, ts) => {
      let q = client.from(t).update({ deleted_at: ts }).in(col, vals).is('deleted_at', null);
      if (keepIds.length) q = q.not('id', 'in', `(${keepIds.join(',')})`);
      return run(q.select('id,updated_at'));
    },
    deactivateOthers: (t, col, vals, keepIds) => {
      let q = client.from(t).update({ is_active: false }).in(col, vals).eq('is_active', true);
      if (keepIds.length) q = q.not('id', 'in', `(${keepIds.join(',')})`);
      return run(q.select('id,updated_at'));
    },
    since: (t, sinceIso, from, to) => {
      let q = client.from(t).select('*').order('updated_at', { ascending: true }).order('id', { ascending: true }).range(from, to);
      if (sinceIso) q = q.gt('updated_at', sinceIso);
      return run(q);
    },
    byIds: (t, col, ids) => run(client.from(t).select('*').in(col, ids)),
  };
}

/* ---------- Motor de sincronización ---------- */
const Sync = (() => {
  const emptyMeta = () => ({ userId: null, email: null, firstDone: false, cursors: {}, ver: {}, uploaded: {}, queue: {}, failed: {}, exIds: {}, lastSyncAt: null });
  let meta = { ...emptyMeta(), ...(readJSON(SYNC_KEY) || {}) };
  if (!meta.exIds) meta.exIds = {};
  let backend = null, bridge = null, unsubAuth = null;
  let running = null, rerun = false, timer = null, retryN = 0, started = false;
  let state = { lib: 'idle', signedIn: !!meta.userId, email: meta.email, syncing: false, error: null, errorKind: null, lastSyncAt: meta.lastSyncAt, pending: Object.keys(meta.queue).length, failed: Object.keys(meta.failed).length, online: navigator.onLine !== false };
  const subs = new Set();
  const saveMeta = () => { try { localStorage.setItem(SYNC_KEY, JSON.stringify(meta)); } catch (e) {} };
  const set = (p) => { state = { ...state, ...p, pending: Object.keys(meta.queue).length, failed: Object.keys(meta.failed).length }; subs.forEach(f => f(state)); };

  async function ensureBackend() {
    if (backend) return backend;
    if (window.__strybeFakeBackend) { backend = window.__strybeFakeBackend; set({ lib: 'ready' }); return backend; }
    if (!window.supabase || !window.supabase.createClient) {
      set({ lib: 'loading' });
      const ok = await loadScriptSeq(SUPABASE_JS);
      if (!ok || !window.supabase) { set({ lib: 'error' }); return null; }
    }
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: 'strybe_auth' },
    });
    backend = supabaseBackend(client);
    set({ lib: 'ready' });
    return backend;
  }

  async function internetOk() {
    try { await fetch('https://unpkg.com/', { mode: 'no-cors', cache: 'no-store' }); return true; } catch (e) { return false; }
  }
  async function classify(err) {
    const msg = String((err && err.message) || '');
    if (navigator.onLine === false) return ['offline', 'Sin conexión'];
    if (err && (err.status === 540 || /paused|project.*(inactive|restor)/i.test(msg))) return ['paused', 'La nube está en pausa: reactívala en supabase.com'];
    if (err && ['42703', '42P01', 'PGRST204', 'PGRST200'].includes(err.code)) return ['schema', 'Falta ejecutar supabase_migration_01.sql en Supabase'];
    if (err && (err.status === 401 || err.code === 'PGRST301' || /JWT|refresh token/i.test(msg))) return ['auth', 'Sesión caducada: vuelve a iniciar sesión'];
    if ((err && err.status === 0) || /fetch|network|load failed|timeout|internet/i.test(msg)) {
      // ¿Hay internet pero Supabase no contesta? En el plan gratuito eso suele ser que el proyecto está en pausa.
      return (await internetOk()) ? ['paused', 'La nube no responde (¿en pausa?): reactívala en supabase.com'] : ['offline', 'Sin conexión'];
    }
    if (!err || err.status == null) return ['app', 'Error interno al sincronizar (tus datos siguen guardados aquí)'];
    return ['server', 'Error de la nube: ' + msg.slice(0, 120)];
  }

  /* ---- Cola ---- */
  function enqueueDiff(prev, next, skip) {
    if (!meta.userId || !prev || prev === next) return;
    const skipSet = skip || new Set();
    const pm = new Map(prev.log.map(e => [e.uuid, e]));
    const nm = new Map(next.log.map(e => [e.uuid, e]));
    let n = 0;
    const now = Date.now();
    nm.forEach((e, u) => { if (!skipSet.has(u) && pm.get(u) !== e) { meta.queue['e:' + u] = { op: 'upsert', at: now }; n++; } });
    pm.forEach((e, u) => { if (!skipSet.has(u) && !nm.has(u)) { meta.queue['e:' + u] = { op: 'delete', at: now, rows: rowIds(entryRows(e)) }; n++; } });
    const pc = new Map((prev.customExercises || []).map(c => [c.uuid, c]));
    (next.customExercises || []).forEach(c => { if (c.uuid && !skipSet.has(c.uuid) && pc.get(c.uuid) !== c) { meta.queue['x:' + c.uuid] = { op: 'upsert', at: now }; n++; } });
    if (prev.program !== next.program && next.program && !skipSet.has('program')) { meta.queue['p:program'] = { op: 'upsert', at: now }; n++; }
    SIMPLE_SYNC.forEach(cfg => {
      const pl = new Map((prev[cfg.key] || []).map(x => [x.uuid, x]));
      const nl = new Map((next[cfg.key] || []).map(x => [x.uuid, x]));
      nl.forEach((x, u) => { if (!skipSet.has(u) && pl.get(u) !== x) { meta.queue[cfg.q + u] = { op: 'upsert', at: now }; n++; } });
      pl.forEach((x, u) => { if (!skipSet.has(u) && !nl.has(u)) { meta.queue[cfg.q + u] = { op: 'delete', at: now }; n++; } });
    });
    if (n) { saveMeta(); set({}); schedule(2500); }
  }

  /* ---- Subida ---- */
  async function push() {
    const keys = Object.keys(meta.queue);
    if (!keys.length) return;
    const store = bridge.getStore();
    const entries = new Map(store.log.map(e => [e.uuid, e]));
    const customs = new Map((store.customExercises || []).map(c => [c.uuid, c]));
    // Foto fija de la cola: mientras se sube, las operaciones hechas se van quitando de meta.queue.
    const ops = Object.fromEntries(keys.map(k => [k, meta.queue[k]]));
    const done = (k) => { if (meta.queue[k] && meta.queue[k].at === ops[k].at) delete meta.queue[k]; };
    const tsNow = new Date().toISOString();

    // 1) Ejercicios propios
    const exKeys = keys.filter(k => k.startsWith('x:') && ops[k].op === 'upsert');
    const exRows = exKeys.map(k => customs.get(k.slice(2))).filter(Boolean).map(exerciseRow);
    for (const row of exRows) {
      try { await backend.upsert('exercises', [row]); meta.exIds[nameKey(row.name)] = row.id; }
      catch (err) {
        // 23505 = ya hay en la nube un ejercicio con ese nombre (creado en otro dispositivo): no hace falta subirlo.
        if (String(err.code) !== '23505') throw err;
      }
    }
    exKeys.forEach(done);

    // 1a) Rutinas (bloque, rutinas y ejercicios de cada rutina)
    if (ops['p:program'] && store.program) { await pushProgram(store.program); done('p:program'); saveMeta(); }

    // 1b) Cuerpo y check-ins
    for (const cfg of SIMPLE_SYNC) {
      const list = new Map((store[cfg.key] || []).map(x => [x.uuid, x]));
      const ups = keys.filter(k => k.startsWith(cfg.q) && ops[k].op === 'upsert');
      for (const part of chunk(ups, 200)) {
        const rows = part.map(k => list.get(k.slice(2))).filter(Boolean).map(cfg.toRow);
        let res = [];
        try { if (rows.length) res = await backend.upsert(cfg.table, rows); }
        catch (err) {
          // 23505: ese día/semana ya existe en la nube con otro id (creado en otro dispositivo).
          // Se baja la tabla entera en la próxima vuelta y se fusiona por fecha.
          if (String(err.code) !== '23505') throw err;
          delete meta.cursors[cfg.table];
          saveMeta(); schedule(1500);
          continue;
        }
        res.forEach(r => { meta.ver[r.id] = Math.max(meta.ver[r.id] || 0, msOf(r.updated_at)); });
        part.forEach(done);
      }
      const dels = keys.filter(k => k.startsWith(cfg.q) && ops[k].op === 'delete');
      for (const part of chunk(dels, 100)) {
        await backend.softDelete(cfg.table, part.map(k => k.slice(2)), tsNow);
        part.forEach(done);
      }
      saveMeta(); set({});
    }

    // 2) Entradas nuevas o editadas, por lotes
    const upKeys = keys.filter(k => k.startsWith('e:') && ops[k].op === 'upsert');
    for (const batch of chunk(upKeys, ENTRY_BATCH)) {
      const list = batch.map(k => entries.get(k.slice(2))).filter(Boolean);
      try {
        await pushEntries(list, tsNow);
      } catch (err) {
        // Datos que la base rechaza (códigos 22xxx/23xxx): se aíslan entrada a entrada para no bloquear la cola.
        if (!/^2[23]/.test(String(err.code || ''))) throw err;
        for (const e of list) {
          try { await pushEntries([e], tsNow); }
          catch (e2) {
            if (!/^2[23]/.test(String(e2.code || ''))) throw e2;
            meta.failed[e.uuid] = { at: Date.now(), msg: String(e2.message).slice(0, 200) };
            done('e:' + e.uuid);
          }
        }
      }
      batch.forEach(k => { if (!entries.has(k.slice(2))) done(k); });
      list.forEach(e => { done('e:' + e.uuid); delete meta.failed[e.uuid]; });
      saveMeta(); set({});
    }

    // 3) Borrados → deleted_at
    const delKeys = keys.filter(k => k.startsWith('e:') && ops[k].op === 'delete');
    if (delKeys.length) {
      const byTable = { sessions: [], session_exercises: [], sets: [], cardio: [] };
      delKeys.forEach(k => Object.entries(ops[k].rows || {}).forEach(([t, ids]) => byTable[t] && byTable[t].push(...ids)));
      for (const t of ['sets', 'session_exercises', 'cardio', 'sessions']) {
        for (const ids of chunk(byTable[t], 100)) if (ids.length) await backend.softDelete(t, ids, tsNow);
      }
      delKeys.forEach(k => { done(k); delete meta.uploaded[k.slice(2)]; });
      saveMeta(); set({});
    }
  }
  /* Ids estables por usuario: el mismo bloque/rutina/ejercicio tiene el mismo id en todos los dispositivos. */
  const pid = (...parts) => detUUID(meta.userId, ...parts);
  const routineRowId = (kind, key) => pid('routine', kind, String(key).toLowerCase());
  async function refreshExIds() {
    (await fetchSince('exercises', null)).forEach(r => { if (!r.deleted_at) meta.exIds[nameKey(r.name)] = r.id; });
  }
  async function pushProgram(sp) {
    const pg = compileProgram(sp);
    if (!pg) return;
    let ver = 0;
    const note = (res) => res.forEach(r => { ver = Math.max(ver, msOf(r.updated_at)); });
    const groups = [
      ...pg.routines.map((g, i) => ({ g, kind: 'rutina', pos: i, active: true })),
      ...pg.complements.map((g, i) => ({ g, kind: 'complemento', pos: 100 + i, active: true })),
      ...pg.archived.map((g, i) => ({ g, kind: g.kind === 'complemento' ? 'complemento' : 'rutina', pos: 200 + i, active: false })),
    ];
    // a) Catálogo: cada ejercicio de las rutinas necesita su fila en exercises (routine_exercises.exercise_id).
    const exByKey = new Map();
    groups.forEach(({ g }) => g.exercises.forEach(e => { const k = nameKey(e.name); if (!exByKey.has(k)) exByKey.set(k, e); }));
    let newEx = [...exByKey].filter(([k]) => !meta.exIds[k]).map(([k, e]) => ({ id: pid('exercise', k), name: e.name, muscle_primary: e.muscle || 'otro' }));
    if (newEx.length) {
      try { await backend.upsert('exercises', newEx); }
      catch (err) {
        if (String(err.code) !== '23505') throw err;
        await refreshExIds(); // ya existían con otro id (creados como ejercicio propio): se usan esos
        newEx = newEx.filter(r => !meta.exIds[nameKey(r.name)]);
        if (newEx.length) await backend.upsert('exercises', newEx);
      }
      newEx.forEach(r => { const k = nameKey(r.name); if (!meta.exIds[k]) meta.exIds[k] = r.id; });
    }
    // b) Bloque activo (los demás bloques quedan inactivos)
    const blockId = pid('block', nameKey(pg.name));
    note(await backend.upsert('blocks', [{ id: blockId, name: pg.name, weeks: pg.weeks, is_active: true }]));
    note(await backend.deactivateOthers('blocks', 'is_active', [true], [blockId]));
    // c) Rutinas y complementos (las archivadas con is_active = false)
    const routineRows = groups.map(({ g, kind, pos, active }) => ({
      id: routineRowId(kind, g.key), block_id: blockId, slug: g.key, name: g.name, icon: g.icon, color: g.color || null, kind, position: pos, is_active: active,
    }));
    note(await backend.upsert('routines', routineRows));
    // d) Ejercicios de cada rutina (los que se quitan quedan con is_active = false)
    const rxRows = [];
    groups.filter(x => x.active).forEach(({ g, kind }) => g.exercises.forEach((e, j) => rxRows.push({
      id: pid('rx', kind, g.key.toLowerCase(), nameKey(e.name)), routine_id: routineRowId(kind, g.key), exercise_id: meta.exIds[nameKey(e.name)],
      position: j, sets_target: e.series, reps_target: e.reps, rir_target: e.rir, note: e.note || null, plan: e.plan || {}, is_active: true,
    })));
    for (const part of chunk(rxRows, 300)) note(await backend.upsert('routine_exercises', part));
    note(await backend.deactivateOthers('routine_exercises', 'routine_id', routineRows.map(r => r.id), rxRows.map(r => r.id)));
    if (ver) meta.ver.program = Math.max(meta.ver.program || 0, ver);
  }

  async function pushEntries(list, tsNow) {
    const rows = { sessions: [], session_exercises: [], sets: [], cardio: [] };
    const owner = new Map();
    list.forEach(e => { const R = entryRows(e); Object.keys(rows).forEach(t => R[t].forEach(r => { rows[t].push(r); owner.set(r.id, e.uuid); })); });
    const ver = {};
    const note = (res) => res.forEach(r => { const u = owner.get(r.id) || r.__owner; if (u) ver[u] = Math.max(ver[u] || 0, msOf(r.updated_at)); });
    for (const t of ['sessions', 'session_exercises', 'sets', 'cardio']) {
      for (const part of chunk(rows[t], 500)) if (part.length) note(await backend.upsert(t, part));
    }
    // Entradas que ya estaban en la nube: marca como borrado lo que ya no existe en local (series o ejercicios quitados al editar).
    for (const e of list) {
      if (!meta.uploaded[e.uuid] || e.type !== 'fuerza') continue;
      const R = entryRows(e);
      const seIds = R.session_exercises.map(r => r.id);
      const tag = (res) => res.map(r => ({ ...r, __owner: e.uuid }));
      const goneSe = await backend.softDeleteOrphans('session_exercises', 'session_id', [e.uuid], seIds, tsNow);
      note(tag(goneSe));
      const parentIds = [...seIds, ...goneSe.map(r => r.id)];
      if (parentIds.length) note(tag(await backend.softDeleteOrphans('sets', 'session_exercise_id', parentIds, R.sets.map(r => r.id), tsNow)));
      note(tag(await backend.softDeleteOrphans('cardio', 'session_id', [e.uuid], R.cardio.map(r => r.id), tsNow)));
    }
    list.forEach(e => { meta.uploaded[e.uuid] = 1; if (ver[e.uuid]) meta.ver[e.uuid] = Math.max(meta.ver[e.uuid] || 0, ver[e.uuid]); });
  }

  /* ---- Bajada ---- */
  async function fetchSince(t, sinceIso) {
    const out = [];
    for (let from = 0; ; from += PAGE) {
      const rows = await backend.since(t, sinceIso, from, from + PAGE - 1);
      out.push(...rows);
      if (rows.length < PAGE) return out;
    }
  }
  async function fetchIn(t, col, ids) {
    const out = [];
    for (const part of chunk([...ids], 100)) if (part.length) out.push(...await backend.byIds(t, col, part));
    return out;
  }
  async function pull() {
    const full = !meta.firstDone;
    const since = {};
    SYNC_TABLES.forEach(t => {
      const c = meta.cursors[t];
      since[t] = full || !c ? null : new Date(msOf(c) - 5000).toISOString(); // 5 s de solape por si llegan filas con la misma hora
    });
    const changed = {};
    for (const t of SYNC_TABLES) changed[t] = await fetchSince(t, since[t]);
    changed.exercises.forEach(r => { if (!r.deleted_at) meta.exIds[nameKey(r.name)] = r.id; });

    let rows, sessionIds = null, cardioIds = null;
    if (full) {
      rows = changed;
    } else {
      // Qué entradas han cambiado (por cualquiera de sus filas) → se bajan completas.
      sessionIds = new Set(changed.sessions.map(r => r.id));
      changed.session_exercises.forEach(r => sessionIds.add(r.session_id));
      changed.cardio.forEach(r => (r.session_id ? sessionIds.add(r.session_id) : null));
      cardioIds = new Set(changed.cardio.filter(r => !r.session_id).map(r => r.id));
      const knownSe = new Set(changed.session_exercises.map(r => r.id));
      const missingSe = [...new Set(changed.sets.map(r => r.session_exercise_id))].filter(id => !knownSe.has(id));
      if (missingSe.length) (await fetchIn('session_exercises', 'id', missingSe)).forEach(r => sessionIds.add(r.session_id));
      rows = { exercises: changed.exercises, sessions: [], session_exercises: [], sets: [], cardio: changed.cardio.filter(r => !r.session_id) };
      if (sessionIds.size) {
        rows.sessions = await fetchIn('sessions', 'id', sessionIds);
        rows.session_exercises = await fetchIn('session_exercises', 'session_id', sessionIds);
        rows.sets = await fetchIn('sets', 'session_exercise_id', rows.session_exercises.map(r => r.id));
        rows.cardio = rows.cardio.concat(await fetchIn('cardio', 'session_id', sessionIds));
      }
    }
    applyRemote(assembleEntries(rows, sessionIds, cardioIds), rows.exercises);
    SIMPLE_SYNC.forEach(cfg => applySimpleRemote(cfg, changed[cfg.table], !since[cfg.table]));
    await pullProgram(changed, full);
    SYNC_TABLES.forEach(t => {
      const max = changed[t].reduce((m, r) => (msOf(r.updated_at) > msOf(m) ? r.updated_at : m), meta.cursors[t] || null);
      if (max) meta.cursors[t] = max;
    });
    saveMeta();
  }

  /* Aplica lo bajado: gana el cambio más reciente (local updatedAt vs updated_at de la nube). */
  function applyRemote(remote, remoteExercises) {
    const store = bridge.getStore();
    const local = new Map(store.log.map(e => [e.uuid, e]));
    const changes = new Map(); // uuid → entry | null
    const now = Date.now();
    remote.forEach((r, uuid) => {
      if (r.upd <= (meta.ver[uuid] || 0)) return; // es nuestro propio cambio, ya lo tenemos
      const loc = local.get(uuid);
      const pending = meta.queue['e:' + uuid];
      if (pending && pending.op === 'upsert' && loc && (loc.updatedAt || 0) > r.upd) return; // lo local es más nuevo: se subirá
      if (pending && pending.op === 'delete' && pending.at > r.upd) return;                // lo borré aquí después
      if (!meta.firstDone && loc && !r.deleted && (loc.updatedAt || 0) > r.upd) { meta.queue['e:' + uuid] = { op: 'upsert', at: now }; return; }
      if (r.deleted) { if (loc) changes.set(uuid, null); }
      else changes.set(uuid, r.entry);
      delete meta.queue['e:' + uuid];
      meta.ver[uuid] = r.upd;
      meta.uploaded[uuid] = 1;
    });
    // Primera sincronización: todo lo local que no está en la nube se sube.
    if (!meta.firstDone) {
      store.log.forEach(e => { if (!remote.has(e.uuid)) meta.queue['e:' + e.uuid] = { op: 'upsert', at: now }; });
      const remoteNames = new Set((remoteExercises || []).filter(x => !x.deleted_at).map(x => nameKey(x.name)));
      (store.customExercises || []).forEach(c => { if (!remoteNames.has(nameKey(c.name))) meta.queue['x:' + c.uuid] = { op: 'upsert', at: now }; });
    }
    // Ejercicios propios de otros dispositivos
    const knownNames = new Set(buildCatalog(store.customExercises).map(c => nameKey(c.name)));
    const newCustom = (remoteExercises || []).filter(x => !x.deleted_at && !knownNames.has(nameKey(x.name)))
      .map(x => ({ id: x.id, uuid: x.id, name: normName(x.name), muscle: MUSCLES.includes(x.muscle_primary) ? x.muscle_primary : 'otro', createdAt: msOf(x.created_at) || now }));
    if (!changes.size && !newCustom.length) return;
    const touched = new Set([...changes.keys(), ...newCustom.map(c => c.uuid)]);
    bridge.applyRemote(s => {
      const log = s.log.filter(e => !changes.has(e.uuid) || changes.get(e.uuid));
      const idx = new Map(log.map((e, i) => [e.uuid, i]));
      changes.forEach((entry, uuid) => {
        if (!entry) return;
        if (idx.has(uuid)) log[idx.get(uuid)] = entry; else log.push(entry);
      });
      log.sort((a, b) => a.date - b.date);
      return { ...s, log, customExercises: [...(s.customExercises || []), ...newCustom] };
    }, touched);
  }

  /* Rutinas: si han cambiado en la nube (otro dispositivo), se rehace el programa local. Gana el más reciente;
     el programa por defecto (routines.json sin tocar) cuenta como el más antiguo. */
  async function pullProgram(changed, full) {
    const sp = bridge.getStore().program;
    const rows = PROGRAM_TABLES.flatMap(t => changed[t]);
    const now = Date.now();
    if (!rows.length) {
      if (full && sp) meta.queue['p:program'] = { op: 'upsert', at: now }; // la nube aún no tiene rutinas
      return;
    }
    const remoteMax = Math.max(...rows.map(r => msOf(r.updated_at)));
    if (remoteMax <= (meta.ver.program || 0)) return; // es nuestro propio cambio
    if (sp && (sp.updatedAt || 0) > remoteMax) { meta.queue['p:program'] = { op: 'upsert', at: now }; return; }
    const [blocks, routines, rx, exs] = await Promise.all(['blocks', 'routines', 'routine_exercises', 'exercises'].map(t => fetchSince(t, null)));
    const block = blocks.filter(b => b.is_active && !b.deleted_at).sort((a, b) => msOf(b.updated_at) - msOf(a.updated_at))[0];
    if (!block) return;
    const exById = new Map(exs.map(e => [e.id, e]));
    const groupJSON = (r, any) => ({
      id: r.slug, nombre: r.name, icono: r.icon || (r.kind === 'complemento' ? '➕' : '🏋️'), ...(r.color ? { color: r.color } : {}),
      ejercicios: rx.filter(x => x.routine_id === r.id && !x.deleted_at && (any || x.is_active)).sort((a, b) => a.position - b.position).map(x => {
        const e = exById.get(x.exercise_id) || {};
        return { ejercicio: e.name || 'Ejercicio', musculo: MUSCLES.includes(e.muscle_primary) ? e.muscle_primary : 'otro', series: x.sets_target, reps: x.reps_target,
          rir: x.rir_target, ...(x.note ? { nota: x.note } : {}), plan: x.plan || {} };
      }),
    });
    const live = routines.filter(r => !r.deleted_at && r.block_id === block.id).sort((a, b) => a.position - b.position);
    const json = {
      version: 1, bloque: { nombre: block.name, semanas: block.weeks },
      rutinas: live.filter(r => r.is_active && r.kind !== 'complemento').map(r => groupJSON(r, false)),
      complementos: live.filter(r => r.is_active && r.kind === 'complemento').map(r => groupJSON(r, false)),
    };
    const v = validateProgram(json);
    if (!v.ok) { console.warn('[STRYBE sync] rutinas de la nube no válidas', v.errors); return; }
    const archived = live.filter(r => !r.is_active).map(r => ({ kind: r.kind === 'complemento' ? 'complemento' : 'rutina', json: groupJSON(r, true), archivedAt: msOf(r.updated_at) }));
    meta.ver.program = remoteMax;
    delete meta.queue['p:program'];
    if (sp && JSON.stringify(sp.json) === JSON.stringify(json) && JSON.stringify((sp.archived || []).map(a => a.json.id)) === JSON.stringify(archived.map(a => a.json.id))) return;
    const next = { json, archived, source: 'cloud', sig: null, updatedAt: remoteMax };
    bridge.applyRemote(s => ({ ...s, program: next, week: Math.min(s.week, block.weeks) }), new Set(['program']));
  }

  /* Cuerpo y check-ins: gana el más reciente; si el mismo día/semana tiene otro id en la nube, se adopta el de la nube. */
  function applySimpleRemote(cfg, rows, fullTable) {
    const store = bridge.getStore();
    const list = store[cfg.key] || [];
    const byU = new Map(list.map(x => [x.uuid, x]));
    const byD = new Map(list.map(x => [x[cfg.localDate], x]));
    const changes = new Map(); // uuid local → nuevo objeto | null
    const now = Date.now();
    const remoteIds = new Set(), remoteDates = new Set();
    [...rows].sort((a, b) => msOf(a.updated_at) - msOf(b.updated_at)).forEach(r => {
      const upd = msOf(r.updated_at);
      if (!r.deleted_at) { remoteIds.add(r.id); remoteDates.add(r[cfg.remoteDate]); }
      if (upd <= (meta.ver[r.id] || 0)) return;
      let loc = byU.get(r.id);
      if (!loc && !r.deleted_at) {
        const same = byD.get(r[cfg.remoteDate]);
        if (same && same.uuid !== r.id) {
          // El mismo día/semana se registró en dos dispositivos: se fusionan. Manda el más reciente en
          // los campos que tiene; los vacíos se rellenan con el otro (p. ej. peso rápido + medidas).
          delete meta.queue[cfg.q + same.uuid];
          const remote = cfg.fromRow(r);
          const filled = (o) => Object.fromEntries(Object.entries(o).filter(([, v]) => v != null && v !== ''));
          const localNewer = (same.updatedAt || 0) > upd;
          const merged = localNewer
            ? { ...remote, ...filled(same), id: r.id, uuid: r.id, updatedAt: same.updatedAt }
            : { ...same, ...filled(remote), id: r.id, uuid: r.id, updatedAt: upd };
          changes.set(same.uuid, merged);
          meta.ver[r.id] = upd;
          if (localNewer || Object.keys(filled(same)).some(k => remote[k] == null || remote[k] === '')) meta.queue[cfg.q + r.id] = { op: 'upsert', at: now };
          return;
        }
      }
      const pending = meta.queue[cfg.q + r.id];
      if (pending && pending.op === 'upsert' && loc && (loc.updatedAt || 0) > upd) return;
      if (pending && pending.op === 'delete' && pending.at > upd) return;
      if (!meta.firstDone && loc && !r.deleted_at && (loc.updatedAt || 0) > upd) { meta.queue[cfg.q + r.id] = { op: 'upsert', at: now }; return; }
      delete meta.queue[cfg.q + r.id];
      meta.ver[r.id] = upd;
      if (r.deleted_at) { if (loc) changes.set(r.id, null); }
      else changes.set(r.id, cfg.fromRow(r));
    });
    if (!meta.firstDone || fullTable) {
      list.forEach(x => {
        if (!changes.has(x.uuid) && !remoteIds.has(x.uuid) && !remoteDates.has(x[cfg.localDate]) && !meta.queue[cfg.q + x.uuid]) {
          meta.queue[cfg.q + x.uuid] = { op: 'upsert', at: now };
        }
      });
    }
    if (!changes.size) return;
    const touched = new Set([...changes.keys(), ...[...changes.values()].filter(Boolean).map(x => x.uuid)]);
    bridge.applyRemote(s => {
      const cur = s[cfg.key] || [];
      const out = cur.filter(x => !changes.has(x.uuid) || changes.get(x.uuid)).map(x => changes.get(x.uuid) || x);
      const have = new Set(out.map(x => x.uuid));
      changes.forEach((x, u) => { if (x && !have.has(x.uuid)) out.push(x); });
      out.sort((a, b) => (a[cfg.localDate] < b[cfg.localDate] ? -1 : 1));
      return { ...s, [cfg.key]: out };
    }, touched);
  }

  /* ---- Ciclo ---- */
  async function run() {
    if (!meta.userId) return;
    if (navigator.onLine === false) { set({ online: false, syncing: false, errorKind: 'offline', error: 'Sin conexión' }); return; }
    const be = await ensureBackend();
    if (!be) { set({ errorKind: 'network', error: 'No se pudo cargar la librería de la nube' }); return; }
    set({ syncing: true, online: true });
    try {
      const session = await be.auth.getSession();
      if (!session) { await signedOut('Sesión caducada: vuelve a iniciar sesión'); return; }
      await pull();
      await push();
      if (!meta.firstDone) { meta.firstDone = true; }
      meta.lastSyncAt = Date.now();
      saveMeta();
      retryN = 0;
      set({ syncing: false, error: null, errorKind: null, detail: null, lastSyncAt: meta.lastSyncAt });
    } catch (err) {
      const [kind, msg] = await classify(err);
      saveMeta();
      const detail = String((err && (err.code ? err.code + ' · ' : '') + (err.message || err)) || '').slice(0, 300);
      try { console.warn('[STRYBE sync]', kind, err); } catch (e) {}
      set({ syncing: false, error: msg, errorKind: kind, detail });
      if (kind === 'auth') { await signedOut(msg); return; }
      if (kind !== 'schema') schedule(RETRY_DELAYS[Math.min(retryN++, RETRY_DELAYS.length - 1)]);
    }
  }
  function syncNow() {
    if (running) { rerun = true; return running; }
    clearTimeout(timer);
    running = run().finally(() => { running = null; if (rerun) { rerun = false; syncNow(); } });
    return running;
  }
  function schedule(ms) {
    if (!meta.userId) return;
    clearTimeout(timer);
    timer = setTimeout(syncNow, ms);
  }
  async function signedOut(msg) {
    meta = emptyMeta(); saveMeta();
    set({ signedIn: false, email: null, syncing: false, error: msg || null, errorKind: msg ? 'auth' : null, lastSyncAt: null });
  }

  return {
    get state() { return state; },
    subscribe(f) { subs.add(f); return () => subs.delete(f); },
    enqueueDiff,
    syncNow,
    /* Arranque: si hay sesión guardada, sincroniza; escucha red y vuelta a la app. */
    async start(b) {
      bridge = b;
      if (started) return;
      started = true;
      window.addEventListener('online', () => { set({ online: true, errorKind: state.errorKind === 'offline' ? null : state.errorKind }); schedule(500); });
      window.addEventListener('offline', () => set({ online: false }));
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') schedule(800); });
      setInterval(() => { if (document.visibilityState === 'visible') schedule(100); }, 5 * 60 * 1000);
      if (!meta.userId) return; // sin sesión: no se carga nada de la nube
      const be = await ensureBackend();
      if (!be) return;
      if (!unsubAuth) unsubAuth = be.auth.onChange((ev) => { if (ev === 'SIGNED_OUT' && meta.userId) signedOut(); });
      schedule(300);
    },
    /* Inicia sesión. Guarda antes una copia local de los datos (por si acaso) y deja lista la 1ª sincronización. */
    async signIn(email, password) {
      if (navigator.onLine === false) throw new Error('Sin conexión: conéctate para iniciar sesión');
      const be = await ensureBackend();
      if (!be) throw new Error('No se pudo cargar la librería de la nube. Revisa la conexión.');
      let session;
      try { session = await be.auth.signIn(email.trim(), password); }
      catch (err) {
        if (/invalid login credentials/i.test(err.message)) throw new Error('Correo o contraseña incorrectos');
        const [, msg] = await classify(err);
        throw new Error(msg);
      }
      const store = bridge.getStore();
      let backup = false;
      if (store.log.length) {
        try { localStorage.setItem(PRESYNC_BACKUP_KEY, JSON.stringify({ savedAt: Date.now(), store })); backup = true; } catch (e) {}
      }
      meta = { ...emptyMeta(), userId: session.user.id, email: session.user.email || email.trim() };
      saveMeta();
      if (!unsubAuth) unsubAuth = be.auth.onChange((ev) => { if (ev === 'SIGNED_OUT' && meta.userId) signedOut(); });
      set({ signedIn: true, email: meta.email, error: null, errorKind: null });
      return { backup, entries: store.log.length };
    },
    async signOut() {
      clearTimeout(timer);
      if (backend) await backend.auth.signOut();
      await signedOut();
    },
    /* Para el puente con React: lo que cambia la nube no debe volver a la cola. */
    _debug: () => ({ meta, state }),
  };
})();

/* ============================================================
   APP
   ============================================================ */
const BOOT_STORE = loadStore();   // aplica el programa (rutinas) antes de recuperar el entreno a medias
const BOOT_DRAFT = loadDraft();
const BASE_TABS = ['home', 'history', 'progress', 'body', 'settings'];

function App() {
  const [store, setStore] = useState(BOOT_STORE);
  // Rutinas activas: se recompilan cuando cambia el programa (importar JSON o llega de la nube).
  const programOk = useMemo(() => { const pg = compileProgram(store.program); applyProgram(pg); return !!pg; }, [store.program]);
  const [draft, setDraft] = useState(BOOT_DRAFT);
  const [screen, setScreen] = useState(BOOT_DRAFT ? BOOT_DRAFT.stage : 'home');
  const [pick, setPick] = useState(null);
  const [toast, setToast] = useState(null);   // { msg, action? }
  const [dialog, setDialog] = useState(null); // { title, text, confirm, danger, resolve }
  const [sheet, setSheet] = useState(null);   // entrada del historial abierta
  const [bodySheet, setBodySheet] = useState(null); // fecha del registro corporal abierto
  const [summary, setSummary] = useState(null);     // 'week' | 'month'
  const [programImport, setProgramImport] = useState(null); // { fileName, raw, v, parseError }
  const [editEntry, setEditEntry] = useState(null);         // sesión guardada que se está editando
  const toastTimer = useRef(null);
  const saveWarned = useRef(false);
  const storeRef = useRef(store);
  storeRef.current = store;
  const prevStoreRef = useRef(null);
  const remoteTouched = useRef(null);

  const showToast = (msg, action) => {
    clearTimeout(toastTimer.current);
    setToast({ msg, action, key: Date.now() });
    toastTimer.current = setTimeout(() => setToast(null), action ? 4500 : 2400);
  };
  const ask = (opts) => new Promise(resolve => setDialog({ ...opts, resolve }));
  const closeDialog = (v) => { if (dialog) dialog.resolve(v); setDialog(null); };

  // Persistencia
  useEffect(() => {
    if (!saveStore(store) && !saveWarned.current) {
      saveWarned.current = true;
      showToast('⚠️ No se pudo guardar. Exporta tus datos');
    }
  }, [store]);
  useEffect(() => { saveDraft(draft); }, [draft]);

  /* Nube: cada cambio del store entra en la cola (salvo lo que acaba de llegar de la nube). */
  useEffect(() => {
    const prev = prevStoreRef.current;
    prevStoreRef.current = store;
    if (prev) Sync.enqueueDiff(prev, store, remoteTouched.current);
    remoteTouched.current = null;
  }, [store]);
  useEffect(() => {
    Sync.start({
      getStore: () => storeRef.current,
      applyRemote: (fn, touched) => {
        remoteTouched.current = new Set([...(remoteTouched.current || []), ...touched]);
        // El motor sigue trabajando en la misma vuelta (sube justo después de bajar):
        // tiene que ver ya lo que acaba de aplicar, sin esperar a que React vuelva a pintar.
        storeRef.current = fn(storeRef.current);
        setStore(s => fn(s));
      },
    });
  }, []);

  /* Actualizaciones: si llega una versión nueva con un entreno a medias, se aplica al terminarlo. */
  useEffect(() => {
    const onUpdate = () => showToast('⬇️ Nueva versión lista: se aplicará al terminar el entreno');
    window.addEventListener('strybe-update', onUpdate);
    return () => window.removeEventListener('strybe-update', onUpdate);
  }, []);
  useEffect(() => {
    if (!draft && window.__strybeUpdatePending) { window.__strybeUpdatePending = false; location.reload(); }
  }, [draft]);
  const checkUpdate = async () => {
    showToast('🔄 Buscando actualización…');
    try {
      const res = await fetch('./sw.js', { cache: 'no-store' });
      const m = (await res.text()).match(/const CACHE = '([^']+)'/);
      const remote = m && m[1];
      const local = window.caches ? (await caches.keys()).find(k => k.startsWith('strybe-')) : null;
      if (remote && remote !== local) {
        if (window.__strybeCheckUpdate) await window.__strybeCheckUpdate();
        showToast(`⬇️ Instalando ${remote}… la app se recargará sola`);
      } else {
        showToast(`✅ Ya tienes la última versión (${APP_VERSION})`);
      }
    } catch (e) {
      showToast('📡 Sin conexión: no se puede comprobar');
    }
  };
  useEffect(() => {
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
    if (BOOT_DRAFT) showToast('💾 Entreno recuperado');
  }, []);

  const stats = useMemo(() => computeStats(store.log), [store.log]);
  const doneSet = useMemo(() => doneRoutinesForWeek(store.log, store.week), [store.log, store.week]);
  const nextRoutine = ROUTINES.find(r => !doneSet.has(r.key)) || null;
  const catalog = useMemo(() => buildCatalog(store.customExercises), [store.customExercises]);
  const addCustomExercise = (item) => setStore(s => {
    const name = normName(item.name);
    if (!name || buildCatalog(s.customExercises).some(e => nameKey(e.name) === nameKey(name))) return s;
    const id = uuidv4();
    return { ...s, customExercises: [...(s.customExercises || []), { id, uuid: id, name, muscle: MUSCLES.includes(item.muscle) ? item.muscle : 'otro', createdAt: Date.now() }] };
  });

  const setWeek = (w) => setStore(s => ({ ...s, week: clampWeek(w) }));
  const addSession = (data) => {
    const now = Date.now();
    const entry = withUUIDs({ id: uuidv4(), date: now, updatedAt: now, ...data });
    setStore(s => ({ ...s, log: [...s.log, entry] }));
    return entry;
  };
  /* ---- Cuerpo ---- */
  const upsertBody = (rec, quick) => {
    const now = Date.now();
    setStore(s => {
      const list = s.body || [];
      const i = list.findIndex(b => b.date === rec.date);
      if (i >= 0) { const next = [...list]; next[i] = { ...list[i], ...rec, updatedAt: now }; return { ...s, body: next }; }
      const id = uuidv4();
      const empty = Object.fromEntries(BODY_FIELDS.map(x => [x.k, null]));
      return { ...s, body: [...list, { id, uuid: id, ...empty, notes: '', ...rec, updatedAt: now }].sort((a, b) => (a.date < b.date ? -1 : 1)) };
    });
    setBodySheet(null);
    showToast(quick ? '⚖️ Peso guardado' : '📏 Registro guardado');
  };
  const deleteBody = async (b) => {
    const ok = await ask({ title: '¿Borrar este registro?', text: `${fmtDay(b.date)}. No se puede deshacer.`, confirm: 'Borrar', danger: true });
    if (!ok) return;
    setStore(s => ({ ...s, body: (s.body || []).filter(x => x.uuid !== b.uuid) }));
    setBodySheet(null);
    showToast('🗑️ Registro borrado');
  };
  const upsertCheckin = (rec) => {
    const now = Date.now();
    setStore(s => {
      const list = s.checkins || [];
      const i = list.findIndex(c => c.week === rec.week);
      if (i >= 0) { const next = [...list]; next[i] = { ...list[i], ...rec, updatedAt: now }; return { ...s, checkins: next }; }
      const id = uuidv4();
      return { ...s, checkins: [...list, { id, uuid: id, ...rec, updatedAt: now }].sort((a, b) => (a.week < b.week ? -1 : 1)) };
    });
    showToast('✅ Check-in guardado');
  };

  const updateEntry = (next) => {
    const fixed = withUUIDs(next);
    setStore(s => ({ ...s, log: s.log.map(e => (e.id === fixed.id ? fixed : e)) }));
    setEditEntry(null);
    setSheet(fixed);
    showToast('✏️ Sesión actualizada');
  };
  const removeEntry = (id) => setStore(s => ({ ...s, log: s.log.filter(e => e.id !== id) }));

  /* ---- Flujo de fuerza ---- */
  const goFuerza = () => { buzz(); if (draft) setScreen(draft.stage); else setScreen('routine'); };
  const pickRoutine = (r) => { buzz(); setPick(r); setScreen('complement'); };
  const startWorkout = (comp, cardio) => {
    buzz(15);
    setDraft(buildDraft(pick, comp, cardio, store.week, store.log));
    setScreen('workout');
  };
  const pauseWorkout = () => { setScreen('home'); showToast('⏸ Entreno en pausa, se guarda solo'); };
  const finishWorkout = () => { buzz(25); setScreen('finish'); };
  const backToWorkout = () => { setDraft(d => ({ ...d, stage: 'workout' })); setScreen('workout'); };
  const discardDraft = async () => {
    const ok = await ask({ title: '¿Descartar el entreno?', text: 'Se perderán las series registradas en esta sesión.', confirm: 'Descartar', danger: true });
    if (!ok) return;
    setDraft(null); setScreen('home'); showToast('Entreno descartado');
  };
  const saveWorkout = async (session) => {
    if (session.totalSets === 0) {
      const ok = await ask({ title: 'No has marcado ninguna serie', text: 'Marca con ✓ las series hechas para que cuenten. ¿Guardar igualmente?', confirm: 'Guardar' });
      if (!ok) return;
    }
    const prs = findPRs(store.log, draft.exList).length;
    addSession(session);
    setDraft(null);
    setScreen('home');
    showToast(prs ? `🏆 Sesión guardada · ${prs} récord${prs > 1 ? 's' : ''}` : '💪 Sesión guardada');
  };

  /* ---- Otros registros ---- */
  const saveCardio = (data) => { addSession(data); setScreen('home'); showToast('🏃 Cardio registrado'); };
  const registerRest = () => {
    buzz();
    const today = store.log.filter(s => dayKey(s.date) === dayKey(Date.now()));
    if (today.some(s => s.type === 'descanso')) { showToast('🌙 Hoy ya está marcado'); return; }
    if (today.some(isTraining)) { showToast('💪 Hoy ya has entrenado'); return; }
    const entry = addSession({ type: 'descanso' });
    showToast('🌙 Descanso registrado', { label: 'Deshacer', fn: () => removeEntry(entry.id) });
  };
  const deleteEntry = async (entry) => {
    const ok = await ask({ title: '¿Eliminar esta sesión?', text: `${entryView(entry).title} · ${fmtDate(entry.date)}. No se puede deshacer.`, confirm: 'Eliminar', danger: true });
    if (!ok) return;
    removeEntry(entry.id); setSheet(null); showToast('🗑️ Sesión eliminada');
  };

  /* ---- Datos ---- */
  const exportData = async () => {
    const json = JSON.stringify(store, null, 2);
    const name = `strybe-${new Date().toISOString().slice(0, 10)}.json`;
    try {
      const file = new File([json], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Copia de STRYBE' });
        showToast('📤 Copia lista');
        return;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }
    try {
      const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      showToast('📤 Datos exportados');
    } catch (e) { showToast('No se pudo exportar'); }
  };
  const importData = async (file) => {
    let parsed;
    try { parsed = JSON.parse(await file.text()); } catch (e) { showToast('❌ El archivo no es un JSON válido'); return; }
    if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.log)) { showToast('❌ No parece una copia de STRYBE'); return; }
    const next = migrate(parsed);
    const ok = await ask({ title: 'Importar copia', text: `Contiene ${next.log.length} ${next.log.length === 1 ? 'registro' : 'registros'} (semana ${next.week}). Reemplazará ${store.log.length === 1 ? 'el registro actual' : `los ${store.log.length} registros actuales`}.`, confirm: 'Importar', danger: store.log.length > 0 });
    if (!ok) return;
    setStore(next); showToast('📥 Datos importados');
  };
  /* ---- Rutinas (JSON) ---- */
  const importProgram = async (file) => {
    let raw = null, parseError = null;
    try { raw = JSON.parse(await file.text()); }
    catch (e) { parseError = 'No es un JSON válido (revisa comas, comillas y llaves): ' + String(e.message || e).slice(0, 140); }
    setProgramImport({ fileName: file.name, raw, v: raw ? validateProgram(raw) : null, parseError });
  };
  const applyImportedProgram = async (mode) => {
    const next = mergeProgram(store.program, programImport.raw, mode, 'import');
    const d = diffProgram(store.program, next);
    const ok = await ask({
      title: mode === 'replace' ? '¿Reemplazar el bloque?' : '¿Añadir estas rutinas?',
      text: `${next.json.bloque.nombre} · ${next.json.rutinas.length} rutinas.` + (d.archiving.length ? ` Se archivan: ${d.archiving.join(', ')}.` : '') + ' Tu historial no cambia.',
      confirm: 'Aplicar',
    });
    if (!ok) return;
    const weeks = next.json.bloque.semanas;
    setStore(s => ({ ...s, program: next, week: Math.min(s.week, weeks) }));
    setProgramImport(null);
    showToast('✅ Rutinas actualizadas');
  };
  const exportProgram = async () => {
    if (!store.program) return;
    const r = await shareOrDownload('strybe-rutinas.json', formatProgramJSON(store.program.json), 'application/json');
    if (r !== 'aborted') showToast(r === 'shared' ? '📤 Rutinas listas' : '📤 strybe-rutinas.json descargado');
  };

  const signIn = async (email, password) => {
    const r = await Sync.signIn(email, password);
    if (r.backup) {
      const dl = await ask({
        title: 'Copia de seguridad guardada',
        text: `Antes de subir tus ${r.entries} registros a la nube he guardado una copia en este dispositivo. ¿Quieres descargarla también como archivo .json?`,
        confirm: 'Descargar copia', cancel: 'Seguir',
      });
      if (dl) await exportData();
    }
    showToast('☁️ Sesión iniciada · sincronizando');
    Sync.syncNow();
  };
  const signOut = async () => {
    const st = Sync.state;
    const ok = await ask({ title: '¿Cerrar sesión?', text: 'Tus datos se quedan en este dispositivo.' + (st.pending ? ` Antes intentaré subir los ${st.pending} cambios pendientes.` : ''), confirm: 'Cerrar sesión' });
    if (!ok) return;
    if (st.pending && navigator.onLine !== false) await Sync.syncNow();
    if (Sync.state.pending) {
      const still = await ask({ title: 'Quedan cambios sin subir', text: `${Sync.state.pending} cambios no se han podido subir. Si cierras sesión ahora no se subirán (siguen en este dispositivo).`, confirm: 'Cerrar igualmente', danger: true });
      if (!still) return;
    }
    await Sync.signOut();
    showToast('Sesión cerrada');
  };
  const clearData = async () => {
    const ok = await ask({ title: '¿Borrar TODOS los datos?', text: 'Se eliminarán todas las sesiones, medidas, check-ins y el entreno en curso.' + (Sync.state.signedIn ? ' También se marcarán como borradas en la nube.' : '') + ' Te recomendamos exportar antes una copia.', confirm: 'Borrar todo', danger: true });
    if (!ok) return;
    setStore(s => ({ ...s, week: 1, log: [], customExercises: [], body: [], checkins: [] })); setDraft(null); showToast('🗑️ Datos borrados');
  };

  /* ---- Botón/gesto "atrás" del sistema (Android) ---- */
  const backRef = useRef(() => false);
  backRef.current = () => {
    if (dialog) { closeDialog(false); return true; }
    if (sheet) { setSheet(null); return true; }
    if (bodySheet) { setBodySheet(null); return true; }
    if (summary) { setSummary(null); return true; }
    if (programImport) { setProgramImport(null); return true; }
    if (editEntry) { setEditEntry(null); return true; }
    switch (screen) {
      case 'routine': setScreen('home'); return true;
      case 'complement': setScreen('routine'); return true;
      case 'workout': pauseWorkout(); return true;
      case 'finish': backToWorkout(); return true;
      case 'cardio': case 'history': case 'progress': case 'body': case 'settings': setScreen('home'); return true;
      default: return false;
    }
  };
  useEffect(() => {
    try { history.replaceState({ strybe: 'base' }, ''); history.pushState({ strybe: 'app' }, ''); } catch (e) {}
    const onPop = () => {
      if (backRef.current()) { try { history.pushState({ strybe: 'app' }, ''); } catch (e) {} }
      else { try { history.back(); } catch (e) {} }
    };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  const isBaseTab = BASE_TABS.includes(screen);
  const draftRoutineMissing = (screen === 'workout' || screen === 'finish') && !draft;
  useEffect(() => { if (draftRoutineMissing) setScreen('home'); }, [draftRoutineMissing]);

  if (!programOk) {
    return (
      <div className="app-shell" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 14, padding: 32, textAlign: 'center' }}>
        <div style={{ fontSize: 46 }} aria-hidden="true">📋</div>
        <div style={{ fontSize: 18, fontWeight: 700 }}>No se pudieron cargar las rutinas</div>
        <div className="dim" style={{ fontSize: 14, maxWidth: 290, lineHeight: 1.5 }}>Falta routines.json o no es válido. Conéctate a internet y recarga; tus datos siguen guardados.</div>
        <button className="btn-primary" style={{ maxWidth: 260 }} onClick={() => location.reload()}>Recargar</button>
      </div>
    );
  }

  return (
    <div className="app-shell">
      {screen !== 'workout' && <div className="aurora-field" aria-hidden="true"><div className="aurora a1" /><div className="aurora a2" /><div className="aurora a3" /></div>}

      {screen === 'home' && <HomeScreen store={store} stats={stats} draft={draft} nextRoutine={nextRoutine}
        onFuerza={goFuerza}
        onCardio={() => { buzz(); setScreen('cardio'); }}
        onDescanso={registerRest}
        onResume={goFuerza}
        onDiscard={discardDraft}
        goHistory={() => setScreen('history')}
        goSettings={() => setScreen('settings')}
        onOpen={setSheet} />}

      {screen === 'history' && <HistoryScreen log={store.log} onOpen={setSheet} />}
      {screen === 'progress' && <ProgressScreen log={store.log} onSummary={setSummary} />}
      {screen === 'body' && <BodyScreen store={store} onUpsertBody={upsertBody} onOpenBody={setBodySheet} onUpsertCheckin={upsertCheckin} />}
      {screen === 'settings' && <SettingsScreen store={store} setWeek={setWeek}
        setName={(n) => setStore(s => ({ ...s, name: n }))}
        setSetting={(k, v) => setStore(s => ({ ...s, settings: { ...s.settings, [k]: v } }))}
        onExport={exportData} onImport={importData} onClear={clearData} onCheckUpdate={checkUpdate}
        onSignIn={signIn} onSignOut={signOut} onImportProgram={importProgram} onExportProgram={exportProgram} />}

      {screen === 'routine' && <RoutineScreen store={store} setWeek={setWeek} onPick={pickRoutine} onBack={() => setScreen('home')} doneSet={doneSet} />}
      {screen === 'complement' && pick && <ComplementScreen routine={pick} onStart={startWorkout} onBack={() => setScreen('routine')} />}
      {screen === 'workout' && draft && <WorkoutScreen draft={draft} setDraft={setDraft} settings={store.settings}
        log={store.log} catalog={catalog} onCreateExercise={addCustomExercise} onFinish={finishWorkout} onPause={pauseWorkout} />}
      {screen === 'finish' && draft && <FinishScreen draft={draft} setDraft={setDraft} log={store.log} onSave={saveWorkout} onBack={backToWorkout} onDiscard={discardDraft} />}
      {screen === 'cardio' && <CardioScreen onSave={saveCardio} onBack={() => setScreen('home')} />}

      {isBaseTab && <BottomNavigation active={screen} onChange={(k) => { buzz(); setScreen(k); }} />}
      {toast && (
        <div className={`toast ${isBaseTab ? '' : 'low'}`} key={toast.key} role="status">
          <span>{toast.msg}</span>
          {toast.action && <button onClick={() => { toast.action.fn(); setToast(null); }}>{toast.action.label}</button>}
        </div>
      )}
      {sheet && <Sheet onClose={() => setSheet(null)} label="Detalle de la sesión"><EntryDetail entry={sheet} onDelete={deleteEntry} onEdit={(e) => { setSheet(null); setEditEntry(e); }} /></Sheet>}
      {bodySheet && <Sheet onClose={() => setBodySheet(null)} label="Registro corporal">
        <BodyForm key={bodySheet} body={store.body || []} initialDate={bodySheet} onSave={(r) => upsertBody(r, false)} onDelete={deleteBody} />
      </Sheet>}
      {editEntry && <Sheet onClose={() => setEditEntry(null)} label="Editar sesión">
        <EditSessionSheet entry={editEntry} onSave={updateEntry} onCancel={() => setEditEntry(null)} />
      </Sheet>}
      {programImport && <Sheet onClose={() => setProgramImport(null)} label="Importar rutinas">
        <ProgramImportSheet data={programImport} current={store.program} onApply={applyImportedProgram} />
      </Sheet>}
      {summary && <Sheet onClose={() => setSummary(null)} label="Resumen para el entrenador">
        <SummarySheet store={store} kind={summary} onToast={showToast} />
      </Sheet>}
      {dialog && <Dialog d={dialog} onClose={closeDialog} />}
    </div>
  );
}

/* Red de seguridad: si algo falla al pintar, no perder los datos. */
class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  exportRaw() {
    try {
      const raw = localStorage.getItem(STORE_KEY) || LEGACY_KEYS.map(k => localStorage.getItem(k)).find(Boolean) || '{}';
      const url = URL.createObjectURL(new Blob([raw], { type: 'application/json' }));
      const a = document.createElement('a'); a.href = url; a.download = 'strybe-rescate.json'; document.body.appendChild(a); a.click(); a.remove();
    } catch (e) {}
  }
  render() {
    if (!this.state.error) return this.props.children;
    return (
      <div className="app-shell" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 14, padding: 32, textAlign: 'center' }}>
        <div style={{ fontSize: 46 }} aria-hidden="true">🛠️</div>
        <div style={{ fontSize: 18, fontWeight: 700 }}>Algo ha fallado</div>
        <div className="dim" style={{ fontSize: 14, maxWidth: 280, lineHeight: 1.5 }}>Tus datos siguen guardados. Prueba a recargar; si se repite, descarga una copia.</div>
        <button className="btn-primary" style={{ maxWidth: 260 }} onClick={() => location.reload()}>Recargar</button>
        <button className="btn-ghost" style={{ maxWidth: 260 }} onClick={() => this.exportRaw()}>Descargar copia de datos</button>
        <button className="btn-text" style={{ maxWidth: 260 }} onClick={() => { saveDraft(null); location.reload(); }}>Descartar entreno en curso y recargar</button>
      </div>
    );
  }
}

if (!window.__strybeMounted) {
  window.__strybeMounted = true;
  if (window.__bootWatchdog) clearTimeout(window.__bootWatchdog);
  const __rootEl = document.getElementById('root');
  __rootEl.innerHTML = '';
  ReactDOM.createRoot(__rootEl).render(<ErrorBoundary><App /></ErrorBoundary>);
}
</script>
</body>
</html>
