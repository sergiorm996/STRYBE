<title>STRYBE — Entrena. Progresa. Supérate.</title>
<link rel="manifest" href="./manifest.webmanifest" />

<link rel="apple-touch-icon" href="./icon-192.png" />
<script>
  /* Versión visible de la app (pantalla de carga + Ajustes). Súbela junto a CACHE en sw.js. */
  window.STRYBE_VERSION = '2.6.0';

  /* Service worker + actualización automática.
     - En el iPhone la PWA "despierta" sin recargar, así que al volver a la app (visibilitychange)
       pedimos al navegador que compruebe si hay un sw.js nuevo.
     - Cuando el sw nuevo toma el control (controllerchange) recargamos, salvo que haya un entreno
       a medias: entonces se aplica al terminarlo. */
  (function () {
    if (!('serviceWorker' in navigator)) return;
    var DRAFT_KEY = 'strybe_draft_v1';
    var hadController = !!navigator.serviceWorker.controller;
    var reloading = false;
    function hasDraft() { try { return !!localStorage.getItem(DRAFT_KEY); } catch (e) { return false; } }
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadController) { hadController = true; return; } // primera instalación: nada que actualizar
      if (reloading) return;
      if (hasDraft()) { window.__strybeUpdatePending = true; window.dispatchEvent(new Event('strybe-update')); return; }
      reloading = true;
      location.reload();
    });
    window.__strybeCheckUpdate = function () {
      return navigator.serviceWorker.getRegistration()
        .then(function (r) { return r ? r.update() : null; })
        .catch(function () {});
    };
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(function () {});
    });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') window.__strybeCheckUpdate();
    });
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous" />
<script>
  /* Carga React/Babel (versiones FIJADAS) con fallback a jsDelivr.
     crossOrigin=anonymous → respuestas CORS que el service worker puede cachear para uso offline. */
  (function () {
    var V = { react: '18.3.1', babel: '7.26.4' };
    var SRC = {
      react: ['https://unpkg.com/react@' + V.react + '/umd/react.production.min.js', 'https://cdn.jsdelivr.net/npm/react@' + V.react + '/umd/react.production.min.js'],
      reactDom: ['https://unpkg.com/react-dom@' + V.react + '/umd/react-dom.production.min.js', 'https://cdn.jsdelivr.net/npm/react-dom@' + V.react + '/umd/react-dom.production.min.js'],
      babel: ['https://unpkg.com/@babel/standalone@' + V.babel + '/babel.min.js', 'https://cdn.jsdelivr.net/npm/@babel/standalone@' + V.babel + '/babel.min.js']
    };
    function loadSeq(urls, done) {
      var i = 0;
      (function attempt() {
        if (i >= urls.length) { done(false); return; }
        var s = document.createElement('script');
        s.src = urls[i++];
        s.crossOrigin = 'anonymous';
        s.onload = function () { done(true); };
        s.onerror = function () { s.remove(); attempt(); };
        document.head.appendChild(s);
      })();
    }
    window.__bootError = function (msg) {
      if (window.__strybeMounted) return;
      var r = document.getElementById('root');
      if (r) r.innerHTML = '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;font-family:sans-serif;color:#F4F7F5;gap:14px">'
        + '<div style="font-size:46px" aria-hidden="true">📡</div>'
        + '<div style="font-size:18px;font-weight:700">No se pudo cargar la app</div>'
        + '<div style="font-size:14px;color:rgba(244,247,245,.65);max-width:280px;line-height:1.5">' + msg + '</div>'
        + '<button onclick="location.reload()" style="margin-top:8px;padding:13px 22px;border:none;border-radius:14px;background:#C6FF00;color:#06210a;font-weight:700;font-size:15px">Reintentar</button></div>';
    };
    /* Rutinas por defecto (routines.json): se cargan en paralelo con las librerías. */
    var programP = new Promise(function (resolve) {
      var done = false, finish = function (v) { if (!done) { done = true; resolve(v); } };
      setTimeout(function () { finish(null); }, 6000);
      fetch('./routines.json', { cache: 'no-cache' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(finish, function () { finish(null); });
    });
    function whenDomReady(fn) {
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn, { once: true });
      else fn();
    }
    function compile() {
      /* Babel se lanza a mano (no en DOMContentLoaded) para que las rutinas estén cargadas antes que la app. */
      try {
        if (window.Babel && Babel.transformScriptTags) Babel.transformScriptTags();
      } catch (e) {
        window.__bootError('Error al compilar la app: ' + (e && e.message ? e.message : e));
      }
    }
    loadSeq(SRC.react, function (ok1) {
      loadSeq(SRC.reactDom, function (ok2) {
        loadSeq(SRC.babel, function (ok3) {
          if (!(ok1 && ok2 && ok3)) { window.__bootError('Necesita conexión a internet la primera vez para descargar sus librerías. Conéctate y pulsa Reintentar.'); return; }
          if (window.Babel && Babel.disableScriptTags) Babel.disableScriptTags();
          window.__libsReady = true;
          programP.then(function (p) { window.__STRYBE_DEFAULT_PROGRAM = p; whenDomReady(compile); });
        });
      });
    });
  })();
</script>
<style>
  :root {
    --bg: #0D0F12;
    --card-1: rgba(26, 29, 34, 0.55);
    --card-2: rgba(26, 29, 34, 0.82);
    --stroke: rgba(255, 255, 255, 0.08);
    --stroke-strong: rgba(255, 255, 255, 0.14);
    --text: #F4F7F5;
    --text-dim: rgba(244, 247, 245, 0.62);
    --text-faint: rgba(244, 247, 245, 0.42);
    --radius: 28px;
    --radius-sm: 20px;
    --shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    --lime: #C6FF00;
    --lime-deep: #7CFF00;
    --lime-ink: #06210a;
    --lime-glow: rgba(198, 255, 0, 0.42);
    --lime-soft: rgba(198, 255, 0, 0.1);
    --blue-a: #3B82F6; --blue-b: #60A5FA;
    --violet-a: #8B5CF6; --violet-b: #D946EF;
    --coral-a: #F43F5E; --coral-b: #FB923C;
    --amber-a: #F59E0B; --amber-b: #FACC15;
    --cyan-a: #06B6D4; --cyan-b: #22D3EE;
    --danger: #FB7185;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
    overscroll-behavior: none;
  }
  /* La app se ancla a los bordes REALES de la pantalla (no usa vh: en el iPhone
     instalado, 100vh incluye la barra de estado y empujaba la barra inferior fuera). */
  #root { position: fixed; inset: 0; overflow: hidden; }
  button { font-family: inherit; color: inherit; border: none; background: none; cursor: pointer; }
  button:disabled { cursor: default; }
  input { font-family: inherit; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .cond { font-family: 'Montserrat', sans-serif; }

  /* ---------- App shell / phone frame ---------- */
  .app-shell {
    position: relative; width: 100%; max-width: 440px; height: 100%;
    margin: 0 auto; overflow: hidden; background: var(--bg); isolation: isolate;
  }
  @media (min-width: 480px) {
    body { background: #000; }
    #root { display: flex; align-items: center; justify-content: center; }
    .app-shell {
      width: 440px; flex: 0 0 440px;
      height: 900px; max-height: 96vh; border-radius: 46px;
      border: 1px solid rgba(255,255,255,0.07);
      box-shadow: 0 40px 120px rgba(0,0,0,0.7), inset 0 0 0 8px #060809;
    }
  }

  /* ---------- Auroras (estáticas en el entreno para ahorrar batería) ---------- */
  .aurora-field { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .aurora { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.38; }
  .aurora.a1 { width: 360px; height: 360px; top: -120px; left: -90px;
    background: radial-gradient(circle, rgba(198,255,0,0.5), transparent 70%); animation: drift1 18s ease-in-out infinite; }
  .aurora.a2 { width: 320px; height: 320px; top: 35%; right: -120px;
    background: radial-gradient(circle, rgba(139,92,246,0.45), transparent 70%); animation: drift2 22s ease-in-out infinite; }
  .aurora.a3 { width: 300px; height: 300px; bottom: -100px; left: 10%;
    background: radial-gradient(circle, rgba(59,130,246,0.38), transparent 70%); animation: drift3 26s ease-in-out infinite; }
  .aurora-field.still .aurora { animation: none; opacity: 0.25; }
  @keyframes drift1 { 0%,100%{transform:translate3d(0,0,0)} 50%{transform:translate3d(60px,40px,0)} }
  @keyframes drift2 { 0%,100%{transform:translate3d(0,0,0)} 50%{transform:translate3d(-50px,60px,0)} }
  @keyframes drift3 { 0%,100%{transform:translate3d(0,0,0)} 50%{transform:translate3d(40px,-50px,0)} }

  /* ---------- Scroll area ---------- */
  .screen-scroll {
    position: absolute; inset: 0; z-index: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
    padding: calc(var(--safe-t) + 18px) 18px calc(130px + var(--safe-b)); -webkit-overflow-scrolling: touch;
  }
  .screen-scroll.no-nav { padding-bottom: calc(40px + var(--safe-b)); }
  .screen-scroll.with-rest { padding-bottom: calc(130px + var(--safe-b)); }
  .screen-anim { animation: screenIn 0.42s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes screenIn { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: translateX(0); } }
  .pop-anim { animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes popIn { from { opacity: 0; transform: translateY(30px) scale(0.97); } to { opacity: 1; transform: none; } }

  /* ---------- Glass ---------- */
  .glass { background: var(--card-1); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border-radius: var(--radius); border: 1px solid var(--stroke); box-shadow: var(--shadow); }
  .glass-2 { background: var(--card-2); }
  .bento { padding: 18px; }
  .press { transition: transform 0.12s ease; }
  .press:active { transform: scale(0.96); }

  /* ---------- Typography ---------- */
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-dim); }
  .h-title { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
  .num-xl { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
  .dim { color: var(--text-dim); }
  .faint { color: var(--text-faint); }

  /* ---------- Brand bar ---------- */
  .brand-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .brand-word { font-family: 'Montserrat', sans-serif; font-weight: 800; font-style: italic;
    font-size: 23px; letter-spacing: 0.06em; color: var(--lime); text-shadow: 0 0 18px var(--lime-glow); }

  /* ---------- Header ---------- */
  .home-head { display: flex; align-items: center; gap: 13px; margin-bottom: 20px; }
  .avatar-ring { width: 54px; height: 54px; border-radius: 17px; flex-shrink: 0; display: grid; place-items: center; font-size: 26px;
    background: #090c0f; border: 2px solid var(--lime); box-shadow: 0 0 18px var(--lime-glow); overflow: hidden; }
  .avatar-ring img { width: 100%; height: 100%; object-fit: cover; border-radius: 15px; }
  .report { white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11.5px; line-height: 1.55;
    color: var(--text); background: rgba(0,0,0,0.35); border: 1px solid var(--stroke); border-radius: 16px; padding: 14px; max-height: 46vh; overflow-y: auto; margin: 0; }
  .report-actions { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 8px; margin-top: 12px; }
  .report-actions > * { padding: 14px 6px; font-size: 14.5px; min-height: 48px; white-space: nowrap; }
  .coach-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .coach-btns > * { padding: 14px 8px; font-size: 14.5px; min-height: 48px; }
  .ed-status { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .ed-status .filter { padding: 10px 12px; min-height: 40px; }
  .ed-select { width: 100%; min-height: 48px; font-size: 16px; font-family: inherit; color: var(--text); background: var(--card-2); border: 1px solid var(--stroke); border-radius: 14px; padding: 0 12px; color-scheme: dark; }
  .cal { display: flex; gap: 4px; margin-top: 12px; justify-content: space-between; }
  .cal-days, .cal-col { display: grid; grid-template-rows: repeat(7, 1fr); gap: 4px; }
  .cal-days span { font-size: 9.5px; font-weight: 600; color: var(--text-faint); height: 19px; line-height: 19px; width: 10px; }
  .cal-c { display: block; width: 19px; height: 19px; border-radius: 5px; background: rgba(255,255,255,0.05); }
  .cal-c.f { background: var(--lime); box-shadow: 0 0 6px var(--lime-glow); }
  .cal-c.c { background: var(--cyan-a); }
  .cal-c.r { background: rgba(96,165,250,0.28); }
  .cal-c.fut { background: transparent; }
  .cal-c.today { outline: 2px solid var(--text); outline-offset: 1px; }
  .cal-legend { display: flex; gap: 14px; margin-top: 10px; font-size: 11.5px; color: var(--text-dim); }
  .cal-legend span { display: flex; align-items: center; gap: 5px; }
  .cal-legend .cal-c { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  .mv { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .mv-row { display: flex; align-items: center; gap: 10px; }
  .mv-name { width: 72px; font-size: 12.5px; font-weight: 600; color: var(--text-dim); flex-shrink: 0; }
  .mv-bars { flex: 1; height: 26px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; align-items: end; }
  .mv-bar { display: block; border-radius: 4px 4px 2px 2px; background: rgba(198,255,0,0.35); }
  .mv-bar.cur { background: var(--lime); }
  .mv-val { width: 20px; text-align: right; font-size: 13px; font-weight: 700; font-family: 'Montserrat', sans-serif; }
  .err-list { font-size: 13px; line-height: 1.5; color: var(--danger); background: rgba(251,113,133,0.08); border: 1px solid rgba(251,113,133,0.3);
    border-radius: 14px; padding: 12px 14px; max-height: 50vh; overflow-y: auto; word-break: break-word; }
  .warn-box { font-size: 13px; line-height: 1.5; color: var(--amber-b); background: rgba(250,204,21,0.08); border: 1px solid rgba(250,204,21,0.28); border-radius: 14px; padding: 11px 14px; margin-bottom: 10px; }
  .prev-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--stroke); font-size: 14px; }
  .prev-row:first-of-type { margin-top: 8px; }
  .prev-row > span:first-child { font-size: 20px; }
  .tag-st { font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 8px; text-transform: uppercase; letter-spacing: 0.04em; flex-shrink: 0; }
  .tag-st.nueva { color: var(--lime-ink); background: var(--lime); }
  .tag-st.cambia { color: var(--amber-b); background: rgba(250,204,21,0.12); }
  .tag-st.igual { color: var(--text-faint); background: rgba(255,255,255,0.06); }
  .body-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 11px; }
  .scale-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 13.5px; font-weight: 600; margin-bottom: 7px; }
  .scale-head .faint { font-size: 11.5px; font-weight: 500; }
  .scale-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .scale-btn { min-height: 46px; border-radius: 13px; background: var(--card-2); border: 1px solid var(--stroke); font-size: 16px; font-weight: 700; font-family: 'Montserrat', sans-serif; color: var(--text-dim); }
  .scale-btn.on { background: var(--lime); color: var(--lime-ink); border-color: transparent; box-shadow: 0 6px 18px var(--lime-glow); }
  .checkin-sum { font-size: 14px; font-weight: 600; margin-top: 8px; }
  input[type=date] { -webkit-appearance: none; appearance: none; min-height: 52px; color-scheme: dark; }
  .brand-right { display: flex; align-items: center; gap: 8px; }
  .sync-chip { position: relative; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 8px 11px; border-radius: 13px;
    background: var(--card-2); border: 1px solid var(--stroke); color: var(--text-dim); white-space: nowrap; max-width: 150px; }
  .sync-chip::after { content: ''; position: absolute; inset: -6px; }
  .sync-chip span:last-child { overflow: hidden; text-overflow: ellipsis; }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-faint); flex-shrink: 0; }
  .sync-ok .sync-dot { background: var(--lime); box-shadow: 0 0 8px var(--lime-glow); }
  .sync-busy .sync-dot { background: var(--blue-b); animation: syncPulse 1s ease-in-out infinite; }
  .sync-warn .sync-dot { background: var(--amber-b); }
  .sync-err .sync-dot { background: var(--danger); }
  .sync-err { color: var(--danger); border-color: rgba(251,113,133,0.35); }
  @keyframes syncPulse { 50% { opacity: 0.3; } }
  .acct-status { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid var(--stroke); font-size: 13.5px; font-weight: 600; margin-top: 12px; }
  .acct-actions { display: flex; gap: 10px; margin-top: 14px; }
  .acct-actions > * { padding: 14px; font-size: 14.5px; min-height: 48px; }
  .streak-chip { margin-left: auto; display: flex; align-items: center; gap: 5px;
    background: linear-gradient(135deg, rgba(251,146,60,0.18), rgba(244,63,94,0.16));
    border: 1px solid rgba(251,146,60,0.35); color: #FFB27A; font-weight: 600; font-size: 13px; padding: 7px 12px; border-radius: 14px; }

  /* ---------- Section ---------- */
  .section-head { display: flex; align-items: center; justify-content: space-between; margin: 26px 4px 13px; }
  .section-head h2 { font-size: 19px; font-weight: 600; letter-spacing: -0.02em; }
  .section-link { font-size: 13px; color: var(--lime); font-weight: 600; padding: 6px 2px; }

  /* ---------- Stat grid ---------- */
  .bento-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 11px; }
  .stat-card { padding: 16px 10px; text-align: center; }
  .stat-val { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-family: 'Montserrat', sans-serif; white-space: nowrap; }
  .stat-val small { font-size: 13px; font-weight: 600; color: var(--text-dim); margin-left: 2px; }
  .stat-label { font-size: 11px; color: var(--text-dim); font-weight: 500; margin-top: 6px; }

  /* ---------- Week strip ---------- */
  .week-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 11px; padding: 12px 10px; }
  .wd { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .wd-l { font-size: 10.5px; font-weight: 600; color: var(--text-faint); text-transform: uppercase; }
  .wd-c { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; font-size: 16px;
    background: rgba(255,255,255,0.04); border: 1px solid var(--stroke); }
  .wd.today .wd-l { color: var(--lime); }
  .wd.today .wd-c { border-color: rgba(198,255,0,0.55); }
  .wd-c.train { background: var(--lime-soft); border-color: rgba(198,255,0,0.3); }

  /* ---------- Banner ---------- */
  .banner { display: flex; align-items: center; gap: 13px; padding: 15px 16px; margin-bottom: 14px; border-radius: 22px;
    background: linear-gradient(135deg, rgba(198,255,0,0.14), rgba(124,255,0,0.05)); border: 1px solid rgba(198,255,0,0.35); }
  .banner .b-ico { font-size: 26px; }
  .banner .b-t { font-weight: 700; font-size: 15px; }
  .banner .b-s { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; }
  .banner-actions { display: flex; gap: 8px; margin-left: auto; flex-shrink: 0; }
  .chip-btn { padding: 9px 13px; border-radius: 12px; font-weight: 700; font-size: 13px; background: var(--card-2); border: 1px solid var(--stroke); }
  .chip-btn.lime { background: var(--lime); color: var(--lime-ink); border-color: transparent; }

  /* ---------- Action buttons ---------- */

    muscle: MUSCLES.includes(x.muscle) ? x.muscle : (cat ? cat.muscle : null),

    substitutedFor: status === 'substituted' ? (x.substitutedFor || null) : null,

  if (!out.target && cat && cat.def) {
    const p = planForWeek(cat.def, entry.week);
    out.target = { series: cat.def.series, reps: cat.def.reps, rir: cat.def.rir, plan: p && p.exact ? p.str : null };

}
function sanitizeCustomExercises(list) {
  const seen = new Set(BASE_CATALOG.map(e => nameKey(e.name)));
  const out = [];
  (Array.isArray(list) ? list : []).forEach(e => {
    if (!e || typeof e !== 'object') return;
    const name = normName(e.name), k = nameKey(name);
    if (!k || seen.has(k)) return;

/* ---------- Seguimiento corporal ---------- */
const BODY_FIELDS = [
  { k: 'weight', label: 'Peso', unit: 'kg', min: 20, max: 400 },
  { k: 'fat', label: 'Grasa', unit: '%', min: 1, max: 80 },
  { k: 'muscle', label: 'Músculo', unit: '%', min: 1, max: 80 },
  { k: 'waist', label: 'Cintura', unit: 'cm', min: 20, max: 300 },
  { k: 'chest', label: 'Pecho', unit: 'cm', min: 20, max: 300 },
  { k: 'arm', label: 'Brazo', unit: 'cm', min: 10, max: 150 },
  { k: 'thigh', label: 'Muslo', unit: 'cm', min: 10, max: 200 },
];
const CHECKIN_FIELDS = [
  { k: 'sleep', label: 'Sueño', low: 'Fatal', high: 'Genial' },
  { k: 'energy', label: 'Energía', low: 'Sin fuerzas', high: 'A tope' },
  { k: 'stress', label: 'Estrés', low: 'Nada', high: 'Mucho' },
];
const ISO_DAY_RE = /^\d{4}-\d{2}-\d{2}$/;
/* Una entrada por fecha (si hay repetidas, se queda la más reciente). Idempotente. */
function sanitizeBody(list) {
  const byDate = new Map();
  (Array.isArray(list) ? list : []).forEach(b => {
    if (!b || typeof b !== 'object' || !ISO_DAY_RE.test(b.date)) return;
    const id = b.id ? String(b.id) : uuidv4();
    const x = { id, uuid: stableUUID(b.uuid, id), date: b.date, updatedAt: Number(b.updatedAt) || Date.now(), notes: typeof b.notes === 'string' ? b.notes.slice(0, 500) : '' };
    BODY_FIELDS.forEach(f => { const n = Number(b[f.k]); x[f.k] = Number.isFinite(n) && n > 0 ? Math.round(n * 100) / 100 : null; });
    const prev = byDate.get(b.date);
    if (!prev || x.updatedAt >= prev.updatedAt) byDate.set(b.date, x);
  });
  return [...byDate.values()].sort((a, b) => (a.date < b.date ? -1 : 1));
}
/* Un check-in por semana (week = lunes, YYYY-MM-DD). */
function sanitizeCheckins(list) {
  const byWeek = new Map();
  (Array.isArray(list) ? list : []).forEach(c => {
    if (!c || typeof c !== 'object' || !ISO_DAY_RE.test(c.week)) return;
    const id = c.id ? String(c.id) : uuidv4();
    const x = { id, uuid: stableUUID(c.uuid, id), week: c.week, updatedAt: Number(c.updatedAt) || Date.now(), notes: typeof c.notes === 'string' ? c.notes.slice(0, 500) : '' };
    CHECKIN_FIELDS.forEach(f => { const n = parseInt(c[f.k], 10); x[f.k] = n >= 1 && n <= 5 ? n : null; });
    const prev = byWeek.get(c.week);
    if (!prev || x.updatedAt >= prev.updatedAt) byWeek.set(c.week, x);
  });
  return [...byWeek.values()].sort((a, b) => (a.week < b.week ? -1 : 1));

/* Programa guardado → válido; si es el de por defecto y routines.json ha cambiado, se actualiza solo. */
function resolveProgram(p) {
  if (p && p.json && validateProgram(p.json).ok) {
    const sp = {
      json: p.json, source: p.source || 'import', sig: p.sig || null, updatedAt: Number(p.updatedAt) || 0,
      archived: Array.isArray(p.archived) ? p.archived.filter(a => a && a.json && typeof a.json.id === 'string' && ['rutina', 'complemento'].includes(a.kind)) : [],
    };
    if (sp.source === 'default' && DEFAULT_PROGRAM_JSON && sp.sig !== DEFAULT_PROGRAM_SIG) return mergeProgram(sp, DEFAULT_PROGRAM_JSON, 'replace', 'default');
    return sp;
  }
  return DEFAULT_PROGRAM_JSON ? mergeProgram(null, DEFAULT_PROGRAM_JSON, 'replace', 'default') : null;
}

function migrate(raw) {
  const s = { v: 6, program: null, body: [], checkins: [], week: 1, name: DEFAULT_NAME, settings: { ...DEFAULT_SETTINGS }, customExercises: [], log: [] };
  s.program = resolveProgram(raw && raw.program);
  applyProgram(compileProgram(s.program));
  if (!raw || typeof raw !== 'object') return s;
  s.week = clampWeek(raw.week);
  if (typeof raw.name === 'string' && raw.name.trim()) s.name = raw.name.trim().slice(0, 24);
  if (raw.settings && typeof raw.settings === 'object') s.settings = { ...s.settings, ...raw.settings };
  s.customExercises = sanitizeCustomExercises(raw.customExercises);
  s.body = sanitizeBody(raw.body);
  s.checkins = sanitizeCheckins(raw.checkins);

  const seen = new Set();
  const out = [];
  const entries = (Array.isArray(raw.log) ? raw.log : [])
    .filter(e => e && typeof e === 'object' && ['fuerza', 'cardio', 'descanso'].includes(e.type))
    .map(e => ({ ...e, date: Number(e.date) || Date.now() }))
    .sort((a, b) => a.date - b.date);

  entries.forEach(entry => {
    // v1 guardaba el cardio post-entreno como sesión aparte → se fusiona con su entreno
    if (entry.type === 'cardio' && entry.cardioType === 'Post-entreno') {
      const prev = out[out.length - 1];
      if (prev && prev.type === 'fuerza' && dayKey(prev.date) === dayKey(entry.date)) {
        prev.cardio = { type: 'Post-entreno', duration: Number(entry.duration) || POST_CARDIO_MIN, distance: Number.isFinite(entry.distance) ? entry.distance : null };
        return;
      }
    }
    if (entry.type === 'fuerza') {
      if (entry.cardio === true) entry.cardio = { type: 'Post-entreno', duration: POST_CARDIO_MIN, distance: null };
      else if (!entry.cardio || typeof entry.cardio !== 'object') entry.cardio = null;
      entry.week = clampHistWeek(entry.week);
      entry.exercises = Array.isArray(entry.exercises)
        ? entry.exercises.filter(x => x && typeof x === 'object').map(x => normalizeSessionExercise(x, entry, s.customExercises))
        : [];
      // Totales siempre calculados desde las series (sin calentamiento ni ejercicios saltados).
      Object.assign(entry, sessionTotals(entry.exercises));
      if (!entry.routineKey) { const r = ROUTINES.find(x => x.name === entry.routine); if (r) entry.routineKey = r.key; }
    }
    if (entry.type === 'cardio') {
      entry.duration = Number(entry.duration) || 0;
      entry.distance = Number.isFinite(entry.distance) ? entry.distance : null;
      entry.cardioType = entry.cardioType || 'Cardio';
    }
    let id = entry.id != null ? String(entry.id) : '';
    if (!id || seen.has(id)) id = uid();
    seen.add(id);
    entry.id = id;
    out.push(entry);
  });
  // UUID al final (el cardio post-entreno de v1 se fusiona más arriba) y sin repetidos.
  const seenU = new Set();
  s.log = out.map(e => {
    let x = withUUIDs(e);
    if (seenU.has(x.uuid)) x = withUUIDs({ ...x, uuid: uuidv4() });
    seenU.add(x.uuid);
    return x;
  });
  return s;
}

function loadStore() {
  let raw = readJSON(STORE_KEY);
  if (!raw) for (const k of LEGACY_KEYS) { raw = readJSON(k); if (raw) break; }
  return migrate(raw);
}
function saveStore(s) {

}

/* ============================================================
   HELPERS
   ============================================================ */
const MONTHS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MONTHS_LONG = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DAYS = ['dom','lun','mar','mié','jue','vie','sáb'];
const WEEK_LETTERS = ['L','M','X','J','V','S','D'];

function fmtDate(ts) { const d = new Date(ts); return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; }
function fmtTime(ts) { const d = new Date(ts); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; }
function fmtClock(sec) { const m = Math.floor(sec / 60), s = sec % 60; return `${m}:${String(s).padStart(2, '0')}`; }
function fmtMin(min) { if (!min) return '0 min'; const h = Math.floor(min / 60), m = min % 60; return h ? `${h} h ${m ? m + ' min' : ''}`.trim() : `${m} min`; }
function fmtKg(n) { return (Math.round(n * 10) / 10).toLocaleString('es', { maximumFractionDigits: 1 }); }
function dayKey(ts) { const d = new Date(ts); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }
function startOfWeek(ts = Date.now()) { const d = new Date(ts); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d; }
const num = (v) => { const n = parseFloat(String(v ?? '').replace(',', '.')); return Number.isFinite(n) ? n : 0; };
const int = (v) => parseInt(v, 10) || 0;
const isTraining = (e) => e.type === 'fuerza' || e.type === 'cardio';

/* Inputs: sólo dígitos y un separador decimal (kg) / sólo dígitos (reps, minutos). */
function sanitizeDecimal(v, maxLen = 6) {
  let s = String(v).replace(/[^\d.,]/g, '');
  const i = s.search(/[.,]/);
  if (i >= 0) s = s.slice(0, i + 1) + s.slice(i + 1).replace(/[.,]/g, '');
  return s.slice(0, maxLen);
}
const sanitizeInt = (v, maxLen = 3) => String(v).replace(/\D/g, '').slice(0, maxLen);

function buzz(p = 8) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

/* Sonido del temporizador (WebAudio; se "desbloquea" con un toque del usuario). */
let __audio = null;
function unlockAudio() {
  try {
    if (!__audio) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) __audio = new AC(); }
    if (__audio && __audio.state === 'suspended') __audio.resume();
  } catch (e) {}
}
function beep() {
  try {
    if (!__audio) return;
    const t = __audio.currentTime;
    [0, 0.22, 0.44].forEach(off => {
      const o = __audio.createOscillator(), g = __audio.createGain();
      o.frequency.value = off === 0.44 ? 1175 : 880;
      g.gain.setValueAtTime(0.0001, t + off);
      g.gain.exponentialRampToValueAtTime(0.3, t + off + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + off + 0.18);
      o.connect(g); g.connect(__audio.destination);
      o.start(t + off); o.stop(t + off + 0.2);
    });
  } catch (e) {}
}

/* ---------- Estadísticas ---------- */
function computeStats(log) {
  const training = log.filter(isTraining);
  const weekStart = startOfWeek().getTime();
  const weekCount = new Set(training.filter(s => s.date >= weekStart).map(s => dayKey(s.date))).size;
  // Racha: días con entreno seguidos. Un descanso marcado no rompe la racha (pero no suma).
  const active = new Set(training.map(s => dayKey(s.date)));
  const rest = new Set(log.filter(s => s.type === 'descanso').map(s => dayKey(s.date)));
  let streak = 0;
  const d = new Date();
  const k0 = dayKey(d.getTime());
  if (!active.has(k0) && !rest.has(k0)) d.setDate(d.getDate() - 1);
  for (let guard = 0; guard < 3650; guard++) {
    const k = dayKey(d.getTime());
    if (active.has(k)) streak++;
    else if (!rest.has(k)) break;
    d.setDate(d.getDate() - 1);
  }
  return { total: training.length, week: weekCount, streak };
}

function routineKeyOf(e) {
  if (e.routineKey) return e.routineKey;
  const r = ROUTINES.find(x => x.name === e.routine);
  return r ? r.key : null;
}
function doneRoutinesForWeek(log, week) {
  return new Set(log.filter(e => e.type === 'fuerza' && e.week === week).map(routineKeyOf).filter(Boolean));
}

/* ---------- Plan del entrenador ---------- */
/* Plan del entrenador para una semana: { "1": [[42, 8], [42, "Clúster"]], … }.
   Si esa semana no tiene plan se usa la anterior más cercana como referencia. */
const kgText = (kg) => (typeof kg === 'number' ? String(kg).replace('.', ',') : String(kg));
function planForWeek(ex, week) {
  const p = ex && ex.plan;
  if (!p || typeof p !== 'object' || Array.isArray(p)) return null;
  const weeks = Object.keys(p).map(Number).filter(w => Array.isArray(p[w]) && p[w].length).sort((a, b) => a - b);
  if (!weeks.length) return null;
  let w = weeks.filter(x => x <= week).pop();
  if (w == null) w = weeks[0];
  const sets = p[w].map(([kg, reps]) => ({ kg: kgText(kg), reps: String(reps) }));
  return { str: sets.map(st => `${st.kg}×${st.reps}`).join(' · '), week: w, exact: w === week, sets };
}
function restSecondsFor(reps) {
  const m = String(reps).match(/\d+/);
  const n = m ? +m[0] : 12;
  return n <= 8 ? 150 : n <= 12 ? 120 : 90;
}

/* Última sesión con series reales de ese ejercicio (busca hacia atrás, conserva el índice de cada serie). */
function lastForExercise(log, exName) {
  for (let i = log.length - 1; i >= 0; i--) {
    const e = log[i];
    if (e.type !== 'fuerza') continue;
    const ex = (e.exercises || []).find(x => x.name === exName);
    if (!ex || !Array.isArray(ex.sets)) continue;
    const sets = ex.sets.map(s => (s && s.done && (String(s.kg || '') + String(s.reps || '')).length)
      ? { kg: String(s.kg || ''), reps: String(s.reps || ''), ...(s.rir != null && s.rir !== '' ? { rir: String(s.rir) } : {}), ...(s.warmup ? { warmup: true } : {}) } : null);
    if (sets.some(Boolean)) return { date: e.date, sets };
  }
  return null;
}
const fmtSets = (sets) => sets.filter(Boolean).map(s => `${s.warmup ? 'C ' : ''}${s.kg || '–'}×${s.reps || '–'}${s.rir != null && s.rir !== '' ? ` @${s.rir}` : ''}`).join('  ·  ');

/* ---------- Récords (1RM estimado, fórmula de Epley) ---------- */
function bestOfSets(sets) {
  let best = null;
  (sets || []).forEach(s => {
    if (!s || !s.done || s.warmup) return;
    const kg = num(s.kg), r = int(s.reps);
    if (kg <= 0 || r <= 0) return;
    const e1rm = kg * (1 + r / 30);
    if (!best || e1rm > best.e1rm) best = { kg, reps: r, e1rm };
  });
  return best;
}
function exerciseHistory(log, name) {
  const out = [];
  log.forEach(e => {
    if (e.type !== 'fuerza') return;
    const ex = (e.exercises || []).find(x => x.name === name);
    if (!ex) return;
    const b = bestOfSets(ex.sets);
    if (b) out.push({ date: e.date, week: e.week, ...b });
  });
  return out;
}
function findPRs(log, exList) {
  return exList.filter(e => e.status !== 'skipped').map(e => {
    const cur = bestOfSets(e.sets);
    if (!cur) return null;
    const hist = exerciseHistory(log, e.name);
    if (!hist.length) return null;
    const prev = Math.max(...hist.map(h => h.e1rm));
    return cur.e1rm > prev + 0.05 ? { name: e.name, ...cur, prev } : null;
  }).filter(Boolean);
}

/* ---------- Entreno: crear borrador y sesión ---------- */
function buildDraft(routine, complement, cardio, week, log) {
  const defs = routine.exercises.map(e => ({ ...e, group: routine.name }))
    .concat(complement && COMPLEMENT_BY_KEY[complement] ? COMPLEMENT_BY_KEY[complement].exercises.map(e => ({ ...e, group: COMPLEMENT_BY_KEY[complement].name })) : []);
  const exList = defs.map(e => {
    const plan = planForWeek(e, week);
    const last = lastForExercise(log, e.name);
    const count = plan && plan.exact ? plan.sets.length : e.series;
    const sets = Array.from({ length: count }, (_, i) => {
      // Prioridad de relleno: objetivo de esta semana → lo que hiciste la última vez → plan de referencia.
      const pExact = plan && plan.exact ? plan.sets[i] : null;
      const l = last && last.sets[i];
      const pRef = plan && !plan.exact ? plan.sets[i] : null;
      const src = pExact || l || pRef;
      const repsNum = src && /^\d+$/.test(src.reps) ? src.reps : '';
      return { kg: src ? String(src.kg || '') : '', reps: repsNum, done: false, hint: src && !repsNum && src.reps ? src.reps : '', ...(src && src === l && l.warmup ? { warmup: true } : {}) };
    });
    return { id: uid(), status: 'pending', name: e.name, group: e.group, muscle: e.muscle, reps: e.reps, series: e.series, rir: e.rir, note: e.note,
      plan: plan ? { str: plan.str, week: plan.week, exact: plan.exact } : null, last, sets };
  });
  return {
    id: uid(), routineKey: routine.key, complement, cardio, week, startedAt: Date.now(), idx: 0, stage: 'workout', exList,
    cardioData: cardio ? { type: 'Cinta', duration: String(POST_CARDIO_MIN), distance: '' } : null,
  };
}

function parseCardio(d) {
  const duration = parseInt(d.duration, 10);
  if (!(duration >= 1 && duration <= 600)) return { error: 'Pon una duración entre 1 y 600 minutos.' };
  let distance = null;
  if (String(d.distance || '').trim() !== '') {
    distance = num(d.distance);
    if (!(distance > 0 && distance <= 200)) return { error: 'La distancia no es válida (0–200 km).' };
    distance = Math.round(distance * 100) / 100;
  }
  return { value: { type: d.type, duration, distance } };
}

/* Series de un ejercicio del catálogo (puntual o sustituto), rellenadas con la última vez que lo hiciste. */
function exerciseFromCatalog(item, log, nSets) {
  const last = lastForExercise(log, item.name);
  const count = nSets || (last ? last.sets.length : 3) || 3;
  const sets = Array.from({ length: count }, (_, i) => {
    const l = last && last.sets[i];
    return { kg: l ? String(l.kg || '') : '', reps: l && /^\d+$/.test(l.reps) ? l.reps : '', done: false, hint: '' };
  });
  return { name: item.name, muscle: item.muscle || null, last, sets };
}
const isSkipped = (e) => e.status === 'skipped';
function draftProgress(d) {
  let done = 0, total = 0;
  d.exList.forEach(e => { if (isSkipped(e)) return; total += e.sets.length; done += e.sets.filter(s => s.done).length; });
  return { done, total };
}

function buildSession(draft, cardioValue) {
  const routine = ROUTINE_BY_KEY[draft.routineKey];
  let volume = 0, completed = 0;
  const exercises = [];
  draft.exList.forEach(e => {
    // Si se sustituyó y luego se marcó "No lo hice", lo que no se hizo es el original.
    const src = isSkipped(e) && e.original ? e.original : e;
    const doneSets = e.sets.filter(s => s.done);
    let status = isSkipped(e) ? 'skipped' : e.status === 'extra' ? 'extra' : e.status === 'substituted' ? 'substituted' : 'done';
    let skipReason = isSkipped(e) ? (e.skipReason || 'otro') : null;
    if (status !== 'skipped' && !doneSets.length) {
      if (status === 'extra') return; // un puntual sin series no se guarda
      status = 'skipped'; skipReason = 'sin_registrar';
    }
    const sets = status === 'skipped' ? [] : e.sets.map(s => {
      if (s.done && !s.warmup) { volume += num(s.kg) * int(s.reps); completed++; }
      return { kg: s.kg, reps: s.reps, done: s.done, ...(s.rir != null && s.rir !== '' ? { rir: s.rir } : {}), ...(s.warmup ? { warmup: true } : {}) };
    });
    exercises.push({
      id: e.id || uid(), name: src.name, group: src.group || null, muscle: src.muscle || null,
      status, skipReason, substitutedFor: status === 'substituted' ? (e.substitutedFor || null) : null,
      target: status === 'extra' ? null : { series: src.series ?? null, reps: src.reps || null, rir: src.rir ?? null, plan: src.plan && src.plan.exact ? src.plan.str : null },
      sets, ...(e.notes && e.notes.trim() ? { notes: e.notes.trim().slice(0, 500) } : {}),
    });
  });
  const end = draft.endedAt || Date.now();
  return {
    type: 'fuerza', routine: routine.name, routineKey: routine.key, icon: routine.icon, complement: draft.complement || null,
    week: draft.week, start: draft.startedAt, durationMin: Math.max(1, Math.min(300, Math.round((end - draft.startedAt) / 60000))),
    exercises, volume: Math.round(volume), totalSets: completed, cardio: cardioValue || null,
    ...(draft.notes && draft.notes.trim() ? { notes: draft.notes.trim().slice(0, 1000) } : {}),
  };
}

/* Recalcula volumen y series efectivas de una sesión (sin calentamiento, sin saltados). */
function sessionTotals(exercises) {
  let volume = 0, totalSets = 0;
  exercises.forEach(x => { if (x.status === 'skipped') return; (x.sets || []).forEach(s => { if (s.done && !s.warmup) { volume += num(s.kg) * int(s.reps); totalSets++; } }); });
  return { volume: Math.round(volume), totalSets };
}

/* Sugerencia de progresión doble: si todas las series de trabajo con el peso más alto llegaron al tope del rango

function progressionHint(ex) {
  const last = ex && ex.last;
  if (!last) return null;
  const work = last.sets.filter(s => s && !s.warmup && num(s.kg) > 0 && int(s.reps) > 0);
  if (!work.length) return null;
  const m = String(ex.reps || '').trim().match(/^(\d+)\s*[-–]\s*(\d+)$/) || String(ex.reps || '').trim().match(/^(\d+)$/);
  if (!m) return null;
  const lo = +m[1], hi = +(m[2] || m[1]);
  const topKg = Math.max(...work.map(s => num(s.kg)));
  const top = work.filter(s => num(s.kg) === topKg);
  const minReps = Math.min(...top.map(s => int(s.reps)));
  const rirs = top.map(s => s.rir).filter(r => r != null && r !== '').map(num);
  const minRir = rirs.length ? Math.min(...rirs) : null;
  const lastTxt = `${kgText(topKg)} kg × ${top.map(s => int(s.reps)).join('/')}${minRir != null ? ` con RIR ${kgText(minRir)}` : ''}`;
  const tooHard = minRir != null && ex.rir != null && minRir < ex.rir - 1;
  if (minReps >= hi && !tooHard) {
    const step = topKg < 10 ? 1 : topKg < 40 ? 2 : 2.5;
    const next = Math.round((topKg + step) * 100) / 100;
    return { up: true, kg: next, text: `La última vez ${lastTxt}: llegaste al tope (${hi}). Hoy prueba ${kgText(next)} kg y vuelve a ${lo} reps.` };
  }
  if (tooHard) return { up: false, kg: topKg, text: `La última vez ${lastTxt} (más duro de lo previsto: RIR ${ex.rir}). Mantén ${kgText(topKg)} kg.` };
  if (minReps < lo) return { up: false, kg: topKg, text: `La última vez ${lastTxt}: por debajo de ${lo}. Mantén ${kgText(topKg)} kg y busca ${lo} reps.` };
  return { up: false, kg: topKg, text: `La última vez ${lastTxt}. Mantén ${kgText(topKg)} kg y busca ${Math.min(hi, minReps + 1)} reps.` };
}

/* ---------- Hooks ---------- */
function useNow(ms, active = true) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => {
    if (!active) return;
    setNow(Date.now());
    const t = setInterval(() => setNow(Date.now()), ms);
    return () => clearInterval(t);
  }, [ms, active]);
  return now;
}
/* Mantiene la pantalla encendida durante el entreno (si el navegador lo soporta). */
function useWakeLock() {
  useEffect(() => {
    let lock = null, alive = true;
    const req = async () => {
      try {
        if ('wakeLock' in navigator && document.visibilityState === 'visible' && alive) lock = await navigator.wakeLock.request('screen');
      } catch (e) {}
    };
    req();
    const onVis = () => { if (document.visibilityState === 'visible') req(); };
    document.addEventListener('visibilitychange', onVis);
    return () => { alive = false; document.removeEventListener('visibilitychange', onVis); if (lock) lock.release().catch(() => {}); };
  }, []);
}

function Sparkline({ values, w = 92, h = 30 }) {
  if (values.length < 2) return null;
  const min = Math.min(...values), max = Math.max(...values), span = max - min || 1;
  const pts = values.map((v, i) => `${(i / (values.length - 1)) * (w - 4) + 2},${h - 3 - ((v - min) / span) * (h - 6)}`).join(' ');
  const lastPt = pts.split(' ').pop().split(',');
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} aria-hidden="true" style={{ flexShrink: 0 }}>
      <polyline points={pts} fill="none" stroke="var(--lime)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
      <circle cx={lastPt[0]} cy={lastPt[1]} r="3" fill="var(--lime)" />
    </svg>
  );
}

function ExercisePicker({ title, subtitle, catalog, exclude, onPick, onCreate, onClose }) {

  const exact = catalog.some(e => nameKey(e.name) === k);
  const groups = MUSCLES.map(m => ({ m, items: list.filter(e => (e.muscle || 'otro') === m) })).filter(g => g.items.length);
  const create = () => { const item = { name: normName(q), muscle }; onCreate(item); onPick(item); };
  const createBox = k && !exact ? (
        <div className="glass" style={{ borderRadius: 18, padding: 14, marginBottom: 14 }}>

    <Sheet onClose={onClose} label={title}>

function SessionExRow({ e, n }) {

        <div className="dim" style={{ fontSize: 12.5, marginTop: 2 }}>

            : done.length ? fmtSets(done) : 'Sin series completadas'}
        </div>
        {e.status === 'substituted' && e.substitutedFor && <div className="faint" style={{ fontSize: 12, marginTop: 2 }}>En lugar de {e.substitutedFor}</div>}
        {e.notes && <div className="faint" style={{ fontSize: 12, marginTop: 2 }}>📝 {e.notes}</div>}
      </div>
    </div>
  );
}
function sessionCounts(exercises) {
  const c = { done: 0, skipped: 0, extra: 0, substituted: 0 };
  (exercises || []).forEach(e => { if (c[e.status] != null) c[e.status]++; });
  return c;
}
function countsText(c) {
  const parts = [`${c.done + c.substituted} hechos`];
  if (c.skipped) parts.push(`${c.skipped} no ${c.skipped === 1 ? 'hecho' : 'hechos'}`);
  if (c.substituted) parts.push(`${c.substituted} ${c.substituted === 1 ? 'sustituido' : 'sustituidos'}`);
  if (c.extra) parts.push(`${c.extra} ${c.extra === 1 ? 'puntual' : 'puntuales'}`);
  return parts.join(' · ');
}

function WeekStrip({ log }) {
  const start = startOfWeek();

    return m;
  }, [log]);
  const today = dayKey(Date.now());
  return (
    <BentoCard className="week-strip">
      {WEEK_LETTERS.map((l, i) => {
        const d = new Date(start); d.setDate(start.getDate() + i);
        const k = dayKey(d.getTime());
        const entries = byDay[k] || [];
        const f = entries.find(e => e.type === 'fuerza');

}

   WORKOUT ACTIVO (todo vive en el borrador → sobrevive a cierres)
   ============================================================ */
function RestBar({ rest, now, onAdjust, onSkip }) {
  const remaining = Math.max(0, Math.ceil((rest.end - now) / 1000));
  const pct = rest.fired ? 100 : Math.min(100, ((rest.total * 1000 - (rest.end - now)) / (rest.total * 1000)) * 100);
  return (
    <div className={`rest-bar ${rest.fired ? 'fired' : ''}`} role="timer" aria-live={rest.fired ? 'assertive' : 'off'}>
      <div>
        <div className="rest-lbl">{rest.fired ? 'Descanso terminado' : 'Descanso'}</div>
        <div className="rest-time">{rest.fired ? '¡Vamos!' : fmtClock(remaining)}</div>
      </div>
      <div style={{ display: 'flex', gap: 6, marginLeft: 'auto' }}>
        <button className="rest-btn press" onClick={() => onAdjust(-15)} aria-label="Quitar 15 segundos">−15</button>
        <button className="rest-btn press" onClick={() => onAdjust(15)} aria-label="Añadir 15 segundos">+15</button>
        <button className="rest-btn press" onClick={onSkip}>{rest.fired ? 'OK' : 'Saltar'}</button>
      </div>
      {!rest.fired && <div className="rest-fill" style={{ width: pct + '%' }} />}
    </div>
  );
}

function WorkoutScreen({ draft, setDraft, settings, log, catalog, onCreateExercise, onFinish, onPause }) {
  const routine = ROUTINE_BY_KEY[draft.routineKey];
  const { exList, idx } = draft;
  const ex = exList[idx];
  const total = exList.length;
  const scrollRef = useRef(null);
  const [rest, setRest] = useState(null); // { end, total, fired }
  const [panel, setPanel] = useState(null); // 'skip' | 'sub' | 'extra'
  const [armRemove, setArmRemove] = useState(false);
  useEffect(() => { setArmRemove(false); }, [idx]);
  useEffect(() => { if (!armRemove) return; const t = setTimeout(() => setArmRemove(false), 3000); return () => clearTimeout(t); }, [armRemove]);
  const now = useNow(rest ? 250 : 30000);
  useWakeLock();

  // Aviso al terminar el descanso
  useEffect(() => {
    if (rest && !rest.fired && now >= rest.end) {
      buzz([200, 100, 200]);
      if (settings.restSound) beep();
      setRest(r => (r ? { ...r, fired: true } : r));
    }
  }, [now, rest, settings.restSound]);
  useEffect(() => {
    if (!rest || !rest.fired) return;
    const t = setTimeout(() => setRest(null), 4000);
    return () => clearTimeout(t);
  }, [rest]);

  const startRest = (sec) => { unlockAudio(); setRest({ end: Date.now() + sec * 1000, total: sec, fired: false }); };
  const adjustRest = (delta) => setRest(r => {
    if (!r) return r;
    const base = r.fired ? Date.now() : r.end;
    const end = Math.max(Date.now() + 1000, base + delta * 1000);
    return { end, total: Math.max(r.total, Math.ceil((end - Date.now()) / 1000)), fired: false };
  });

  const patchEx = (fn) => setDraft(d => ({ ...d, exList: d.exList.map((e, i) => i !== d.idx ? e : fn(e)) }));
  const update = (si, field, val) => patchEx(e => ({ ...e, sets: e.sets.map((s, j) => j !== si ? s : { ...s, [field]: val }) }));
  const toggleDone = (si) => {
    const wasDone = ex.sets[si].done;
    buzz(18);
    unlockAudio();
    patchEx(e => ({ ...e, sets: e.sets.map((s, j) => j !== si ? s : { ...s, done: !s.done }) }));
    if (!wasDone && SHOW_REST_TIMER && settings.restAuto) startRest(restSecondsFor(ex.reps));
  };
  const addSet = () => patchEx(e => {
    const last = e.sets[e.sets.length - 1] || { kg: '', reps: '' };
    return { ...e, sets: [...e.sets, { kg: last.kg, reps: last.reps, done: false, hint: '' }] };
  });
  const removeSet = () => patchEx(e => (e.sets.length > 1 ? { ...e, sets: e.sets.slice(0, -1) } : e));
  const toggleWarmup = (si) => { buzz(8); patchEx(e => ({ ...e, sets: e.sets.map((st, j) => j !== si ? st : { ...st, warmup: !st.warmup }) })); };
  const hint = useMemo(() => progressionHint(ex), [ex.last, ex.reps, ex.rir]);
  const applyHint = () => {
    if (!hint) return;
    buzz(10);
    patchEx(e => ({ ...e, sets: e.sets.map(st => (st.done || st.warmup ? st : { ...st, kg: kgText(hint.kg) })) }));
  };

  /* ---- No lo hice / sustituir / puntual ---- */
  // Si estaba sustituido, lo que no se hizo es el ejercicio original.
  const skip = (reason) => {
    buzz(15); setRest(null);
    patchEx(e => { const base = e.original ? { ...e.original } : e; return { ...base, status: 'skipped', skipReason: reason, prevStatus: base.status }; });
    setPanel(null);
  };
  const unskip = () => { buzz(); patchEx(e => ({ ...e, status: e.prevStatus || 'pending', skipReason: null, prevStatus: undefined })); };
  const substitute = (item) => {
    buzz(15);
    patchEx(e => {
      const original = e.original || e;
      if (nameKey(item.name) === nameKey(original.name)) return { ...original };
      const fresh = exerciseFromCatalog(item, log, original.sets.length);
      return { ...original, ...fresh, id: e.id, status: 'substituted', substitutedFor: original.name, note: '', plan: null, original };
    });
    setPanel(null);
  };
  const undoSubstitute = () => { buzz(); patchEx(e => (e.original ? { ...e.original } : e)); };
  const addExtra = (item) => {
    buzz(15);
    setDraft(d => ({
      ...d, idx: d.exList.length,
      exList: [...d.exList, { id: uid(), status: 'extra', group: 'Puntual', reps: '', series: null, rir: null, note: '', plan: null, ...exerciseFromCatalog(item, log) }],
    }));
    setPanel(null);
    if (scrollRef.current) scrollRef.current.scrollTop = 0;
  };
  const removeExtra = () => {
    if (!armRemove) { setArmRemove(true); return; }
    buzz(15);
    setDraft(d => {
      const exList = d.exList.filter((_, i) => i !== d.idx);
      return { ...d, exList, idx: Math.max(0, Math.min(d.idx, exList.length - 1)) };
    });
    setArmRemove(false);
  };

  const go = (n) => {
    if (n < 0 || n >= total || n === idx) return;
    buzz(8);
    setDraft(d => ({ ...d, idx: n }));
    if (scrollRef.current) scrollRef.current.scrollTop = 0;
  };

  const { done: doneSets, total: totalSets } = draftProgress(draft);
  const skipped = isSkipped(ex);
  const elapsed = Math.max(0, Math.floor((now - draft.startedAt) / 60000));

  const finish = () => {
    setRest(null);
    setDraft(d => ({ ...d, stage: 'finish', endedAt: Date.now() }));
    onFinish();
  };

  return (
    <div className="pop-anim" style={{ position: 'absolute', inset: 0, zIndex: 30, background: 'var(--bg)' }}>
      <div className="aurora-field still" aria-hidden="true"><div className="aurora a1" /><div className="aurora a2" /></div>
      <div className="wk-progress-track" role="progressbar" aria-valuemin={0} aria-valuemax={totalSets} aria-valuenow={doneSets} aria-label="Series completadas">
        <div className="wk-progress-fill" style={{ width: (totalSets ? doneSets / totalSets * 100 : 0) + '%' }} />
      </div>
      <div className={`screen-scroll no-nav ${rest ? 'with-rest' : ''}`} ref={scrollRef} style={{ paddingTop: 'calc(var(--safe-t) + 20px)' }}>
        <div className="flow-head" style={{ marginBottom: 14 }}>
          <button className="flow-back press" onClick={onPause} aria-label="Pausar y salir del entreno">✕</button>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div className="ex-counter">EJERCICIO {idx + 1} / {total} · {elapsed} MIN</div>
            <div style={{ fontSize: 14, fontWeight: 600, color: 'var(--text-dim)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
              {routine.name}{draft.complement ? ` + ${(COMPLEMENT_BY_KEY[draft.complement] || { name: draft.complement }).name}` : ''} · Sem {draft.week}</div>
          </div>
          {SHOW_REST_TIMER && !rest && !skipped && <button className="timer-btn press" onClick={() => startRest(restSecondsFor(ex.reps))} aria-label="Iniciar descanso">⏱ {fmtClock(restSecondsFor(ex.reps))}</button>}
        </div>

        <div className="ex-dots" role="tablist" aria-label="Ejercicios">
          {exList.map((e, i) => {
            const d = e.sets.filter(s => s.done).length;
            const sk = isSkipped(e);
            const state = sk ? 'no realizado' : `${d}/${e.sets.length} series`;
            return (
              <button key={e.id || i} role="tab" aria-selected={i === idx} aria-label={`${i + 1}. ${e.name}: ${state}`}
                className={`ex-dot press ${i === idx ? 'cur' : sk ? 'skip' : d === e.sets.length ? 'full' : d ? 'part' : ''} ${e.status === 'extra' ? 'extra' : ''}`} onClick={() => go(i)}>{e.status === 'extra' ? '+' : i + 1}</button>
            );
          })}
        </div>

        {ex.status === 'extra'
          ? <div className="pill" style={{ marginBottom: 12, color: 'var(--cyan-b)', borderColor: 'rgba(34,211,238,0.3)' }}>＋ Ejercicio puntual · no cambia tu rutina</div>
          : ex.group !== routine.name && <div className="pill" style={{ marginBottom: 12, color: 'var(--coral-b)', borderColor: 'rgba(251,146,60,0.3)' }}>★ Complemento · {ex.group}</div>}

        <div className="h-title" style={{ marginBottom: 12, opacity: skipped ? 0.5 : 1, textDecoration: skipped ? 'line-through' : 'none' }}>{ex.name}</div>

        {ex.status === 'substituted' && (
          <div className="sub-box">
            <div style={{ minWidth: 0 }}><div className="eyebrow">⇄ Sustituye a</div><div style={{ fontSize: 14, fontWeight: 600, marginTop: 3 }}>{ex.substitutedFor}</div></div>
            {!skipped && <button className="chip-btn press" onClick={undoSubstitute}>Volver</button>}
          </div>
        )}

        {!skipped && (
          <div className="ex-actions">
            <button className="ex-act press" onClick={() => setPanel('sub')}>⇄ Sustituir</button>
            {ex.status === 'extra'
              ? <button className={`ex-act press ${armRemove ? 'danger' : ''}`} onClick={removeExtra}>{armRemove ? '¿Seguro? Toca otra vez' : '🗑 Quitar'}</button>
              : <button className="ex-act press" onClick={() => setPanel('skip')}>⏭ No lo hice</button>}
          </div>
        )}

        {!skipped && (ex.reps || ex.series || ex.rir != null) && (
          <div style={{ display: 'flex', gap: 9, flexWrap: 'wrap', marginBottom: 16 }}>
            {ex.reps && <span className="pill">🎯 {ex.reps} reps</span>}
            {ex.series && <span className="pill">💪 {ex.series} series</span>}
            {ex.rir != null && <span className="pill">🔋 RIR {ex.rir}</span>}
          </div>
        )}

        {!skipped && ex.note && <div className="note-chip" style={{ marginBottom: 16 }}>⚡ {ex.note}</div>}

        {skipped && (
          <BentoCard className="skip-card" style={{ marginBottom: 18 }}>
            <div style={{ fontSize: 30 }} aria-hidden="true">⏭</div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 15, fontWeight: 700 }}>No realizado</div>
              <div className="hist-date">{SKIP_LABEL[ex.skipReason] || 'Sin motivo'} · no cuenta como 0 en tu progreso</div>
            </div>
            <button className="chip-btn lime press" onClick={unskip}>Deshacer</button>
          </BentoCard>
        )}

        {!skipped && (ex.plan || ex.last) && (
          <div className="ref-box" style={{ marginBottom: 20 }}>

            {ex.plan && (
              <div>
                <div className="eyebrow">{ex.plan.exact ? `📋 Objetivo semana ${draft.week}` : `📋 Plan · referencia semana ${ex.plan.week}`}</div>
                <div className="ref-val">{ex.plan.str}</div>
              </div>
            )}
            {ex.last && (
              <div>
                <div className="eyebrow">↺ Última vez · {fmtDate(ex.last.date)}</div>
                <div className="ref-val">{fmtSets(ex.last.sets)}</div>
              </div>
            )}
            {hint && (
              <div className="hint-row">
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div className="eyebrow" style={{ color: 'var(--lime)' }}>💡 Sugerencia</div>
                  <div className="ref-val" style={{ fontWeight: 500 }}>{hint.text}{ex.plan && ex.plan.exact ? ' Si no coincide con el objetivo, manda el plan del entrenador.' : ''}</div>
                </div>
                {hint.up && ex.sets.some(st => !st.done && !st.warmup && st.kg !== kgText(hint.kg)) &&
                  <button className="chip-btn lime press" onClick={applyHint} aria-label={`Usar ${kgText(hint.kg)} kilos en las series pendientes`}>Usar {kgText(hint.kg)}</button>}
              </div>
            )}
          </div>
        )}

        {!skipped && <BentoCard style={{ marginBottom: 18 }}>
          <div className="eyebrow" style={{ marginBottom: 6 }}>Registra tus series</div>
          <div className="hist-date" style={{ marginBottom: 12 }}>Toca el número para marcar calentamiento (C) · RIR opcional</div>
          {ex.sets.map((s, si) => (
            <div className={`set-row ${s.done ? 'done' : ''} ${s.warmup ? 'warm' : ''}`} key={si}>
              <button className="set-idx press" onClick={() => toggleWarmup(si)} aria-pressed={!!s.warmup}
                aria-label={`Serie ${si + 1}: ${s.warmup ? 'es de calentamiento. Quitar' : 'marcar como calentamiento'}`}>{s.warmup ? 'C' : si + 1}</button>
              <div className="set-field">
                <input className="set-inp" type="text" inputMode="decimal" placeholder="kg" aria-label={`Serie ${si + 1}: kilos`}
                  value={s.kg} onChange={e => update(si, 'kg', sanitizeDecimal(e.target.value))} />
              </div>
              <span className="set-x" aria-hidden="true">×</span>
              <div className="set-field">
                <input className="set-inp" type="text" inputMode="numeric" placeholder={s.hint || 'reps'} aria-label={`Serie ${si + 1}: repeticiones`}
                  value={s.reps} onChange={e => update(si, 'reps', sanitizeInt(e.target.value))} />
              </div>
              <div className="set-field rir">
                <input className="set-inp" type="text" inputMode="decimal" placeholder="RIR" aria-label={`Serie ${si + 1}: RIR real (opcional)`}
                  value={s.rir || ''} onChange={e => { const v = sanitizeDecimal(e.target.value, 3); update(si, 'rir', v === '' || num(v) <= 10 ? v : '10'); }} />
              </div>
              <button className={`set-check press ${s.done ? 'on' : ''}`} onClick={() => toggleDone(si)}
                aria-label={`Serie ${si + 1} ${s.done ? 'hecha. Desmarcar' : 'marcar como hecha'}`} aria-pressed={s.done}>✓</button>
            </div>
          ))}
          <div className="set-tools">
            <button className="set-tool press" onClick={removeSet} disabled={ex.sets.length <= 1}>− Quitar serie</button>
            <button className="set-tool press" onClick={addSet}>+ Añadir serie</button>
          </div>
          <div className="field" style={{ marginTop: 14, marginBottom: 0 }}>
            <label htmlFor="ex-notes" className="sr-only">Nota del ejercicio</label>
            <input id="ex-notes" type="text" maxLength={500} placeholder="📝 Nota (dolor, sensaciones, ajuste de máquina…)"
              value={ex.notes || ''} onChange={e => patchEx(x => ({ ...x, notes: e.target.value }))} />
          </div>
        </BentoCard>}

        <div className="nav-arrows">
          <button className="nav-arrow press" disabled={idx === 0} onClick={() => go(idx - 1)}>← Anterior</button>
          {idx < total - 1
            ? <button className="nav-arrow press" onClick={() => go(idx + 1)} style={{ background: 'var(--card-2)' }}>Siguiente →</button>
            : <button className="nav-arrow finish press" onClick={finish}>Finalizar ✓</button>}
        </div>
        {idx < total - 1 && (
          <button className="btn-ghost press" style={{ marginTop: 12 }} onClick={finish}>Terminar entreno ahora</button>
        )}
        <button className="btn-ghost press" style={{ marginTop: 12, borderStyle: 'dashed' }} onClick={() => setPanel('extra')}>＋ Añadir ejercicio puntual</button>

        {draft.cardio && (
          <BentoCard className="hist-item" style={{ marginTop: 18 }}>
            <div className="hist-ico" aria-hidden="true" style={{ background: 'linear-gradient(135deg, rgba(244,63,94,0.22), rgba(251,146,60,0.12))' }}>🏃</div>
            <div><div style={{ fontSize: 14, fontWeight: 600 }}>Cardio pendiente</div><div className="hist-date">{POST_CARDIO_MIN}' al terminar · lo registras al finalizar</div></div>
          </BentoCard>
        )}
      </div>
      {rest && <RestBar rest={rest} now={now} onAdjust={adjustRest} onSkip={() => setRest(null)} />}
      {panel === 'skip' && <SkipSheet exName={ex.name} onPick={skip} onClose={() => setPanel(null)} />}
      {panel === 'sub' && <ExercisePicker title="Sustituir ejercicio" subtitle={`En lugar de ${(ex.original || ex).name}`} catalog={catalog}
        exclude={ex.name} onPick={substitute} onCreate={onCreateExercise} onClose={() => setPanel(null)} />}
      {panel === 'extra' && <ExercisePicker title="Ejercicio puntual" subtitle="Solo para hoy: no se añade a la rutina" catalog={catalog}
        onPick={addExtra} onCreate={onCreateExercise} onClose={() => setPanel(null)} />}
    </div>
  );
}

/* ============================================================
   FINISH
   ============================================================ */
function CardioFields({ data, onChange, error }) {
  return (
    <>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 9, marginBottom: 16 }} role="radiogroup" aria-label="Tipo de cardio">
        {CARDIO_TYPES.map(c => (
          <button key={c.name} role="radio" aria-checked={data.type === c.name} className={`opt sm press ${data.type === c.name ? 'on' : ''}`}
            onClick={() => onChange({ ...data, type: c.name })}>
            <span className="oico" aria-hidden="true">{c.icon}</span>{c.name}</button>
        ))}
      </div>
      <BentoCard>
        <div className="field">
          <label htmlFor="cd-dur">Duración (minutos)</label>
          <input id="cd-dur" className={error && /duración/i.test(error) ? 'bad' : ''} type="text" inputMode="numeric" placeholder={String(POST_CARDIO_MIN)}
            value={data.duration} onChange={e => onChange({ ...data, duration: sanitizeInt(e.target.value) })} />
        </div>
        <div className="field" style={{ marginBottom: 0 }}>
          <label htmlFor="cd-dist">Distancia (km) · opcional</label>
          <input id="cd-dist" className={error && /distancia/i.test(error) ? 'bad' : ''} type="text" inputMode="decimal" placeholder="5,0"
            value={data.distance} onChange={e => onChange({ ...data, distance: sanitizeDecimal(e.target.value, 5) })} />
        </div>
        {error && <div className="err" role="alert">{error}</div>}
      </BentoCard>
    </>
  );
}

function FinishScreen({ draft, setDraft, log, onSave, onBack, onDiscard }) {
  const routine = ROUTINE_BY_KEY[draft.routineKey];
  const cardioRes = draft.cardio && draft.cardioData ? parseCardio(draft.cardioData) : null;
  const session = useMemo(() => buildSession(draft, cardioRes && cardioRes.value), [draft]);
  const prs = useMemo(() => findPRs(log, draft.exList), [log, draft.exList]);
  return (
    <div className="screen-scroll no-nav pop-anim">
      <div className="flow-head" style={{ marginBottom: 0 }}>
        <button className="flow-back press" onClick={onBack} aria-label="Volver al entreno">←</button>
        <div className="dim" style={{ fontSize: 13, fontWeight: 600 }}>Seguir editando</div>
      </div>
      <div style={{ textAlign: 'center', margin: '8px 0 24px' }}>
        <div style={{ fontSize: 60, marginBottom: 6 }} aria-hidden="true">{prs.length ? '🏆' : '🎉'}</div>
        <div className="h-title">¡Sesión completada!</div>
        <div className="dim" style={{ fontSize: 15, marginTop: 6 }}>{routine.name}{draft.complement ? ` + ${(COMPLEMENT_BY_KEY[draft.complement] || { name: draft.complement }).name}` : ''} · {fmtMin(session.durationMin)}</div>
      </div>

      <div className="bento-grid" style={{ marginBottom: 8 }}>
        <StatCard value={session.totalSets} unit="" label="Series" color="var(--lime)" />
        <StatCard value={session.volume >= 10000 ? fmtKg(session.volume / 1000) : session.volume.toLocaleString('es')} unit={session.volume >= 10000 ? 't' : 'kg'} label="Volumen" />
        <StatCard value={`S${draft.week}`} unit="" label="Bloque" color="var(--amber-b)" />
      </div>

      {prs.length > 0 && (
        <>
          <div className="section-head"><h2>Nuevos récords</h2></div>
          {prs.map(p => (
            <div className="pr-item" key={p.name}>
              <div style={{ fontSize: 22 }} aria-hidden="true">🏆</div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 14.5, fontWeight: 600 }}>{p.name}</div>
                <div className="dim" style={{ fontSize: 12.5, marginTop: 2 }}>{fmtKg(p.kg)} kg × {p.reps} · 1RM est. {fmtKg(p.e1rm)} kg (antes {fmtKg(p.prev)})</div>
              </div>
            </div>
          ))}
        </>
      )}

      {draft.cardio && (
        <>
          <div className="section-head"><h2>Cardio post-entreno</h2>
            <button className="section-link press" onClick={() => setDraft(d => ({ ...d, cardio: false }))}>No lo hice</button></div>
          <CardioFields data={draft.cardioData} onChange={cd => setDraft(d => ({ ...d, cardioData: cd }))} error={cardioRes && cardioRes.error} />
        </>
      )}
      {!draft.cardio && (
        <button className="btn-ghost press" style={{ marginTop: 18 }}
          onClick={() => setDraft(d => ({ ...d, cardio: true, cardioData: d.cardioData || { type: 'Cinta', duration: String(POST_CARDIO_MIN), distance: '' } }))}>
          🏃 Añadir cardio post-entreno</button>
      )}

      <div className="section-head"><h2>Detalle</h2><span className="dim" style={{ fontSize: 12.5 }}>{countsText(sessionCounts(session.exercises))}</span></div>
      {session.exercises.map((e, i) => <SessionExRow key={e.id || i} e={e} n={i + 1} />)}
      {session.exercises.some(e => e.skipReason === 'sin_registrar') && (
        <div className="faint" style={{ fontSize: 12, margin: '2px 4px 0', lineHeight: 1.45 }}>
          Los ejercicios sin series marcadas se guardan como no realizados. Si sí los hiciste, vuelve y marca las series con ✓.
        </div>
      )}

      <div className="field" style={{ marginTop: 18, marginBottom: 0 }}>
        <label htmlFor="sess-notes">Notas de la sesión</label>
        <input id="sess-notes" type="text" maxLength={1000} placeholder="Opcional: cómo te has sentido, molestias…"
          value={draft.notes || ''} onChange={e => setDraft(d => ({ ...d, notes: e.target.value }))} />
      </div>

      <div style={{ marginTop: 24 }}>
        <button className="btn-primary press" disabled={!!(cardioRes && cardioRes.error)} onClick={() => onSave(session)}>Guardar y salir</button>
        <button className="btn-text press" style={{ marginTop: 6 }} onClick={onDiscard}>Descartar entreno</button>
      </div>
    </div>
  );
}

/* ============================================================
   CARDIO LIBRE
   ============================================================ */
function CardioScreen({ onSave, onBack }) {
  const [data, setData] = useState({ type: 'Cinta', duration: '', distance: '' });
  const [tried, setTried] = useState(false);
  const res = parseCardio(data);
  const save = () => {
    setTried(true);
    if (res.value) onSave({ type: 'cardio', cardioType: res.value.type, duration: res.value.duration, distance: res.value.distance });

        <button className="btn-primary press" disabled={!data.duration} onClick={save}>Guardar cardio</button>

/* Editar una sesión guardada: kg, reps, RIR, calentamiento, estado del ejercicio y notas. */
const EDIT_STATUS = [['done', 'Hecho'], ['substituted', 'Sustituto'], ['extra', 'Puntual'], ['skipped', 'No lo hice']];
function EditSessionSheet({ entry, onSave, onCancel }) {
  const [e, setE] = useState(() => JSON.parse(JSON.stringify(entry)));
  const patchEx = (i, fn) => setE(x => ({ ...x, exercises: x.exercises.map((ex, j) => (j === i ? fn(ex) : ex)) }));
  const patchSet = (i, si, p) => patchEx(i, ex => ({ ...ex, sets: ex.sets.map((st, k) => (k === si ? { ...st, ...p } : st)) }));
  const setStatus = (i, status) => patchEx(i, ex => ({
    ...ex, status,
    skipReason: status === 'skipped' ? (ex.skipReason && ex.skipReason !== 'sin_registrar' ? ex.skipReason : 'otro') : null,
    sets: status === 'skipped' ? ex.sets : (ex.sets.length ? ex.sets : [{ kg: '', reps: '', done: true }]),
  }));
  const save = () => {
    const exercises = e.exercises.map(ex => {
      const sets = ex.status === 'skipped' ? [] : ex.sets.filter(st => String(st.kg || '') + String(st.reps || '') !== '' || st.done);
      const doneAny = sets.some(st => st.done);
      if (ex.status !== 'skipped' && !doneAny) return { ...ex, status: 'skipped', skipReason: 'sin_registrar', sets: [] };
      return { ...ex, sets, notes: (ex.notes || '').trim() || undefined };
    });
    onSave({ ...e, exercises, notes: (e.notes || '').trim() || undefined, ...sessionTotals(exercises), updatedAt: Date.now() });
  };
  return (
    <>
      <div className="h-title" style={{ fontSize: 22 }}>Editar sesión</div>
      <div className="hist-date" style={{ marginBottom: 14 }}>{e.routine} · {fmtDate(e.date)} · los cambios también se sincronizan</div>
      <div className="field">
        <label htmlFor="ed-notes">Notas de la sesión</label>
        <input id="ed-notes" type="text" maxLength={1000} value={e.notes || ''} onChange={ev => setE({ ...e, notes: ev.target.value })} />
      </div>
      {e.exercises.map((ex, i) => (
        <BentoCard key={ex.uuid || ex.id || i} style={{ marginBottom: 12, padding: 14 }}>
          <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 8 }}>{ex.name}</div>
          <div className="ed-status" role="radiogroup" aria-label={`Estado de ${ex.name}`}>
            {EDIT_STATUS.filter(([k]) => k !== 'substituted' || ex.status === 'substituted' || ex.substitutedFor).map(([k, l]) => (
              <button key={k} role="radio" aria-checked={ex.status === k} className={`filter press ${ex.status === k ? 'on' : ''}`} onClick={() => setStatus(i, k)}>{l}</button>
            ))}
          </div>
          {ex.status === 'skipped' && (
            <select className="ed-select" aria-label={`Motivo de ${ex.name}`} value={ex.skipReason || 'otro'} onChange={ev => patchEx(i, x => ({ ...x, skipReason: ev.target.value }))}>
              {[...SKIP_REASONS.map(([k, l]) => [k, l]), ['sin_registrar', 'Sin series registradas']].map(([k, l]) => <option key={k} value={k}>{l}</option>)}
            </select>
          )}
          {ex.status !== 'skipped' && (
            <>
              {ex.sets.map((st, si) => (
                <div className={`set-row ${st.done ? 'done' : ''} ${st.warmup ? 'warm' : ''}`} key={si}>
                  <button className="set-idx press" onClick={() => patchSet(i, si, { warmup: !st.warmup })} aria-pressed={!!st.warmup}
                    aria-label={`${ex.name} serie ${si + 1}: ${st.warmup ? 'calentamiento. Quitar' : 'marcar como calentamiento'}`}>{st.warmup ? 'C' : si + 1}</button>
                  <div className="set-field"><input className="set-inp" type="text" inputMode="decimal" placeholder="kg" aria-label={`${ex.name} serie ${si + 1}: kilos`}
                    value={st.kg || ''} onChange={ev => patchSet(i, si, { kg: sanitizeDecimal(ev.target.value) })} /></div>
                  <span className="set-x" aria-hidden="true">×</span>
                  <div className="set-field"><input className="set-inp" type="text" inputMode="numeric" placeholder="reps" aria-label={`${ex.name} serie ${si + 1}: repeticiones`}
                    value={st.reps || ''} onChange={ev => patchSet(i, si, { reps: sanitizeInt(ev.target.value) })} /></div>
                  <div className="set-field rir"><input className="set-inp" type="text" inputMode="decimal" placeholder="RIR" aria-label={`${ex.name} serie ${si + 1}: RIR`}
                    value={st.rir || ''} onChange={ev => { const v = sanitizeDecimal(ev.target.value, 3); patchSet(i, si, { rir: v === '' || num(v) <= 10 ? v : '10' }); }} /></div>
                  <button className={`set-check press ${st.done ? 'on' : ''}`} onClick={() => patchSet(i, si, { done: !st.done })} aria-pressed={!!st.done}
                    aria-label={`${ex.name} serie ${si + 1}: ${st.done ? 'hecha. Desmarcar' : 'marcar como hecha'}`}>✓</button>
                </div>
              ))}
              <div className="set-tools">
                <button className="set-tool press" disabled={ex.sets.length <= 1} onClick={() => patchEx(i, x => ({ ...x, sets: x.sets.slice(0, -1) }))}>− Quitar serie</button>
                <button className="set-tool press" onClick={() => patchEx(i, x => { const l = x.sets[x.sets.length - 1] || {}; return { ...x, sets: [...x.sets, { kg: l.kg || '', reps: l.reps || '', done: true }] }; })}>+ Añadir serie</button>
              </div>
            </>
          )}
          <div className="field" style={{ marginTop: 10, marginBottom: 0 }}>
            <label htmlFor={`ed-n-${i}`} className="sr-only">Nota de {ex.name}</label>
            <input id={`ed-n-${i}`} type="text" maxLength={500} placeholder="📝 Nota del ejercicio" value={ex.notes || ''} onChange={ev => patchEx(i, x => ({ ...x, notes: ev.target.value }))} />
          </div>
        </BentoCard>
      ))}
      <button className="btn-primary press" onClick={save}>Guardar cambios</button>
      <button className="btn-text press" style={{ marginTop: 6, color: 'var(--text-dim)' }} onClick={onCancel}>Cancelar</button>
    </>
  );
}
